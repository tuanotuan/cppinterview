  - id: cpp98-address-pointer-interview-code-review-001
    lessonId: cpp98-address-pointer
    type: code_reasoning
    responseMode: text
    difficulty: advanced
    interviewCategory: code_review_debug
    interviewFormat: code_review
    assessmentSkills:
      - code-review
      - pointer-safety
      - ownership
    estimatedMinutes: 10
    prompt: >-
      Review đoạn mã xử lý bản tin bên dưới như trong một pull request. Để lại nhận xét theo các dòng quan trọng: vấn đề, tác động và đề xuất sửa. Ưu tiên correctness và ownership trước các góp ý về style.
    code: |-
      struct Message {
          int* payload;
      };

      Message* clone_message(const Message* source) {
          Message* copy = new Message;
          copy->payload = source->payload;
          return copy;
      }

      void destroy_message(Message* message) {
          delete message;
      }
    hint: Xem ownership của `payload`, nullability của input và vòng đời của resource sau clone/destroy.
    answer:
      short: Review cần chỉ ra dereference source null, shallow copy payload gây alias/double free hoặc dangling tùy owner, và destroy không giải phóng payload nếu clone sở hữu nó. Contract ownership phải được thiết kế lại rõ ràng.
      detailed: >-
        `clone_message` dereference `source` mà không nêu contract non-null. Quan trọng hơn, `copy->payload = source->payload` chỉ sao chép địa chỉ: hai Message alias cùng payload nhưng code không nói ai sở hữu. Nếu cả hai nơi delete payload thì double free; nếu một nơi delete trước thì nơi còn lại dangling; nếu không ai delete thì leak. `destroy_message` chỉ delete outer object nên cũng leak nếu clone được kỳ vọng sở hữu deep copy. Review tốt cần yêu cầu model ownership rõ ràng, ưu tiên RAII/value type như vector hoặc smart pointer phù hợp, và test clone/destroy độc lập.
    rubric:
      required:
        - Nhận xét dereference `source` thiếu null contract.
        - Chỉ ra shallow copy payload tạo ownership/aliasing lỗi.
        - Nêu destructor/destroy phải khớp ownership thực tế.
      bonus:
        - Đề xuất RAII thay raw owning pointer.
        - Đề xuất test clone rồi destroy hai object độc lập.
      misconceptions:
        - Chỉ góp ý đặt tên hoặc formatting mà bỏ qua ownership.
        - Cho rằng `delete message` tự delete vùng nhớ mà payload trỏ tới.
    sources:
      - sectionId: common-mistakes
      - sectionId: notes-for-trading-code
    sourceHash: aa153e754d77a72d89eff13c9d2c517e950c1d947061bca1289f9ea3a40c045c
