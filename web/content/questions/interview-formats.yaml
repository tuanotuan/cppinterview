questions:
  - id: cpp98-address-pointer-interview-bug-001
    lessonId: cpp98-address-pointer
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: code_review_debug
    interviewFormat: bug_hunt
    assessmentSkills:
      - null-safety
      - api-contracts
      - failure-analysis
    estimatedMinutes: 5
    prompt: Trong hot path phát bản tin giá, hãy tìm lỗi có thể làm process crash trong đoạn mã bên
      dưới. Nêu điều kiện xảy ra lỗi, tác động khi production và cách sửa tối thiểu mà vẫn giữ rõ
      contract của API.
    code: |-
      struct Quote {
          double price;
      };

      void publish_quote(const Quote* quote) {
          if (quote->price < 0.0) return;
          send_to_subscribers(quote->price);
      }
    hint: Theo dõi thứ tự kiểm tra trước khi truy cập qua con trỏ.
    answer:
      short: Cần kiểm tra `quote` khác null trước khi dereference. Code hiện tại dereference ngay ở điều
        kiện nên null pointer có thể làm crash.
      detailed: "`quote->price` đã dereference con trỏ trước khi chương trình có cơ hội xác nhận con trỏ
        hợp lệ. Nếu upstream báo không có quote bằng `nullptr`, process có thể crash hoặc có
        undefined behavior. Bản sửa tối thiểu là kiểm tra `if (!quote) return;` trước mọi truy cập,
        sau đó mới kiểm tra price. Nếu null là lỗi contract thay vì trạng thái hợp lệ, API nên biểu
        diễn điều đó rõ hơn bằng reference khi bắt buộc phải có quote, hoặc trả lỗi/metric thay vì
        im lặng bỏ bản tin."
    rubric:
      required:
        - Chỉ ra dereference null pointer ở điều kiện đầu tiên.
        - Nêu rõ null phải được kiểm tra trước khi đọc `price`.
        - Đề xuất sửa giữ contract API rõ ràng.
      bonus:
        - Phân biệt null hợp lệ với vi phạm contract từ upstream.
        - Nêu metric hoặc logging phù hợp nếu drop bản tin.
      misconceptions:
        - Cho rằng so sánh `quote->price` tự kiểm tra null.
        - Chỉ thêm kiểm tra null sau lệnh `if` hiện tại.
    sources:
      - sectionId: common-mistakes
      - sectionId: notes-for-trading-code
    sourceHash: aa153e754d77a72d89eff13c9d2c517e950c1d947061bca1289f9ea3a40c045c
    status: draft
