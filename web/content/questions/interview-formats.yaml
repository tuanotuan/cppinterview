  - id: cpp11-const-pointer-lvalue-reference-interview-ownership-001
    lessonId: cpp11-const-pointer-lvalue-reference
    type: scenario
    responseMode: text
    difficulty: advanced
    interviewCategory: design_performance
    interviewFormat: ownership_lifetime_design
    assessmentSkills:
      - ownership
      - lifetime
      - const-correctness
    estimatedMinutes: 9
    prompt: Thiết kế API cho một consumer chỉ mượn `Book` trong lúc xử lý event, không sở hữu và không
      được giữ lại sau callback. Hãy chọn reference hay pointer cho tham số, nêu cách biểu đạt
      nullability, constness và lifetime contract. Không cần viết implementation hoàn chỉnh.
    code: |-
      struct Book {
          int best_bid;
      };

      class Consumer {
      public:
          void on_book(/* chọn kiểu tham số */);
      };
    hint: "Tách bốn câu hỏi: có thể null không, có mutate không, ai sở hữu và reference/pointer có được
      giữ lại không."
    answer:
      short: Nếu callback yêu cầu Book luôn tồn tại và chỉ đọc, dùng `const Book&` và ghi rõ không được
        lưu reference sau callback. Dùng pointer chỉ khi null là một trạng thái có nghĩa hoặc
        contract cần biểu đạt optional.
      detailed: Reference không biểu đạt ownership; nó chỉ là alias và thường hợp với đối số bắt buộc
        không-null. `const Book&` thể hiện Consumer không mutate Book và tránh copy. Caller vẫn sở
        hữu Book và phải giữ nó sống trong toàn bộ callback; Consumer không được cache
        reference/pointer sau callback trừ khi có contract lifetime khác. Nếu không có Book là trạng
        thái hợp lệ, `const Book*` giúp biểu đạt optional và buộc caller/consumer xử lý null trước
        dereference. Không dùng raw pointer để ngầm chuyển ownership.
    rubric:
      required:
        - Phân biệt borrowing với ownership.
        - Chọn `const Book&` cho non-null read-only callback hoặc giải thích pointer optional.
        - Nêu giới hạn lifetime và cấm giữ alias sau callback.
      bonus:
        - Nêu cách document/assert contract ở ranh giới API.
      misconceptions:
        - Cho rằng reference sở hữu object.
        - Dùng pointer để biểu đạt ownership mơ hồ.
    sources:
      - sectionId: how-references-and-pointers-work
      - sectionId: lifetime-and-validity
      - sectionId: trading-use-case
    sourceHash: 15ab8c14dabca12bcef1a2d1c78999481d755ccd70fdd56ff98c4d3278dd6f54
    status: draft
    version: 1
  - id: cpp98-address-pointer-interview-code-review-001
    lessonId: cpp98-address-pointer
    type: code_reasoning
    responseMode: text
    difficulty: advanced
    interviewCategory: code_review_debug
    interviewFormat: code_review
    assessmentSkills:
      - code-review
      - pointer-safety
      - ownership
    estimatedMinutes: 10
    prompt: "Review đoạn mã xử lý bản tin bên dưới như trong một pull request. Để lại nhận xét theo các
      dòng quan trọng: vấn đề, tác động và đề xuất sửa. Ưu tiên correctness và ownership trước các
      góp ý về style."
    code: |-
      struct Message {
          int* payload;
      };

      Message* clone_message(const Message* source) {
          Message* copy = new Message;
          copy->payload = source->payload;
          return copy;
      }

      void destroy_message(Message* message) {
          delete message;
      }
    hint: Xem ownership của `payload`, nullability của input và vòng đời của resource sau clone/destroy.
    answer:
      short: Review cần chỉ ra dereference source null, shallow copy payload gây alias/double free hoặc
        dangling tùy owner, và destroy không giải phóng payload nếu clone sở hữu nó. Contract
        ownership phải được thiết kế lại rõ ràng.
      detailed: "`clone_message` dereference `source` mà không nêu contract non-null. Quan trọng hơn,
        `copy->payload = source->payload` chỉ sao chép địa chỉ: hai Message alias cùng payload nhưng
        code không nói ai sở hữu. Nếu cả hai nơi delete payload thì double free; nếu một nơi delete
        trước thì nơi còn lại dangling; nếu không ai delete thì leak. `destroy_message` chỉ delete
        outer object nên cũng leak nếu clone được kỳ vọng sở hữu deep copy. Review tốt cần yêu cầu
        model ownership rõ ràng, ưu tiên RAII/value type như vector hoặc smart pointer phù hợp, và
        test clone/destroy độc lập."
    rubric:
      required:
        - Nhận xét dereference `source` thiếu null contract.
        - Chỉ ra shallow copy payload tạo ownership/aliasing lỗi.
        - Nêu destructor/destroy phải khớp ownership thực tế.
      bonus:
        - Đề xuất RAII thay raw owning pointer.
        - Đề xuất test clone rồi destroy hai object độc lập.
      misconceptions:
        - Chỉ góp ý đặt tên hoặc formatting mà bỏ qua ownership.
        - Cho rằng `delete message` tự delete vùng nhớ mà payload trỏ tới.
    sources:
      - sectionId: common-mistakes
      - sectionId: notes-for-trading-code
    sourceHash: aa153e754d77a72d89eff13c9d2c517e950c1d947061bca1289f9ea3a40c045c
    status: draft
    version: 1
