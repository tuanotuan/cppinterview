  - id: cpp98-array-one-past-end-interview-ub-001
    lessonId: cpp98-array-one-past-end
    type: pitfall
    responseMode: text
    difficulty: intermediate
    interviewCategory: code_reading_ub
    interviewFormat: undefined_behavior
    assessmentSkills:
      - bounds-checking
      - pointer-arithmetic
      - undefined-behavior
    estimatedMinutes: 5
    prompt: Đoạn mã dưới đây muốn cộng toàn bộ quantity của mảng. Hãy xác định hành vi nào là undefined
      behavior, vì sao con trỏ one-past-end được phép tồn tại nhưng không được dùng như ở đây, và
      sửa vòng lặp.
    code: |-
      int quantities[] = {4, 7, 9};
      int total = 0;

      for (int* current = quantities; current <= quantities + 3; ++current) {
          total += *current;
      }
    hint: Phân biệt so sánh con trỏ với dereference con trỏ.
    answer:
      short: "`quantities + 3` là one-past-end hợp lệ để so sánh nhưng dereference nó là undefined
        behavior. Dùng `current < quantities + 3`."
      detailed: Với mảng ba phần tử, `quantities + 3` chỉ là vị trí một-past-end. Nó có thể được tạo và so
        sánh để biểu diễn end, nhưng không trỏ tới phần tử nào để đọc. Điều kiện `<=` làm vòng lặp
        chạy thêm một lần và `*current` dereference vị trí đó. Sửa thành `current < quantities + 3`;
        trong code mới nên ưu tiên iterator/range để tránh tự quản lý cận.
    rubric:
      required:
        - Chỉ ra lần lặp dereference one-past-end.
        - Phân biệt được phép tạo/so sánh với được phép dereference.
        - Đưa điều kiện dừng đúng.
      bonus:
        - Nêu lợi ích của iterator hoặc range trong code mới.
      misconceptions:
        - Cho rằng one-past-end là phần tử cuối cùng.
        - Chỉ thay `<=` bằng `<` nhưng không giải thích UB.
    sources:
      - sectionId: one-past-end
      - sectionId: common-mistakes
      - sectionId: stl-connection
    sourceHash: a2cecfa2c0f84182c8927b8f56c3b3af6f1f35e093a57eae06a0f35003520866
    status: draft
    version: 1
  - id: cpp98-struct-padding-interview-compare-001
    lessonId: cpp98-struct-padding
    type: scenario
    responseMode: text
    difficulty: advanced
    interviewCategory: design_performance
    interviewFormat: implementation_comparison
    assessmentSkills:
      - data-layout
      - alignment
      - performance-measurement
    estimatedMinutes: 8
    prompt: Hai layout dưới đây cùng biểu diễn một record được quét số lượng lớn. So sánh hai lựa chọn
      về padding, locality và rủi ro correctness. Không được đoán một `sizeof` cố định; hãy nêu cách
      xác minh trên toolchain đích trước khi đổi layout production.
    code: |-
      struct A {
          char venue;
          double price;
          int quantity;
      };

      struct B {
          double price;
          int quantity;
          char venue;
      };
    hint: Alignment là yêu cầu của implementation và platform, không phải một công thức kích thước cố
      định cho mọi máy.
    answer:
      short: "`B` thường giảm padding nội bộ vì field alignment lớn đặt trước, nhưng không được giả định
        kích thước cố định. Cần đo trên ABI/toolchain đích và kiểm tra serialization không dựa vào
        raw layout."
      detailed: "`double` thường có alignment lớn hơn `int` và `char`; đặt field lớn trước có thể giảm các
        byte padding xen giữa. Tuy nhiên `sizeof`, alignment và tail padding phụ thuộc ABI, compiler
        option và platform nên phải xác minh bằng build/test trên target thật. Đổi thứ tự field có
        thể ảnh hưởng binary layout, protocol, raw-memory comparison hoặc code giả định offset; nếu
        record đi qua wire thì dùng serialization rõ ràng thay vì dump raw struct. Tối ưu chỉ hợp lý
        sau khi profiling chứng minh data layout nằm trên hot path."
    rubric:
      required:
        - Giải thích padding/alignment có thể khác giữa A và B.
        - Không khẳng định một giá trị `sizeof` tuyệt đối.
        - Nêu cách xác minh và rủi ro binary layout/serialization.
      bonus:
        - Nêu profiling/cache locality trước khi tối ưu.
      misconceptions:
        - Khẳng định field reorder luôn nhanh hơn.
        - Serialize bằng raw bytes vì struct có vẻ nhỏ hơn.
    sources:
