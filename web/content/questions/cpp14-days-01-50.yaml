        construction, thứ tự destruction, copy so với move, self-assignment và ownership của member.
      detailed: >-
        Tự định nghĩa một special member liên quan ownership nhưng quên các member còn lại có thể
        gây leak, giải phóng hai lần hoặc vô tình mất move. Trước khi áp dụng mẫu, phải kiểm tra
        construction, thứ tự destruction, copy so với move, self-assignment và ownership của member.


        Nên dùng khi object phải giữ invariant tài nguyên hợp lệ đúng trong lifetime của nó. Tránh
        dùng khi code special member thủ công chỉ lặp hành vi đã có từ RAII member chuẩn.


