      khi đề xuất thay đổi nhỏ nhất.
    answer:
      short: Biến code thành template trước khi xác định thao tác bắt buộc sẽ tạo constraint ngoài ý muốn
        và lỗi khó đọc. Trước khi áp dụng mẫu, phải kiểm tra deduction, operator bắt buộc, chi phí
        copy/move, reference lifetime, nhu cầu specialization và độ rõ API.
      detailed: >-
        Biến code thành template trước khi xác định thao tác bắt buộc sẽ tạo constraint ngoài ý muốn
        và lỗi khó đọc. Trước khi áp dụng mẫu, phải kiểm tra deduction, operator bắt buộc, chi phí
        copy/move, reference lifetime, nhu cầu specialization và độ rõ API.


        Nên dùng khi cùng semantics áp dụng cho nhiều kiểu thỏa một hợp đồng thao tác nhỏ, ổn định.
        Tránh dùng khi runtime polymorphism, một kiểu cụ thể hoặc overload thông thường mô tả domain
        rõ hơn.


        Template tốt parameter hóa biến thể thật sự và giữ các thao tác bắt buộc nhỏ, dễ thấy.
