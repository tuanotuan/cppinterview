    answer:
      short: Đánh dấu API deprecated mà không có thông điệp migration hoặc bản thay thế dùng được khiến
        người gọi không biết phải làm gì. Trước khi áp dụng mẫu, phải kiểm tra đường thay thế, chính
        sách cảnh báo, thời gian tương thích, tài liệu và phiên bản dự kiến xóa.
      detailed: >-
        Đánh dấu API deprecated mà không có thông điệp migration hoặc bản thay thế dùng được khiến
        người gọi không biết phải làm gì. Trước khi áp dụng mẫu, phải kiểm tra đường thay thế, chính
        sách cảnh báo, thời gian tương thích, tài liệu và phiên bản dự kiến xóa.


        Nên dùng khi interface công khai hiện có phải tạm thời còn dùng trong lúc call site chuyển
        sang thiết kế an toàn hơn. Tránh dùng khi declaration chưa từng phát hành hoặc có thể đổi
        tên an toàn trước khi ai phụ thuộc.


        Deprecation tốt phải có bản thay thế, giai đoạn migration và chính sách xóa rõ ràng.
