  - id: cpp14-mutex-condition-variable-shared-timed-mutex-002
    lessonId: cpp14-mutex-condition-variable-shared-timed-mutex
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Vì sao predicate overload của `wait` vẫn đúng sau spurious wakeup?
    code: "#include <condition_variable>\r

      #include <iostream>\r

      #include <mutex>\r

      #include <shared_mutex>\r

      #include <thread>\r

      \r

      int main() {\r

      \    std::mutex ready_mutex;\r

      \    std::condition_variable ready_cv;\r

      \    bool ready = false;\r

      \    std::shared_timed_mutex data_mutex;\r

      \    int value = 0;\r

      \r

      \    std::thread producer([&] {\r

      \        {\r

      \            std::unique_lock<std::shared_timed_mutex> write_lock(data_mutex);\r

      \            value = 42;\r

      \        }\r

      \        {\r

      \            std::lock_guard<std::mutex> lock(ready_mutex);\r

      \            ready = true;\r

      \        }\r

      \        ready_cv.notify_one();\r

      \    });\r

      \r

      \    std::unique_lock<std::mutex> lock(ready_mutex);\r

      \    ready_cv.wait(lock, [&] { return ready; });\r

      \    lock.unlock();\r

      \r

      \    std::shared_lock<std::shared_timed_mutex> read_lock(data_mutex);\r

      \    std::cout << \"value: \" << value << \"\\n\";\r

      \    read_lock.unlock();\r

      \    producer.join();\r

      }\r\n"
    hint: Lần theo dữ liệu cố định trong mã mẫu, rồi đối chiếu từng kết quả với quy tắc ở phần Cách nó
      hoạt động.
    answer:
