        Cố copy lambda này sẽ lỗi vì closure type do compiler sinh chứa member không thể copy. Trước
        khi áp dụng mẫu, phải kiểm tra việc chuyển ownership, nơi gọi move hay copy closure và
        closure object sống trong bao lâu.


