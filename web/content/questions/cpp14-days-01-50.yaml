  - id: cpp14-toolchain-compiler-flags-cpp14-002
    lessonId: cpp14-toolchain-compiler-flags-cpp14
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Với GCC ở chế độ C++14, điều kiện `__cplusplus >= 201402L` cho kết quả gì?
    code: "#include <iostream>\r

      \r

      #if __cplusplus < 201402L\r

      #error This example requires C++14 or newer\r

      #endif\r

      \r

      int main() {\r

      \    constexpr int permissions = 0b1010; // C++14 binary literal\r

      \    std::cout << \"C++ level: \" << __cplusplus << \"\\n\";\r

      \    std::cout << \"permissions: \" << permissions << \"\\n\";\r

      }\r\n"
    hint: Lần theo dữ liệu cố định trong mã mẫu, rồi đối chiếu từng kết quả với quy tắc ở phần Cách nó
      hoạt động.
    answer:
      short: >-
        Ví dụ dùng tiền xử lý để từ chối chuẩn cũ hơn C++14, sau đó in `__cplusplus` và một bit mask
        viết ở dạng nhị phân. Nhờ vậy chế độ đang dùng được kiểm chứng thay vì chỉ đoán.


        File `.cpp` dùng dữ liệu cố định để tự đoán và kiểm tra output.
      detailed: >-
        Compiler driver đọc file nguồn, áp dụng quy tắc ngôn ngữ C++14 và bật ba nhóm cảnh báo đã
        yêu cầu. Sau tiền xử lý và dịch mã, linker ghép object code với phần thư viện chuẩn mà
        chương trình cần. Khi chạy, chương trình in giá trị macro phiên bản C++ và một giá trị được
        viết bằng cú pháp hợp lệ của C++14.


        Ví dụ dùng tiền xử lý để từ chối chuẩn cũ hơn C++14, sau đó in `__cplusplus` và một bit mask
        viết ở dạng nhị phân. Nhờ vậy chế độ đang dùng được kiểm chứng thay vì chỉ đoán.


        File `.cpp` dùng dữ liệu cố định để tự đoán và kiểm tra output.
    rubric:
      required:
        - Nêu đúng giá trị, kiểu hoặc trạng thái mà ví dụ tạo ra.
        - Gắn từng kết quả với câu lệnh và quy tắc C++14 tương ứng.
        - Không suy đoán thêm input hoặc trạng thái ngoài mã mẫu.
      bonus:
        - Nêu được hệ quả liên quan đến kiểu, lifetime, ownership hoặc ordering.
      misconceptions:
        - Đoán kết quả mà không lần theo dữ liệu và quy tắc trong mã.
