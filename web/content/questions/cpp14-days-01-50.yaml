    prompt: Sau khi exception chia cho không được catch, `main` có tiếp tục gọi `reset` không?
    code: "#include <iostream>\r

      #include <stdexcept>\r

      \r

      int divide(int numerator, int denominator) {\r

      \    if (denominator == 0) {\r

      \        throw std::invalid_argument(\"denominator is zero\");\r

      \    }\r

      \    return numerator / denominator;\r

      }\r

      \r

      void reset(int& state) noexcept {\r

      \    state = 0;\r

      }\r

      \r

      int main() {\r

      \    int state = 7;\r

      \    try {\r

      \        std::cout << divide(10, 0) << \"\\n\";\r

      \    } catch (const std::invalid_argument& error) {\r

      \        std::cout << \"caught: \" << error.what() << \"\\n\";\r

      \    }\r

      \    reset(state);\r

      \    std::cout << \"state: \" << state << \"\\n\";\r

      }\r\n"
