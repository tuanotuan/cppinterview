  - id: cpp14-move-only-lambda-capture-lifetime-001
    lessonId: cpp14-move-only-lambda-capture-lifetime
    type: recall
    responseMode: text
    difficulty: beginner
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: Mục đích chính của Move-only lambda capture và capture lifetime là gì?
    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu ràng buộc mà tính năng làm rõ.
    answer:
      short: Một số trạng thái như `std::unique_ptr` không thể copy vào closure C++11. Init-capture C++14
        có thể move trạng thái đó vào closure, biến closure thành owner mới và gắn lifetime tài
        nguyên với lifetime của closure.
      detailed: >-
        Một số trạng thái như `std::unique_ptr` không thể copy vào closure C++11. Init-capture C++14
        có thể move trạng thái đó vào closure, biến closure thành owner mới và gắn lifetime tài
        nguyên với lifetime của closure.


        Closure là object bình thường chứa data member move-only. Bản thân nó có thể được move nhưng
        không thể copy, và tài nguyên capture sống tới khi member trong closure bị hủy.
    rubric:
      required:
        - Nêu đúng vấn đề mà chủ đề giải quyết.
        - Mô tả đúng cơ chế hoặc contract C++14 liên quan.
