    prompt: Mục đích chính của Relaxed constexpr trong C++14 là gì?
    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu ràng buộc mà tính năng làm rõ.
    answer:
      short: Thân hàm `constexpr` của C++11 bị giới hạn mạnh, thường buộc phải viết đệ quy bằng một biểu
        thức. C++14 cho phép biến cục bộ, vòng lặp, nhánh và thay đổi trạng thái cục bộ nhưng vẫn
        tính ở compile-time khi argument cho phép.
      detailed: >-
        Thân hàm `constexpr` của C++11 bị giới hạn mạnh, thường buộc phải viết đệ quy bằng một biểu
        thức. C++14 cho phép biến cục bộ, vòng lặp, nhánh và thay đổi trạng thái cục bộ nhưng vẫn
        tính ở compile-time khi argument cho phép.


        Hàm `constexpr` C++14 có thể trông như code mệnh lệnh bình thường. Nó chỉ trở thành phép
        tính compile-time khi được gọi trong constant-expression context với input hợp lệ.
