        nguyên thô. Compiler hoặc thư viện luôn theo quy tắc cụ thể; cần kiểm tra construction, thứ
        tự destruction, copy so với move, self-assignment và ownership của member. Ưu tiên cách viết
        nhỏ nhất thể hiện rõ ý định và đo đạc khi hiệu năng thực sự quan trọng.
    rubric:
