      };\r

      \r

      int main() {\r

      \    std::mutex first_mutex;\r

      \    std::mutex second_mutex;\r

      \    int left = 0;\r

      \    int right = 0;\r

      \    Counter first_counter;\r

      \    Counter second_counter;\r

      \r

      \    auto worker = [&](Counter& counter) {\r

      \        std::lock(first_mutex, second_mutex);\r

      \        std::lock_guard<std::mutex> first(first_mutex, std::adopt_lock);\r

      \        std::lock_guard<std::mutex> second(second_mutex, std::adopt_lock);\r

      \        ++left;\r

      \        ++right;\r

      \        counter.value.fetch_add(1, std::memory_order_relaxed);\r

      \    };\r

      \r

      \    std::thread a(worker, std::ref(first_counter));\r

      \    std::thread b(worker, std::ref(second_counter));\r

      \    a.join();\r

      \    b.join();\r

