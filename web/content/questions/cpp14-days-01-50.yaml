  - id: cpp14-auto-decltype-type-deduction-review-002
    lessonId: cpp14-auto-decltype-type-deduction-review
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Sau `const int n = 7; auto x = n;`, chương trình có thể gán `x = 8` không, và vì sao?
    code: "#include <iostream>\r

      \r

      int main() {\r

      \    const int base = 7;\r

      \    auto copy = base;              // int: top-level const is dropped\r

      \    decltype(base) exact = base;   // const int\r

      \r

      \    int value = 10;\r

      \    int& ref = value;\r

      \    decltype(ref) alias = value;   // int&\r

      \r

      \    copy = 8;\r

      \    alias = 42;\r

      \    std::cout << \"copy: \" << copy << \"\\n\";\r

      \    std::cout << \"exact: \" << exact << \"\\n\";\r

      \    std::cout << \"value: \" << value << \"\\n\";\r

      }\r\n"
    hint: Lần theo dữ liệu cố định trong mã mẫu, rồi đối chiếu từng kết quả với quy tắc ở phần Cách nó
      hoạt động.
    answer:
      short: >-
        Một giá trị cấu hình được sao chép bằng `auto`, còn `decltype(ref)` giữ reference tới cấu
        hình thật. Output cho thấy khai báo nào giữ bản sao riêng.


        File `.cpp` dùng dữ liệu cố định để tự đoán và kiểm tra output.
      detailed: >-
        Compiler xem giá trị khởi tạo của khai báo `auto` rồi suy ra một kiểu mới cho biến. Với
        `decltype(name)`, kiểu khai báo của tên được giữ lại; thêm ngoặc có thể chuyển sang quy tắc
        theo loại biểu thức. Bản sao có thể thay đổi độc lập, còn reference được suy ra sẽ sửa trực
        tiếp object gốc.


        Một giá trị cấu hình được sao chép bằng `auto`, còn `decltype(ref)` giữ reference tới cấu
        hình thật. Output cho thấy khai báo nào giữ bản sao riêng.


        File `.cpp` dùng dữ liệu cố định để tự đoán và kiểm tra output.
