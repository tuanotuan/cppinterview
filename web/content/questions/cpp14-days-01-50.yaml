  - id: cpp14-auto-decltype-type-deduction-review-003
    lessonId: cpp14-auto-decltype-type-deduction-review
    type: pitfall
    responseMode: text
    difficulty: advanced
    interviewCategory: code_review_debug
    interviewFormat: bug_hunt
    estimatedMinutes: 5
    prompt: So sánh `decltype(value)` và `decltype((value))` với biến `int` có tên. Dạng nào là reference?
    hint: Xác định invariant về kiểu, lifetime, ownership, invalidation hoặc ordering bị vi phạm trước
      khi đề xuất thay đổi nhỏ nhất.
    answer:
      short: Cho rằng `auto` luôn giữ `const` hoặc `&` có thể biến một alias dự kiến thành bản sao. Trước
        khi áp dụng mẫu, phải kiểm tra kết quả suy luận là value, reference hay kiểu có const.
      detailed: >-
        Cho rằng `auto` luôn giữ `const` hoặc `&` có thể biến một alias dự kiến thành bản sao. Trước
        khi áp dụng mẫu, phải kiểm tra kết quả suy luận là value, reference hay kiểu có const.


        Nên dùng khi kiểu đã rõ từ initializer hoặc phụ thuộc biểu thức và việc ghi tay chỉ làm code
        dài hơn. Tránh dùng khi kiểu suy ra che mất phép chuyển đổi quan trọng, quyết định ownership
        hoặc mất độ chính xác.


        Type deduction giảm lặp chữ, nhưng người viết vẫn phải suy luận rõ qualifier và reference.
        Compiler hoặc thư viện luôn theo quy tắc cụ thể; cần kiểm tra kết quả suy luận là value,
        reference hay kiểu có const. Ưu tiên cách viết nhỏ nhất thể hiện rõ ý định và đo đạc khi
        hiệu năng thực sự quan trọng.
    rubric:
      required:
        - Chỉ ra chính xác quy tắc C++14 hoặc invariant bị vi phạm.
        - Giải thích hậu quả quan sát được, lỗi compile hoặc undefined behavior nếu có.
        - Đề xuất thay đổi nhỏ nhất loại bỏ nguyên nhân thay vì che triệu chứng.
      bonus:
        - Nêu được trade-off của bản sửa đối với API, lifetime hoặc hiệu năng.
      misconceptions:
        - Cho rằng chương trình an toàn chỉ vì có thể compile hoặc chạy một lần.
