    prompt: Vì sao dùng `std::lock` cho cả hai mutex tránh pattern deadlock do lấy ngược thứ tự đơn giản?
    code: "#include <atomic>\r

      #include <functional>\r

      #include <iostream>\r

      #include <mutex>\r

