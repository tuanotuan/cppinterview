        để exception lan ra ngoài.
      detailed: >-
        Thao tác có thể thất bại sau khi đã làm một phần công việc. Exception safety định nghĩa
        invariant và giá trị nào vẫn hợp lệ khi exception thoát ra, còn `noexcept` cam kết hàm không
        để exception lan ra ngoài.


        Hãy tạo thay đổi trong trạng thái tạm được RAII quản lý rồi commit chỉ sau khi thành công.
        Chỉ đánh dấu `noexcept` khi mọi thao tác bên trong giữ được lời hứa; nếu exception thoát ra,
        chương trình sẽ terminate.
