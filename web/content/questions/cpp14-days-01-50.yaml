        chuyển ownership, object lifetime và nhu cầu custom deleter.


        Nên dùng khi object cấp phát động có một owner rõ và lifetime đi theo scope hoặc smart
        pointer được trả về. Tránh dùng khi automatic storage hoặc value member trực tiếp đơn giản
        hơn, hoặc object thực sự cần shared ownership.


        `std::make_unique` là factory mặc định của C++14 cho dynamic ownership độc quyền, rõ ràng.
