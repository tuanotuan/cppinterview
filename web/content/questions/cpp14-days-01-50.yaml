  - id: cpp14-type-trait-aliases-sfinae-enable-if-001
    lessonId: cpp14-type-trait-aliases-sfinae-enable-if
    type: recall
    responseMode: text
    difficulty: beginner
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: Mục đích chính của Type-trait aliases, SFINAE và std::enable_if là gì?
    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu ràng buộc mà tính năng làm rõ.
    answer:
      short: Thân template có thể chỉ hợp lệ với vài kiểu nhưng declaration không constraint vẫn tham gia
        overload resolution cho mọi kiểu. SFINAE loại candidate khi substitution thất bại, còn
        `std::enable_if_t` diễn đạt điều kiện tham gia Boolean gọn hơn.
      detailed: >-
        Thân template có thể chỉ hợp lệ với vài kiểu nhưng declaration không constraint vẫn tham gia
        overload resolution cho mọi kiểu. SFINAE loại candidate khi substitution thất bại, còn
        `std::enable_if_t` diễn đạt điều kiện tham gia Boolean gọn hơn.


        Substitution failure là bộ lọc chứ chưa phải lỗi chương trình trong lúc tạo candidate.
        `enable_if` chỉ có nested type khi điều kiện true nên candidate false biến mất.
    rubric:
      required:
        - Nêu đúng vấn đề mà chủ đề giải quyết.
