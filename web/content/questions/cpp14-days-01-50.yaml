    prompt: Mục đích chính của Memory pool, custom allocator và giảm allocation là gì?
    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu ràng buộc mà tính năng làm rõ.
    answer:
      short: General-purpose allocation thường xuyên có thể tăng latency, metadata overhead, fragmentation
        và locality kém. Memory pool reserve storage thành block lớn và custom allocation interface
        dựng object trong slot tái sử dụng.
      detailed: >-
        General-purpose allocation thường xuyên có thể tăng latency, metadata overhead,
        fragmentation và locality kém. Memory pool reserve storage thành block lớn và custom
        allocation interface dựng object trong slot tái sử dụng.


        Hãy tách raw storage khỏi object lifetime. Lấy slot chưa tạo `T` cho tới khi placement
        construction chạy, và release object phải gọi destructor trước khi đánh dấu slot có thể tái
        sử dụng.
    rubric:
      required:
        - Nêu đúng vấn đề mà chủ đề giải quyết.
