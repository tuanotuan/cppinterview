  - id: cpp14-ordered-containers-transparent-comparator-003
    lessonId: cpp14-ordered-containers-transparent-comparator
    type: pitfall
    responseMode: text
    difficulty: advanced
    interviewCategory: code_review_debug
    interviewFormat: bug_hunt
    estimatedMinutes: 5
    prompt: Vì sao cả `comp(a, b)` và `comp(b, a)` phải false để hai key tương đương trong ordered
      container?
    hint: Xác định invariant về kiểu, lifetime, ownership, invalidation hoặc ordering bị vi phạm trước
      khi đề xuất thay đổi nhỏ nhất.
    answer:
      short: Comparator không tạo strict weak ordering có thể phá invariant logic của container và làm
        lookup không đáng tin. Trước khi áp dụng mẫu, phải kiểm tra strict weak ordering, tính bất
        biến của key, trạng thái comparator, equivalence và phép so sánh khác kiểu được hỗ trợ.
      detailed: >-
        Comparator không tạo strict weak ordering có thể phá invariant logic của container và làm
        lookup không đáng tin. Trước khi áp dụng mẫu, phải kiểm tra strict weak ordering, tính bất
        biến của key, trạng thái comparator, equivalence và phép so sánh khác kiểu được hỗ trợ.


        Nên dùng khi cần duyệt đã sắp xếp, tìm logarithmic hoặc uniqueness theo thứ tự và có
        comparator nhất quán. Tránh dùng khi không cần thứ tự và hash lookup phù hợp hơn với access
        pattern đã đo.


        Tính đúng của ordered container phụ thuộc ordering và equivalence của comparator, không chỉ
        equality của key. Compiler hoặc thư viện luôn theo quy tắc cụ thể; cần kiểm tra strict weak
        ordering, tính bất biến của key, trạng thái comparator, equivalence và phép so sánh khác
        kiểu được hỗ trợ. Ưu tiên cách viết nhỏ nhất thể hiện rõ ý định và đo đạc khi hiệu năng thực
        sự quan trọng.
    rubric:
      required:
        - Chỉ ra chính xác quy tắc C++14 hoặc invariant bị vi phạm.
        - Giải thích hậu quả quan sát được, lỗi compile hoặc undefined behavior nếu có.
        - Đề xuất thay đổi nhỏ nhất loại bỏ nguyên nhân thay vì che triệu chứng.
      bonus:
        - Nêu được trade-off của bản sửa đối với API, lifetime hoặc hiệu năng.
      misconceptions:
        - Cho rằng chương trình an toàn chỉ vì có thể compile hoặc chạy một lần.
