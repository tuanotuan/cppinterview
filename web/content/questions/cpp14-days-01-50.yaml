  - id: cpp14-api-value-reference-pointer-ownership-001
    lessonId: cpp14-api-value-reference-pointer-ownership
    type: recall
    responseMode: text
    difficulty: beginner
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: Mục đích chính của Thiết kế API bằng value, reference, pointer và ownership là gì?
    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu ràng buộc mà tính năng làm rõ.
    answer:
      short: Function signature không chỉ để kiểm tra kiểu; nó truyền đạt copy, mutation, optionality,
        borrowing và chuyển ownership. Chọn value, reference, raw pointer hay smart pointer có chủ
        đích làm hợp đồng API hiện rõ tại call site.
      detailed: >-
        Function signature không chỉ để kiểm tra kiểu; nó truyền đạt copy, mutation, optionality,
        borrowing và chuyển ownership. Chọn value, reference, raw pointer hay smart pointer có chủ
        đích làm hợp đồng API hiện rõ tại call site.


        Dùng value cho input hoặc output độc lập, `T&` cho mutable borrow bắt buộc, `const T&` cho
        read-only borrow bắt buộc, `T*` cho borrow có thể null và smart pointer cho ownership.
    rubric:
      required:
        - Nêu đúng vấn đề mà chủ đề giải quyết.
        - Mô tả đúng cơ chế hoặc contract C++14 liên quan.
        - Không nhầm tính năng C++14 với hành vi phụ thuộc compiler.
      bonus:
        - Liên hệ được tác động ở compile time với hành vi lúc chạy.
      misconceptions:
        - Chỉ nhắc tên tính năng mà không giải thích mục đích hoặc ràng buộc.
