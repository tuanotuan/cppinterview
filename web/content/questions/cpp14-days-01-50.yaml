    estimatedMinutes: 4
    prompt: Vì sao tổng cuối luôn là 30 dù worker nào cũng có thể chạy trước?
    code: "#include <atomic>\r

      #include <iostream>\r

      #include <mutex>\r

      #include <thread>\r

      \r

      int main() {\r

      \    std::mutex mutex;\r

      \    int protected_total = 0;\r

      \    std::atomic<int> events{0};\r

      \r

      \    auto worker = [&](int amount) {\r

      \        {\r

      \            std::lock_guard<std::mutex> lock(mutex);\r

      \            protected_total += amount;\r

      \        }\r

      \        events.fetch_add(1, std::memory_order_relaxed);\r

      \    };\r

      \r

      \    std::thread first(worker, 10);\r

      \    std::thread second(worker, 20);\r

      \    first.join();\r

      \    second.join();\r

      \r

      \    std::cout << \"total: \" << protected_total << \"\\n\";\r

      \    std::cout << \"events: \" << events.load() << \"\\n\";\r

      }\r\n"
