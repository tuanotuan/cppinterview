        `std::vector` lưu phần tử liên tục, còn `emplace_back` dựng phần tử mới trực tiếp từ
        constructor argument được truyền.
      detailed: >-
        Sequence container cùng có interface theo thứ tự nhưng khác cách lưu và invalidation.
        `std::vector` lưu phần tử liên tục, còn `emplace_back` dựng phần tử mới trực tiếp từ
        constructor argument được truyền.


        Hãy chọn hành vi lưu trữ trước: vector là mảng tăng trưởng với các phần tử kề nhau thân
        thiện cache. Reserve khi đoán được số phần tử, rồi emplace khi construction trực tiếp thể
        hiện ý định rõ hơn.
