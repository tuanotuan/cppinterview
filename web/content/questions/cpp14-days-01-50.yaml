        - Đề xuất thay đổi nhỏ nhất loại bỏ nguyên nhân thay vì che triệu chứng.
      bonus:
        - Nêu được trade-off của bản sửa đối với API, lifetime hoặc hiệu năng.
      misconceptions:
        - Cho rằng chương trình an toàn chỉ vì có thể compile hoặc chạy một lần.
