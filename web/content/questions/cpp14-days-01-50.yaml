    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu ràng buộc mà tính năng làm rõ.
    answer:
      short: Binary protocol định nghĩa field bằng bit width và byte order chính xác, trong khi kích thước
        số nguyên C++ native cùng host byte order có thể khác. Fixed-width integer và phép parse
        shift/or rõ ràng làm biểu diễn bên ngoài độc lập layout máy.
      detailed: >-
        Binary protocol định nghĩa field bằng bit width và byte order chính xác, trong khi kích
        thước số nguyên C++ native cùng host byte order có thể khác. Fixed-width integer và phép
        parse shift/or rõ ràng làm biểu diễn bên ngoài độc lập layout máy.


        Byte trên wire là một format, không phải object trong memory. Đọc từng byte dạng unsigned,
        widen trước khi shift, kết hợp theo endian order đã khai báo và không reinterpret byte tùy ý
        thành struct.
    rubric:
      required:
        - Nêu đúng vấn đề mà chủ đề giải quyết.
        - Mô tả đúng cơ chế hoặc contract C++14 liên quan.
        - Không nhầm tính năng C++14 với hành vi phụ thuộc compiler.
      bonus:
        - Liên hệ được tác động ở compile time với hành vi lúc chạy.
      misconceptions:
        - Chỉ nhắc tên tính năng mà không giải thích mục đích hoặc ràng buộc.
