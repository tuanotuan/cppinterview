  - id: cpp14-data-race-deadlock-false-sharing-003
    lessonId: cpp14-data-race-deadlock-false-sharing
    type: pitfall
    responseMode: text
    difficulty: advanced
    interviewCategory: code_review_debug
    interviewFormat: bug_hunt
    estimatedMinutes: 5
    prompt: Vì sao hai atomic counter độc lập vẫn có thể làm chậm nhau khi nằm trên cùng cache line bị
      invalidate thường xuyên?
    hint: Xác định invariant về kiểu, lifetime, ownership, invalidation hoặc ordering bị vi phạm trước
      khi đề xuất thay đổi nhỏ nhất.
    answer:
      short: Thêm atomic cho vài biến không sửa data race trên shared object khác và không tự bảo vệ
        invariant nhiều object. Trước khi áp dụng mẫu, phải kiểm tra mọi truy cập xung đột, global
        lock order, blocking call khi giữ lock, vị trí cache line, contention và throughput đã đo.
      detailed: >-
        Thêm atomic cho vài biến không sửa data race trên shared object khác và không tự bảo vệ
        invariant nhiều object. Trước khi áp dụng mẫu, phải kiểm tra mọi truy cập xung đột, global
        lock order, blocking call khi giữ lock, vị trí cache line, contention và throughput đã đo.


        Nên dùng khi review hoặc thiết kế trạng thái đa thread với yêu cầu rõ về correctness và hiệu
        năng cache. Tránh dùng khi padding và độ phức tạp lock-free được thêm trước khi profiling
        cho thấy bottleneck thật.


        Data race và deadlock là failure về correctness; false sharing là chi phí cache coherence
        cần đo. Compiler hoặc thư viện luôn theo quy tắc cụ thể; cần kiểm tra mọi truy cập xung đột,
        global lock order, blocking call khi giữ lock, vị trí cache line, contention và throughput
        đã đo. Ưu tiên cách viết nhỏ nhất thể hiện rõ ý định và đo đạc khi hiệu năng thực sự quan
        trọng.
