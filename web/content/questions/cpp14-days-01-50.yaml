        hở, tính hợp lệ của iterator và đơn vị clock.
      detailed: >-
        Truyền iterator của hai container khác nhau hoặc dùng iterator đã invalid sẽ gây undefined
        behavior. Trước khi áp dụng mẫu, phải kiểm tra container sở hữu dữ liệu, range nửa kín nửa
        hở, tính hợp lệ của iterator và đơn vị clock.


        Nên dùng khi container và algorithm chuẩn đã mô tả chính xác, an toàn thao tác cần làm.
        Tránh dùng khi cần control flow đặc biệt mà algorithm đã chọn không thể diễn đạt rõ.


