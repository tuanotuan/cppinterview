    lessonId: cpp14-generic-lambda
    type: recall
    responseMode: text
    difficulty: beginner
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: Mục đích chính của Generic lambda là gì?
    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu ràng buộc mà tính năng làm rõ.
    answer:
      short: Lambda C++11 thông thường cố định kiểu của từng parameter nên một thao tác nhỏ có thể phải
        viết nhiều bản. C++14 cho phép parameter dùng `auto`, khiến call operator của lambda hoạt
        động giống function template.
      detailed: >-
        Lambda C++11 thông thường cố định kiểu của từng parameter nên một thao tác nhỏ có thể phải
        viết nhiều bản. C++14 cho phép parameter dùng `auto`, khiến call operator của lambda hoạt
        động giống function template.


        Hãy hình dung compiler tạo một call operator dạng template ẩn. Mỗi tổ hợp kiểu argument sẽ
        tạo specialization phù hợp, còn thân lambda chỉ viết một lần.
