    prompt: Mean và population variance của `{2.0, 4.0, 6.0, 8.0}` là bao nhiêu?
    code: "#include <iostream>\r

      #include <numeric>\r

      #include <vector>\r

      \r

      int main() {\r

      \    const std::vector<double> values{2.0, 4.0, 6.0, 8.0};\r

      \    const double count = static_cast<double>(values.size());\r

      \    const double sum = std::accumulate(values.begin(), values.end(), 0.0);\r

      \    const double sum_squares = std::inner_product(\r

      \        values.begin(), values.end(), values.begin(), 0.0);\r

      \r

      \    const double mean = sum / count;\r

      \    const double variance = sum_squares / count - mean * mean;\r

      \    std::cout << \"mean: \" << mean << \"\\n\";\r

      \    std::cout << \"population variance: \" << variance << \"\\n\";\r

      }\r\n"
