    prompt: Mục đích chính của Variadic templates và parameter packs là gì?
    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu ràng buộc mà tính năng làm rõ.
    answer:
      short: Một số thao tác tự nhiên nhận số lượng argument khác kiểu thay đổi ở compile-time. Variadic
        template gom các argument đó thành parameter pack và pack expansion áp dụng một mẫu cho từng
        phần tử.
      detailed: >-
        Một số thao tác tự nhiên nhận số lượng argument khác kiểu thay đổi ở compile-time. Variadic
        template gom các argument đó thành parameter pack và pack expansion áp dụng một mẫu cho từng
        phần tử.


        Pack là sequence compile-time, không phải container runtime. Dấu ba chấm bung một mẫu cú
        pháp, còn `sizeof...(pack)` cho biết số phần tử.
