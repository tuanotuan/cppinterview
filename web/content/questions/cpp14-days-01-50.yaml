    estimatedMinutes: 4
    prompt: Điều gì phải xảy ra với object trước khi slot trong pool có thể đánh dấu free an toàn?
    code: "#include <array>\r

      #include <cstddef>\r

      #include <iostream>\r

      #include <new>\r

      #include <type_traits>\r

      #include <utility>\r

      \r

      template <class T, std::size_t Capacity>\r

      class FixedPool {\r

      \    using Slot = typename std::aligned_storage<sizeof(T), alignof(T)>::type;\r

      public:\r

      \    T* create(T value) {\r

      \        for (std::size_t i = 0; i < Capacity; ++i) {\r

      \            if (!used_[i]) {\r

      \                T* object = new (&storage_[i]) T(std::move(value));\r

      \                used_[i] = true;\r

      \                return object;\r

      \            }\r

      \        }\r

      \        throw std::bad_alloc{};\r

      \    }\r

      \r

      \    void destroy(T* object) noexcept {\r

      \        for (std::size_t i = 0; i < Capacity; ++i) {\r

      \            if (used_[i] &&\r

      \                static_cast<void*>(&storage_[i]) == static_cast<void*>(object)) {\r

      \                object->~T();\r

      \                used_[i] = false;\r

      \                return;\r

      \            }\r

      \        }\r

      \    }\r

      \r

      private:\r

      \    std::array<Slot, Capacity> storage_{};\r

      \    std::array<bool, Capacity> used_{};\r

      };\r

      \r

      int main() {\r

      \    FixedPool<int, 2> pool;\r

      \    int* first = pool.create(10);\r

      \    int* second = pool.create(20);\r

      \    std::cout << \"values: \" << *first << \", \" << *second << \"\\n\";\r

      \    pool.destroy(first);\r

      \    pool.destroy(second);\r

      }\r\n"
    hint: Lần theo dữ liệu cố định trong mã mẫu, rồi đối chiếu từng kết quả với quy tắc ở phần Cách nó
      hoạt động.
