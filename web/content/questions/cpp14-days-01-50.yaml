    lessonId: cpp14-lambda-capture-cpp11-review
    type: recall
    responseMode: text
    difficulty: beginner
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: Mục đích chính của Ôn lambda và capture trong C++11 là gì?
    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu ràng buộc mà tính năng làm rõ.
    answer:
      short: Một hành vi ngắn chỉ dùng một lần sẽ bất tiện nếu phải tách thành hàm có tên, nhất là khi nó
        cần trạng thái xung quanh. Lambda tạo callable không tên và capture list cho biết biến bên
        ngoài nào trở thành một phần của callable.
      detailed: >-
        Một hành vi ngắn chỉ dùng một lần sẽ bất tiện nếu phải tách thành hàm có tên, nhất là khi nó
        cần trạng thái xung quanh. Lambda tạo callable không tên và capture list cho biết biến bên
        ngoài nào trở thành một phần của callable.


        Lambda giống một function object nhỏ do compiler sinh ra. Capture theo value giữ bản chụp,
        còn capture theo reference truy cập object gốc nên quy tắc lifetime và thay đổi dữ liệu khác
        nhau.
