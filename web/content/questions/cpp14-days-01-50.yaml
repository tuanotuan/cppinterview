  - id: cpp14-deprecated-api-lifecycle-002
    lessonId: cpp14-deprecated-api-lifecycle
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Lời gọi hàm nào trong ví dụ biên dịch mà không có deprecation warning, và vì sao?
    code: "#include <iostream>\r

      \r

      [[deprecated(\"use new_total instead\")]]\r

      int old_total(int left, int right) {\r

      \    return left + right;\r

      }\r

      \r

      int new_total(int left, int right) {\r

      \    return left + right;\r

      }\r

      \r

      int main() {\r

      \    // Calling old_total(2, 3) would intentionally produce a warning.\r

      \    std::cout << \"total: \" << new_total(2, 3) << \"\\n\";\r

      }\r\n"
    hint: Lần theo dữ liệu cố định trong mã mẫu, rồi đối chiếu từng kết quả với quy tắc ở phần Cách nó
      hoạt động.
    answer:
      short: >-
        File khai báo `old_total` kèm thông điệp thay thế và chỉ gọi `new_total`. Có thể chủ động bỏ
        comment lời gọi cũ để quan sát cảnh báo compiler.


        File `.cpp` dùng dữ liệu cố định để tự đoán và kiểm tra output.
      detailed: >-
        Attribute gắn thông điệp chẩn đoán vào declaration cũ nhưng vẫn giữ signature và hành vi nhị
        phân. Compiler phù hợp chuẩn có thể phát cảnh báo khi source code gọi hoặc nhắc tới
        declaration đó. Ví dụ dùng API thay thế nên biên dịch sạch, đồng thời vẫn để declaration cũ
        đã đánh dấu cho người học quan sát.


