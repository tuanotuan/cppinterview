    lessonId: cpp14-ordered-containers-transparent-comparator
    type: recall
    responseMode: text
    difficulty: beginner
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: Mục đích chính của Ordered containers và transparent comparator là gì?
    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu ràng buộc mà tính năng làm rõ.
    answer:
      short: Ordered container duy trì key theo comparator và khái niệm tương đương đến từ ordering chứ
        không phải `operator==`. Transparent comparator C++14 như `std::less<>` có thể so sánh các
        kiểu giống key tương thích.
      detailed: >-
        Ordered container duy trì key theo comparator và khái niệm tương đương đến từ ordering chứ
        không phải `operator==`. Transparent comparator C++14 như `std::less<>` có thể so sánh các
        kiểu giống key tương thích.


        Cây chỉ hỏi một key có nhỏ hơn key kia không. Transparent comparator có call operator dạng
        template và cho biết lookup không cần dựng trước đúng kiểu key được lưu.
    rubric:
      required:
        - Nêu đúng vấn đề mà chủ đề giải quyết.
