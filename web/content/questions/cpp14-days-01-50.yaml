    code: "#include <functional>\r

      #include <iostream>\r

      #include <set>\r

      #include <string>\r

      \r

      int main() {\r

      \    std::set<std::string, std::less<>> names{\"lan\", \"an\", \"minh\"};\r

      \r

      \    std::cout << \"ordered:\";\r

      \    for (const auto& name : names) std::cout << ' ' << name;\r

      \    const auto found = names.find(\"lan\"); // heterogeneous argument\r

