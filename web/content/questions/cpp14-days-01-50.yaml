    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu ràng buộc mà tính năng làm rõ.
    answer:
      short: Xóa API cũ ngay lập tức làm hỏng code người dùng, nhưng giữ im lặng lại khuyến khích phụ
        thuộc mới. Attribute chuẩn `[[deprecated]]` giữ declaration còn dùng được đồng thời yêu cầu
        compiler cảnh báo nơi gọi và có thể chỉ ra cách thay thế.
      detailed: >-
        Xóa API cũ ngay lập tức làm hỏng code người dùng, nhưng giữ im lặng lại khuyến khích phụ
        thuộc mới. Attribute chuẩn `[[deprecated]]` giữ declaration còn dùng được đồng thời yêu cầu
        compiler cảnh báo nơi gọi và có thể chỉ ra cách thay thế.


        Deprecation là tín hiệu migration theo giai đoạn, không phải xóa ngay. Trước hết thêm bản
        thay thế, sau đó đánh dấu entry point cũ, chuyển call site rồi chỉ xóa ở bản breaking change
        đã thông báo.
