    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: Mục đích chính của C++ memory model và memory ordering là gì?
    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu ràng buộc mà tính năng làm rõ.
    answer:
      short: Atomicity riêng lẻ không xác định lúc nào ghi trên vùng nhớ khác trở nên nhìn thấy. C++
        memory model định nghĩa quan hệ ordering, còn release/acquire có thể publish dữ liệu thường
        an toàn từ thread này sang thread khác.
      detailed: >-
        Atomicity riêng lẻ không xác định lúc nào ghi trên vùng nhớ khác trở nên nhìn thấy. C++
        memory model định nghĩa quan hệ ordering, còn release/acquire có thể publish dữ liệu thường
        an toàn từ thread này sang thread khác.


        Producer ghi dữ liệu rồi release store vào flag. Consumer đọc đúng value đó bằng acquire sẽ
        tạo cạnh synchronizes-with, khiến write trước đó của producer happen-before read sau đó của
        consumer.
    rubric:
      required:
        - Nêu đúng vấn đề mà chủ đề giải quyết.
