    hint: Xác định invariant về kiểu, lifetime, ownership, invalidation hoặc ordering bị vi phạm trước
      khi đề xuất thay đổi nhỏ nhất.
    answer:
      short: Định nghĩa variable template không const trong header mà không hiểu linkage có thể tạo shared
        state hoặc definition bất ngờ. Trước khi áp dụng mẫu, phải kiểm tra template argument, kiểu
        biến được instantiate, phép chuyển initializer, constness và linkage.
      detailed: >-
        Định nghĩa variable template không const trong header mà không hiểu linkage có thể tạo
        shared state hoặc definition bất ngờ. Trước khi áp dụng mẫu, phải kiểm tra template
        argument, kiểu biến được instantiate, phép chuyển initializer, constness và linkage.


        Nên dùng khi hằng có tên hoặc giá trị trait thay đổi tự nhiên theo kiểu hay compile-time
        parameter khác. Tránh dùng khi một hằng thông thường đã đủ hoặc function diễn đạt phép tính
        trì hoãn chính xác hơn.


        Variable template đem khả năng tái sử dụng có parameter cho value giống như function và
        class template làm với hành vi và kiểu. Compiler hoặc thư viện luôn theo quy tắc cụ thể; cần
        kiểm tra template argument, kiểu biến được instantiate, phép chuyển initializer, constness
        và linkage. Ưu tiên cách viết nhỏ nhất thể hiện rõ ý định và đo đạc khi hiệu năng thực sự
        quan trọng.
