    answer:
      short: Tổ chức lại dữ liệu vì lợi ích cache phỏng đoán mà không profiling có thể làm code khó hiểu
        và tối ưu sai loop. Trước khi áp dụng mẫu, phải kiểm tra hot access pattern, contiguity,
        stride, working-set size, vectorization, branch behavior và cache metric từ profiler.
      detailed: >-
        Tổ chức lại dữ liệu vì lợi ích cache phỏng đoán mà không profiling có thể làm code khó hiểu
        và tối ưu sai loop. Trước khi áp dụng mẫu, phải kiểm tra hot access pattern, contiguity,
        stride, working-set size, vectorization, branch behavior và cache metric từ profiler.


        Nên dùng khi profiling cho thấy memory stall trong hot loop xử lý nhiều record giống nhau.
        Tránh dùng khi data rất nhỏ hoặc độ rõ domain và invariant quan trọng hơn thay đổi layout
        chưa đo.


