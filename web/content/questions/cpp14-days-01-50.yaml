  - id: cpp14-fixed-width-binary-parsing-endianness-003
    lessonId: cpp14-fixed-width-binary-parsing-endianness
    type: pitfall
    responseMode: text
    difficulty: advanced
    interviewCategory: code_review_debug
    interviewFormat: bug_hunt
    estimatedMinutes: 5
    prompt: Vì sao mỗi byte `std::uint8_t` phải đổi sang `std::uint32_t` trước khi left shift nhiều bit?
    hint: Xác định invariant về kiểu, lifetime, ownership, invalidation hoặc ordering bị vi phạm trước
      khi đề xuất thay đổi nhỏ nhất.
    answer:
      short: Shift signed narrow value trước khi widen có thể overflow hoặc sign-extend; copy trực tiếp
        struct còn kéo theo padding và host endianness. Trước khi áp dụng mẫu, phải kiểm tra field
        width, signedness, số bit shift, input length, byte order đã khai báo, overflow, bound và
        validation format.
      detailed: >-
        Shift signed narrow value trước khi widen có thể overflow hoặc sign-extend; copy trực tiếp
        struct còn kéo theo padding và host endianness. Trước khi áp dụng mẫu, phải kiểm tra field
        width, signedness, số bit shift, input length, byte order đã khai báo, overflow, bound và
        validation format.


        Nên dùng khi đọc file, network packet, device register hoặc format có width và byte order
        quy định. Tránh dùng khi native struct layout hoặc pointer cast được dùng như đường tắt cho
        parsing portable.


        Binary parsing portable tuân theo width và order của format một cách rõ ràng thay vì tin
        host representation. Compiler hoặc thư viện luôn theo quy tắc cụ thể; cần kiểm tra field
        width, signedness, số bit shift, input length, byte order đã khai báo, overflow, bound và
        validation format. Ưu tiên cách viết nhỏ nhất thể hiện rõ ý định và đo đạc khi hiệu năng
        thực sự quan trọng.
    rubric:
      required:
        - Chỉ ra chính xác quy tắc C++14 hoặc invariant bị vi phạm.
        - Giải thích hậu quả quan sát được, lỗi compile hoặc undefined behavior nếu có.
        - Đề xuất thay đổi nhỏ nhất loại bỏ nguyên nhân thay vì che triệu chứng.
      bonus:
        - Nêu được trade-off của bản sửa đối với API, lifetime hoặc hiệu năng.
      misconceptions:
        - Cho rằng chương trình an toàn chỉ vì có thể compile hoặc chạy một lần.
