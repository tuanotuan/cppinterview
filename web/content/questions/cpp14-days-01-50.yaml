  - id: cpp14-thread-mutex-atomic-memory-model-review-001
    lessonId: cpp14-thread-mutex-atomic-memory-model-review
    type: recall
    responseMode: text
    difficulty: beginner
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: Mục đích chính của Ôn thread, mutex, atomic và C++ memory model là gì?
    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu ràng buộc mà tính năng làm rõ.
    answer:
      short: Nhiều thread có thể chạy cùng lúc và chạm vào shared memory. Thư viện thread khởi chạy công
        việc, mutex bảo vệ thao tác nhiều bước không atomic, atomic cung cấp thao tác không thể bị
        chia nhỏ, còn memory model định nghĩa lúc nào truy cập tạo data race.
      detailed: >-
        Nhiều thread có thể chạy cùng lúc và chạm vào shared memory. Thư viện thread khởi chạy công
        việc, mutex bảo vệ thao tác nhiều bước không atomic, atomic cung cấp thao tác không thể bị
        chia nhỏ, còn memory model định nghĩa lúc nào truy cập tạo data race.


        Các thread xen kẽ theo thứ tự không đoán trước. Mọi shared write phải có cơ chế đồng bộ:
        hoặc mọi truy cập dùng cùng mutex, hoặc atomic cung cấp ordering phù hợp.
