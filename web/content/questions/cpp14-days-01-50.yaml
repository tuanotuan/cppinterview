  - id: cpp14-std-exchange-move-state-transition-003
    lessonId: cpp14-std-exchange-move-state-transition
    type: pitfall
    responseMode: text
    difficulty: advanced
    interviewCategory: code_review_debug
    interviewFormat: bug_hunt
    estimatedMinutes: 5
    prompt: Trong move assignment operator, vì sao `std::exchange(other.pointer, nullptr)` có thể diễn
      đạt cùng lúc chuyển ownership và reset nguồn?
    hint: Xác định invariant về kiểu, lifetime, ownership, invalidation hoặc ordering bị vi phạm trước
      khi đề xuất thay đổi nhỏ nhất.
    answer:
      short: Nhầm `std::exchange` với `std::swap` là sai vì swap cập nhật cả hai object và không trả giá
        trị. Trước khi áp dụng mẫu, phải kiểm tra giá trị cũ sau move, chi phí assignment, phép
        chuyển replacement và hành vi exception.
      detailed: >-
        Nhầm `std::exchange` với `std::swap` là sai vì swap cập nhật cả hai object và không trả giá
        trị. Trước khi áp dụng mẫu, phải kiểm tra giá trị cũ sau move, chi phí assignment, phép
        chuyển replacement và hành vi exception.


        Nên dùng khi state machine, move operation, reset handle hoặc chuyển counter cần giữ trạng
        thái trước đó. Tránh dùng khi phép gán thông thường đã đủ và giá trị cũ không được dùng.


        `std::exchange` đóng gói thao tác chuyển trạng thái phổ biến nhưng vẫn giữ được giá trị
        trước đó. Compiler hoặc thư viện luôn theo quy tắc cụ thể; cần kiểm tra giá trị cũ sau move,
        chi phí assignment, phép chuyển replacement và hành vi exception. Ưu tiên cách viết nhỏ nhất
        thể hiện rõ ý định và đo đạc khi hiệu năng thực sự quan trọng.
    rubric:
      required:
        - Chỉ ra chính xác quy tắc C++14 hoặc invariant bị vi phạm.
        - Giải thích hậu quả quan sát được, lỗi compile hoặc undefined behavior nếu có.
        - Đề xuất thay đổi nhỏ nhất loại bỏ nguyên nhân thay vì che triệu chứng.
      bonus:
        - Nêu được trade-off của bản sửa đối với API, lifetime hoặc hiệu năng.
      misconceptions:
        - Cho rằng chương trình an toàn chỉ vì có thể compile hoặc chạy một lần.
