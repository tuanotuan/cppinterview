  - id: cpp14-fixed-width-binary-parsing-endianness-002
    lessonId: cpp14-fixed-width-binary-parsing-endianness
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Giá trị hexadecimal nào được tạo từ các byte big-endian `12 34 56 78`?
    code: "#include <array>\r

      #include <cstdint>\r

      #include <cstring>\r

      #include <iomanip>\r

      #include <iostream>\r

      \r

      int main() {\r

      \    const std::array<std::uint8_t, 4> bytes{{0x12, 0x34, 0x56, 0x78}};\r

      \    const std::uint32_t value =\r

      \        (std::uint32_t(bytes[0]) << 24) |\r

      \        (std::uint32_t(bytes[1]) << 16) |\r

      \        (std::uint32_t(bytes[2]) << 8) |\r

      \        std::uint32_t(bytes[3]);\r

      \r

      \    std::uint16_t marker = 1;\r

      \    std::uint8_t first_byte = 0;\r

      \    std::memcpy(&first_byte, &marker, sizeof(first_byte));\r

      \r

      \    std::cout << \"parsed: \" << std::hex << value << \"\\n\";\r

      \    std::cout << \"host endian: \"\r

      \              << (first_byte == 1 ? \"little\" : \"big\") << \"\\n\";\r

      }\r\n"
    hint: Lần theo dữ liệu cố định trong mã mẫu, rồi đối chiếu từng kết quả với quy tắc ở phần Cách nó
      hoạt động.
    answer:
      short: >-
        Dãy byte 12 34 56 78 được ghép thành word big-endian. `std::memcpy` kiểm tra an toàn một
        byte của marker 16-bit để nhận biết host order.


        File `.cpp` dùng dữ liệu cố định để tự đoán và kiểm tra output.
      detailed: >-
        Bốn byte fixed-width được hiểu là field 32-bit big-endian. Mỗi byte được widen sang unsigned
        32-bit trước khi shift, rồi bitwise OR ghép value. Value đã parse in dạng hexadecimal
        `12345678`, còn phép copy byte riêng báo native endian order của host.


        Dãy byte 12 34 56 78 được ghép thành word big-endian. `std::memcpy` kiểm tra an toàn một
        byte của marker 16-bit để nhận biết host order.


        File `.cpp` dùng dữ liệu cố định để tự đoán và kiểm tra output.
    rubric:
      required:
        - Nêu đúng giá trị, kiểu hoặc trạng thái mà ví dụ tạo ra.
        - Gắn từng kết quả với câu lệnh và quy tắc C++14 tương ứng.
        - Không suy đoán thêm input hoặc trạng thái ngoài mã mẫu.
      bonus:
        - Nêu được hệ quả liên quan đến kiểu, lifetime, ownership hoặc ordering.
      misconceptions:
        - Đoán kết quả mà không lần theo dữ liệu và quy tắc trong mã.
