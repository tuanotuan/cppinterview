  - id: cpp14-make-unique-ownership-factory-001
    lessonId: cpp14-make-unique-ownership-factory
    type: recall
    responseMode: text
    difficulty: beginner
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: Mục đích chính của std::make_unique và ownership factory là gì?
    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu ràng buộc mà tính năng làm rõ.
    answer:
      short: C++11 thường phải ghi `new` trong lúc tạo `std::unique_ptr`. `std::make_unique` của C++14 kết
        hợp cấp phát với tạo ownership trong một factory call rõ ràng và không lộ raw owning
        pointer.
      detailed: >-
        C++11 thường phải ghi `new` trong lúc tạo `std::unique_ptr`. `std::make_unique` của C++14
        kết hợp cấp phát với tạo ownership trong một factory call rõ ràng và không lộ raw owning
        pointer.


        Factory tạo đúng một object rồi đặt ngay dưới một unique owner. Khi owner ra khỏi scope hoặc
        bị gán lại, object tự động được hủy.
    rubric:
