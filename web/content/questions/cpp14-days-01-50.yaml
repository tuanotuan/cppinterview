  - id: cpp14-value-categories-move-semantics-ownership-review-003
    lessonId: cpp14-value-categories-move-semantics-ownership-review
    type: pitfall
    responseMode: text
    difficulty: advanced
    interviewCategory: code_review_debug
    interviewFormat: bug_hunt
    estimatedMinutes: 5
    prompt: Vì sao `std::move(x)` chỉ là một phép cast, và constructor hay assignment operator nào mới
      thực sự chuyển tài nguyên?
    hint: Xác định invariant về kiểu, lifetime, ownership, invalidation hoặc ordering bị vi phạm trước
      khi đề xuất thay đổi nhỏ nhất.
    answer:
      short: Tiếp tục dùng object như thể giá trị cũ được bảo đảm sau khi move sẽ dễ gây bug logic. Trước
        khi áp dụng mẫu, phải kiểm tra ai sở hữu tài nguyên trước và sau move, cùng các thao tác hợp
        lệ trên object moved-from.
      detailed: >-
        Tiếp tục dùng object như thể giá trị cũ được bảo đảm sau khi move sẽ dễ gây bug logic. Trước
        khi áp dụng mẫu, phải kiểm tra ai sở hữu tài nguyên trước và sau move, cùng các thao tác hợp
        lệ trên object moved-from.


        Nên dùng khi ownership là duy nhất và tài nguyên có thể được chuyển thay vì sao chép. Tránh
        dùng khi nguồn phải giữ nguyên giá trị cũ hoặc bài toán thực sự cần shared ownership.


        Move semantics chủ yếu là chuyển trạng thái hoặc ownership, không phải lời hứa rằng object
        nguồn bị hủy. Compiler hoặc thư viện luôn theo quy tắc cụ thể; cần kiểm tra ai sở hữu tài
        nguyên trước và sau move, cùng các thao tác hợp lệ trên object moved-from. Ưu tiên cách viết
        nhỏ nhất thể hiện rõ ý định và đo đạc khi hiệu năng thực sự quan trọng.
    rubric:
