questions:
  - id: cpp14-toolchain-compiler-flags-cpp14-001
    lessonId: cpp14-toolchain-compiler-flags-cpp14
    type: recall
    responseMode: text
    difficulty: beginner
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: Mục đích chính của Toolchain, compiler flags và chế độ C++14 là gì?
    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu ràng buộc mà tính năng làm rõ.
    answer:
      short: File nguồn C++ không tự quyết định chế độ ngôn ngữ hay mức cảnh báo. Toolchain và các
        compiler flag xác định cú pháp C++14 có được chấp nhận hay không, cảnh báo nào xuất hiện và
        file nguồn được biến thành chương trình chạy được như thế nào.
      detailed: >-
        File nguồn C++ không tự quyết định chế độ ngôn ngữ hay mức cảnh báo. Toolchain và các
        compiler flag xác định cú pháp C++14 có được chấp nhận hay không, cảnh báo nào xuất hiện và
        file nguồn được biến thành chương trình chạy được như thế nào.


        Hãy hình dung toolchain như dây chuyền gồm tiền xử lý, biên dịch, hợp dịch rồi liên kết.
        Lệnh biên dịch là một hợp đồng chọn chuẩn C++ và yêu cầu compiler báo những đoạn code đáng
        ngờ.
    rubric:
      required:
        - Nêu đúng vấn đề mà chủ đề giải quyết.
        - Mô tả đúng cơ chế hoặc contract C++14 liên quan.
        - Không nhầm tính năng C++14 với hành vi phụ thuộc compiler.
      bonus:
        - Liên hệ được tác động ở compile time với hành vi lúc chạy.
      misconceptions:
        - Chỉ nhắc tên tính năng mà không giải thích mục đích hoặc ràng buộc.
