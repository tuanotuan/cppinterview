        từ cuối về đầu. Tránh dùng khi iterator được giữ qua mutation không kiểm soát; hãy lấy lại
        iterator hoặc thiết kế lại vòng lặp.


        Tính hợp lệ của iterator là hệ quả được tài liệu hóa của thao tác container, không được đoán
        từ địa chỉ. Compiler hoặc thư viện luôn theo quy tắc cụ thể; cần kiểm tra iterator category,
        container sở hữu, mutation đã làm, quy tắc invalidation được tài liệu hóa và end sentinel
        đúng. Ưu tiên cách viết nhỏ nhất thể hiện rõ ý định và đo đạc khi hiệu năng thực sự quan
        trọng.
    rubric:
      required:
        - Chỉ ra chính xác quy tắc C++14 hoặc invariant bị vi phạm.
        - Giải thích hậu quả quan sát được, lỗi compile hoặc undefined behavior nếu có.
        - Đề xuất thay đổi nhỏ nhất loại bỏ nguyên nhân thay vì che triệu chứng.
      bonus:
