  - id: cpp14-lock-free-spsc-queue-002
    lessonId: cpp14-lock-free-spsc-queue
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Vì sao ring có bốn slot vật lý chỉ cung cấp ba vị trí queue dùng được trong thiết kế này?
    code: "#include <array>\r

      #include <atomic>\r

      #include <cstddef>\r

      #include <iostream>\r

      #include <thread>\r

      \r

      template <class T, std::size_t Capacity>\r

      class SpscQueue {\r

      public:\r

      \    bool push(const T& value) {\r

      \        const auto tail = tail_.load(std::memory_order_relaxed);\r

      \        const auto next = (tail + 1) % Capacity;\r

      \        if (next == head_.load(std::memory_order_acquire)) return false;\r

      \        buffer_[tail] = value;\r

      \        tail_.store(next, std::memory_order_release);\r

      \        return true;\r

      \    }\r

      \r

      \    bool pop(T& value) {\r

      \        const auto head = head_.load(std::memory_order_relaxed);\r

      \        if (head == tail_.load(std::memory_order_acquire)) return false;\r

      \        value = buffer_[head];\r

      \        head_.store((head + 1) % Capacity, std::memory_order_release);\r

      \        return true;\r

      \    }\r

      \r

      private:\r

      \    std::array<T, Capacity> buffer_{};\r

      \    std::atomic<std::size_t> head_{0};\r

      \    std::atomic<std::size_t> tail_{0};\r

      };\r

      \r

      int main() {\r

      \    SpscQueue<int, 4> queue;\r

      \    const std::array<int, 3> sent{{10, 20, 30}};\r

      \    std::array<int, 3> received{};\r

      \r

      \    std::thread producer([&] {\r

      \        for (int value : sent)\r

      \            while (!queue.push(value)) std::this_thread::yield();\r

      \    });\r

      \    std::thread consumer([&] {\r

      \        for (int& value : received)\r

      \            while (!queue.pop(value)) std::this_thread::yield();\r

      \    });\r

      \r

      \    producer.join();\r

      \    consumer.join();\r

      \    std::cout << \"received:\";\r

      \    for (int value : received) std::cout << ' ' << value;\r

      \    std::cout << \"\\n\";\r

      }\r\n"
    hint: Lần theo dữ liệu cố định trong mã mẫu, rồi đối chiếu từng kết quả với quy tắc ở phần Cách nó
      hoạt động.
    answer:
      short: >-
        Array capacity bốn cung cấp ba slot dùng được để phân biệt full với empty. Hai thread chuyển
        ba số nguyên và main in dãy nhận sau khi join.


        File `.cpp` dùng dữ liệu cố định để tự đoán và kiểm tra output.
      detailed: >-
        Producer retry bounded push cho các value 10, 20, 30; chỉ nó cập nhật tail index. Consumer
        retry pop, chỉ đọc slot đã publish và tiến head bằng release ordering. Sau khi hai thread
        join, array nhận được in đúng FIFO order mà không mutex hay dynamic allocation.


        Array capacity bốn cung cấp ba slot dùng được để phân biệt full với empty. Hai thread chuyển
        ba số nguyên và main in dãy nhận sau khi join.


        File `.cpp` dùng dữ liệu cố định để tự đoán và kiểm tra output.
