    estimatedMinutes: 2
    prompt: Mục đích chính của Standard user-defined literals cho string, chrono và complex là gì?
    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu ràng buộc mà tính năng làm rõ.
    answer:
      short: Literal thô như `"hello"` hoặc `250` tự nó không biểu thị owning string, đơn vị thời gian hay
        số ảo. Hậu tố literal chuẩn của C++14 tạo trực tiếp giá trị thư viện có kiểu rõ.
      detailed: >-
        Literal thô như `"hello"` hoặc `250` tự nó không biểu thị owning string, đơn vị thời gian
        hay số ảo. Hậu tố literal chuẩn của C++14 tạo trực tiếp giá trị thư viện có kiểu rõ.


        Suffix hoạt động như phép chuyển compile-time được tìm qua namespace. Token vẫn ngắn nhưng
        kiểu kết quả mang theo ý nghĩa ownership hoặc đơn vị cho các phép toán sau.
    rubric:
      required:
