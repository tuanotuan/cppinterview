  - id: cpp14-value-categories-move-semantics-ownership-review-002
    lessonId: cpp14-value-categories-move-semantics-ownership-review
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Sau khi move một `std::unique_ptr`, trạng thái Boolean của nguồn và đích là gì?
    code: "#include <iostream>\r

      #include <memory>\r

      #include <utility>\r

      \r

      int main() {\r

      \    auto source = std::make_unique<int>(42);\r

      \    auto destination = std::move(source); // transfer ownership\r

      \r

      \    std::cout << \"source owns: \" << static_cast<bool>(source) << \"\\n\";\r

      \    std::cout << \"destination value: \" << *destination << \"\\n\";\r

      }\r\n"
    hint: Lần theo dữ liệu cố định trong mã mẫu, rồi đối chiếu từng kết quả với quy tắc ở phần Cách nó
      hoạt động.
    answer:
      short: >-
        Một điểm số cấp phát động ban đầu nằm trong `source`. Move smart pointer sang `destination`
        cũng chuyển trách nhiệm giải phóng, và phép kiểm tra Boolean xác nhận `source` đã rỗng.


        File `.cpp` dùng dữ liệu cố định để tự đoán và kiểm tra output.
      detailed: >-
        Một owner duy nhất được tạo nên kiểu smart pointer không cho phép sao chép. Cast nguồn thành
        rvalue cho phép move constructor chuyển con trỏ đang giữ sang object đích. Object đích sở
        hữu số nguyên, còn nguồn sau move vẫn hợp lệ nhưng trở thành rỗng.


        Một điểm số cấp phát động ban đầu nằm trong `source`. Move smart pointer sang `destination`
        cũng chuyển trách nhiệm giải phóng, và phép kiểm tra Boolean xác nhận `source` đã rỗng.


        File `.cpp` dùng dữ liệu cố định để tự đoán và kiểm tra output.
    rubric:
