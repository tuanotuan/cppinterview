  - id: cpp14-value-categories-move-semantics-ownership-review-001
    lessonId: cpp14-value-categories-move-semantics-ownership-review
    type: recall
    responseMode: text
    difficulty: beginner
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: Mục đích chính của Ôn value categories, move semantics và ownership là gì?
    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu ràng buộc mà tính năng làm rõ.
    answer:
      short: Sao chép object sở hữu tài nguyên có thể tốn kém hoặc bị cấm. Move semantics cho phép chuyển
        tài nguyên khỏi object sắp không còn cần, còn value category giúp overload resolution biết
        biểu thức nào có thể được move.
      detailed: >-
        Sao chép object sở hữu tài nguyên có thể tốn kém hoặc bị cấm. Move semantics cho phép chuyển
        tài nguyên khỏi object sắp không còn cần, còn value category giúp overload resolution biết
        biểu thức nào có thể được move.


        Lvalue thường gọi tên object còn tồn tại ổn định; rvalue thường là object tạm hoặc được đánh
        dấu có thể move. `std::move` không tự chuyển dữ liệu, nó chỉ cast để phép move có thể được
        chọn.
    rubric:
      required:
        - Nêu đúng vấn đề mà chủ đề giải quyết.
        - Mô tả đúng cơ chế hoặc contract C++14 liên quan.
        - Không nhầm tính năng C++14 với hành vi phụ thuộc compiler.
      bonus:
        - Liên hệ được tác động ở compile time với hành vi lúc chạy.
      misconceptions:
        - Chỉ nhắc tên tính năng mà không giải thích mục đích hoặc ràng buộc.
