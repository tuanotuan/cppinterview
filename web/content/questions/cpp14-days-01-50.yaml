  - id: cpp14-toolchain-compiler-flags-cpp14-003
    lessonId: cpp14-toolchain-compiler-flags-cpp14
    type: pitfall
    responseMode: text
    difficulty: advanced
    interviewCategory: code_review_debug
    interviewFormat: bug_hunt
    estimatedMinutes: 5
    prompt: Vì sao code có thể biên dịch bằng cấu hình mặc định nhưng thất bại khi build lại với
      `-std=c++14 -Wpedantic`?
    hint: Xác định invariant về kiểu, lifetime, ownership, invalidation hoặc ordering bị vi phạm trước
      khi đề xuất thay đổi nhỏ nhất.
    answer:
      short: Biên dịch mà không ghi rõ `-std=c++14` có thể âm thầm dùng chuẩn mặc định khác và che mất lỗi
        tương thích. Trước khi áp dụng mẫu, phải kiểm tra chuẩn được chọn, các cờ cảnh báo, tên file
        nguồn và tùy chọn liên kết.
      detailed: >-
        Biên dịch mà không ghi rõ `-std=c++14` có thể âm thầm dùng chuẩn mặc định khác và che mất
        lỗi tương thích. Trước khi áp dụng mẫu, phải kiểm tra chuẩn được chọn, các cờ cảnh báo, tên
        file nguồn và tùy chọn liên kết.


        Nên dùng khi mỗi lần biên dịch bài tập, kiểm tra tính tương thích hoặc cần một lệnh build có
        thể lặp lại. Tránh dùng khi chỉ dựa vào cấu hình ẩn của IDE mà không biết nó chọn compiler
        và chuẩn ngôn ngữ nào.


        Một lệnh build C++ có thể lặp lại luôn ghi rõ chuẩn ngôn ngữ và mức cảnh báo cần thiết.
        Compiler hoặc thư viện luôn theo quy tắc cụ thể; cần kiểm tra chuẩn được chọn, các cờ cảnh
        báo, tên file nguồn và tùy chọn liên kết. Ưu tiên cách viết nhỏ nhất thể hiện rõ ý định và
        đo đạc khi hiệu năng thực sự quan trọng.
    rubric:
      required:
        - Chỉ ra chính xác quy tắc C++14 hoặc invariant bị vi phạm.
        - Giải thích hậu quả quan sát được, lỗi compile hoặc undefined behavior nếu có.
        - Đề xuất thay đổi nhỏ nhất loại bỏ nguyên nhân thay vì che triệu chứng.
      bonus:
        - Nêu được trade-off của bản sửa đối với API, lifetime hoặc hiệu năng.
      misconceptions:
        - Cho rằng chương trình an toàn chỉ vì có thể compile hoặc chạy một lần.
    sources:
      - sectionId: loi-thuong-gap
      - sectionId: khi-nao-nen-dung
    sourceHash: 69ad5c68451ebfbe4ba467acd1b6237df071f0c5bbd60fe16fe51e3218964e37
    status: draft
    version: 1
  - id: cpp14-auto-decltype-type-deduction-review-001
    lessonId: cpp14-auto-decltype-type-deduction-review
    type: recall
    responseMode: text
    difficulty: beginner
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: Mục đích chính của Ôn auto, decltype và type deduction là gì?
    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu ràng buộc mà tính năng làm rõ.
    answer:
      short: Các kiểu dài hoặc phụ thuộc biểu thức khiến khai báo rối và dễ ghi sai. `auto` suy ra kiểu
        biến mới từ giá trị khởi tạo, còn `decltype` hỏi kiểu của một tên hoặc biểu thức.
      detailed: >-
        Các kiểu dài hoặc phụ thuộc biểu thức khiến khai báo rối và dễ ghi sai. `auto` suy ra kiểu
        biến mới từ giá trị khởi tạo, còn `decltype` hỏi kiểu của một tên hoặc biểu thức.


        Hãy xem `auto` giống suy luận đối số template: `const` cấp cao nhất và reference thường bị
        bỏ. Dùng `decltype` khi cần giữ đúng kiểu khai báo hoặc value category.
    rubric:
      required:
        - Nêu đúng vấn đề mà chủ đề giải quyết.
        - Mô tả đúng cơ chế hoặc contract C++14 liên quan.
        - Không nhầm tính năng C++14 với hành vi phụ thuộc compiler.
      bonus:
        - Liên hệ được tác động ở compile time với hành vi lúc chạy.
      misconceptions:
        - Chỉ nhắc tên tính năng mà không giải thích mục đích hoặc ràng buộc.
