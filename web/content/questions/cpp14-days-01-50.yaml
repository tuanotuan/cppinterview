    prompt: Mục đích chính của Object lifetime, RAII, Rule of Five và Rule of Zero là gì?
    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu ràng buộc mà tính năng làm rõ.
    answer:
      short: Tài nguyên phải được giải phóng trên mọi đường chạy, kể cả return sớm và exception. RAII gắn
        cleanup với object lifetime; Rule of Five chỉ ra các special operation mà owner tự quản lý
        có thể cần, còn Rule of Zero giao việc đó cho member type đáng tin cậy.
      detailed: >-
        Tài nguyên phải được giải phóng trên mọi đường chạy, kể cả return sớm và exception. RAII gắn
        cleanup với object lifetime; Rule of Five chỉ ra các special operation mà owner tự quản lý
        có thể cần, còn Rule of Zero giao việc đó cho member type đáng tin cậy.


        Lifetime của object giống một cặp ngoặc: construction tạo trạng thái hợp lệ và destruction
        đóng nó lại. Ưu tiên member như `std::vector` và `std::unique_ptr` để hành vi copy, move,
        hủy do compiler sinh làm đúng việc.
