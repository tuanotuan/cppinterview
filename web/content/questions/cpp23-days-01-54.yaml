  - id: cpp23-range-search-algorithms-003
    lessonId: cpp23-range-search-algorithms
    type: pitfall
    responseMode: text
    difficulty: advanced
    interviewCategory: code_review_debug
    interviewFormat: bug_hunt
    estimatedMinutes: 5
    prompt: Needle rỗng có ý nghĩa chính xác gì với `contains_subrange`, `starts_with`, `ends_with`, và
      vì sao phải test trường hợp biên?
    hint: Xác định invariant bị vi phạm, hậu quả và cách sửa nhỏ nhất thay vì chỉ nhìn kết quả một lần
      chạy.
    answer:
      short: findlast trả subrange thay vì một iterator đơn; dereference begin mà không kiểm tra rỗng là
        không hợp lệ khi không có kết quả. Không kiểm tra feature-test macro có thể chọn nhánh mã
        thư viện hiện tại chưa hỗ trợ.
      detailed: >-
        findlast trả subrange thay vì một iterator đơn; dereference begin mà không kiểm tra rỗng là
        không hợp lệ khi không có kết quả. Không kiểm tra feature-test macro có thể chọn nhánh mã
        thư viện hiện tại chưa hỗ trợ.


        Nên dùng khi kiểm tra biên và membership dễ đọc trên range có ngữ nghĩa equality tương
        thích. Tránh dùng khi tìm text theo locale hoặc trường hợp cần thuật toán matching phức tạp
        hơn.


