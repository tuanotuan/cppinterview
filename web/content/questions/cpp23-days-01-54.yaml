  - id: cpp23-print-println-002
    lessonId: cpp23-print-println
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: "Đọc chương trình mẫu: giá trị, kiểu hoặc nhánh nào được quan sát, và vì sao?"
    code: |
      #include <iostream>
      #include <version>

      #if __has_include(<print>)
      #include <print>
      #endif

      int main() {
          constexpr int score = 12;
      #if defined(__cpp_lib_print)
          std::println("score = {}", score);
      #else
          std::cout << "score = " << score << '\n';
      #endif
      }
    hint: Lần theo dữ liệu cố định trong mã mẫu, rồi gắn từng kết quả với quy tắc C++23 tương ứng.
    answer:
      short: Ví dụ tạo biểu thức hoặc đối tượng nhỏ nhất cho std::print và std::println. Chương trình dùng
        std::println khi thư viện có hỗ trợ và nhánh stream tương đương khi chưa có. Cuối cùng, nó
        in hoặc kiểm tra điểm cố định trên một dòng hoàn chỉnh để dễ đối chiếu.
      detailed: >-
        Ví dụ tạo biểu thức hoặc đối tượng nhỏ nhất cho std::print và std::println. Chương trình
        dùng std::println khi thư viện có hỗ trợ và nhánh stream tương đương khi chưa có. Cuối cùng,
        nó in hoặc kiểm tra điểm cố định trên một dòng hoàn chỉnh để dễ đối chiếu.


        Lệnh in đã xử lý 12 bản ghi bằng một format string và một đối số nguyên. Chương trình dùng
        dữ liệu cố định để output dễ kiểm tra.
    rubric:
      required:
        - Nêu đúng giá trị, kiểu hoặc nhánh được quan sát.
        - Gắn kết quả với câu lệnh và quy tắc C++23 tương ứng.
        - Không suy đoán thêm input hoặc trạng thái ngoài mã mẫu.
      bonus:
        - Nêu được hệ quả về lifetime, ownership, ordering hoặc portability.
      misconceptions:
        - Đoán kết quả mà không lần theo dữ liệu và quy tắc trong mã.
