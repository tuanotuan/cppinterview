    answer:
      short: Ví dụ tạo biểu thức hoặc đối tượng nhỏ nhất cho Module thư viện chuẩn std và std.compat.
        Chương trình đặt import thật sau build switch tường minh và chạy fallback bằng header trên
        GCC 13. Cuối cùng, nó in hoặc kiểm tra kết quả thư viện chuẩn cố định cùng ghi nhận trung
        thực rằng chưa bật thiết lập module để dễ đối chiếu.
      detailed: >-
        Ví dụ tạo biểu thức hoặc đối tượng nhỏ nhất cho Module thư viện chuẩn std và std.compat.
