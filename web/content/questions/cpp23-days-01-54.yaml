  - id: cpp23-binary-feed-parsing-003
    lessonId: cpp23-binary-feed-parsing
    type: pitfall
    responseMode: text
    difficulty: advanced
    interviewCategory: code_review_debug
    interviewFormat: bug_hunt
    estimatedMinutes: 5
    prompt: Vì sao `memcpy` vào số nguyên cục bộ portable về alignment và aliasing, và vì sao sau đó vẫn
      cần kiểm tra native endianness riêng?
    hint: Xác định invariant bị vi phạm, hậu quả và cách sửa nhỏ nhất thay vì chỉ nhìn kết quả một lần
      chạy.
    answer:
      short: Reinterpret byte pointer không alignment thành uint16t có thể vi phạm alignment và aliasing;
        đảo vô điều kiện làm sai máy big-endian; bỏ kiểm tra size gây đọc ngoài biên. Không kiểm tra
        feature-test macro có thể chọn nhánh mã thư viện hiện tại chưa hỗ trợ.
      detailed: >-
