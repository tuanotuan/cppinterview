  - id: cpp23-print-println-003
    lessonId: cpp23-print-println
    type: pitfall
    responseMode: text
    difficulty: advanced
    interviewCategory: code_review_debug
    interviewFormat: bug_hunt
    estimatedMinutes: 5
    prompt: Vì sao format string literal có thể loại kiểu đối số sai lúc biên dịch còn format string tạo
      động cần đường kiểm tra khác?
    hint: Xác định invariant bị vi phạm, hậu quả và cách sửa nhỏ nhất thay vì chỉ nhìn kết quả một lần
      chạy.
    answer:
      short: Format string runtime cần facility runtime phù hợp; số field và đối số không khớp có thể bị
        chẩn đoán compile-time với format literal. Không kiểm tra feature-test macro có thể chọn
        nhánh mã thư viện hiện tại chưa hỗ trợ.
      detailed: >-
        Format string runtime cần facility runtime phù hợp; số field và đối số không khớp có thể bị
        chẩn đoán compile-time với format literal. Không kiểm tra feature-test macro có thể chọn
        nhánh mã thư viện hiện tại chưa hỗ trợ.


        Nên dùng khi output cho người dùng, log và chẩn đoán cần format có kiểu gọn. Tránh dùng khi
        output nhị phân hoặc trạng thái stream tùy biến cao đã được mã stream cũ diễn đạt rõ.


        Tách quy tắc chuẩn khỏi mức hỗ trợ thực tế. Làm rõ lifetime, ownership và kiểu suy luận. Ưu
        tiên cú pháp ngắn, đúng ý định. Guard tính năng chưa được hỗ trợ đồng đều.
    rubric:
      required:
        - Chỉ ra chính xác invariant hoặc quy tắc C++23 liên quan.
        - Giải thích hậu quả quan sát được, lỗi compile hoặc undefined behavior nếu có.
        - Đề xuất cách xử lý nhỏ nhất loại bỏ nguyên nhân.
      bonus:
        - Nêu được trade-off của cách xử lý đối với API, lifetime hoặc hiệu năng.
      misconceptions:
        - Cho rằng chương trình an toàn chỉ vì compile hoặc chạy được một lần.
    sources:
