        Chương trình duyệt ký tự lấy qua phần tử của container tạm khi compiler hỗ trợ. Cuối cùng,
        nó in hoặc kiểm tra toàn bộ từ mà không đọc vùng nhớ đã bị hủy để dễ đối chiếu.
      detailed: >-
