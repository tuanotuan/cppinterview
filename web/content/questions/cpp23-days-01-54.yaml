    answer:
      short: Ví dụ tạo biểu thức hoặc đối tượng nhỏ nhất cho std::ranges::to và std::fromrange. Chương
        trình materialize view số nguyên đã biến đổi rồi tạo vector thứ hai từ range khi được hỗ
        trợ. Cuối cùng, nó in hoặc kiểm tra các giá trị biến đổi được sở hữu hoặc thông báo khả dụng
