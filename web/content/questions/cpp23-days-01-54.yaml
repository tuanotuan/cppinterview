        Hãy xem auto(x) là đưa x qua bộ lọc suy luận giống biến auto, rồi tạo một prvalue mới độc
        lập. Hãy xác định giá trị đang được biến đổi rồi kiểm tra kiểu, lifetime hoặc quyền sở hữu
        kết quả. Bật C++23 chưa chắc thư viện đã triển khai đủ, vì vậy cần kiểm tra feature-test
