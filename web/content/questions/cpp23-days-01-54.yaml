  - id: cpp23-std-modules-003
    lessonId: cpp23-std-modules
    type: pitfall
    responseMode: text
    difficulty: advanced
    interviewCategory: code_review_debug
    interviewFormat: bug_hunt
    estimatedMinutes: 5
    prompt: Vì sao `import std;` có thể là source C++23 hợp lệ nhưng vẫn lỗi trong lệnh compiler C++23
      đúng nếu chưa chuẩn bị artifact module của implementation?
    hint: Xác định invariant bị vi phạm, hậu quả và cách sửa nhỏ nhất thay vì chỉ nhìn kết quả một lần
      chạy.
    answer:
      short: Xem module như header văn bản hoặc compile import trước khi implementation build standard
        module sẽ gây lỗi thiếu module; std.compat không nên là lý do dùng mới các tên C global.
        Không kiểm tra feature-test macro có thể chọn nhánh mã thư viện hiện tại chưa hỗ trợ.
      detailed: >-
        Xem module như header văn bản hoặc compile import trước khi implementation build standard
        module sẽ gây lỗi thiếu module; std.compat không nên là lý do dùng mới các tên C global.
        Không kiểm tra feature-test macro có thể chọn nhánh mã thư viện hiện tại chưa hỗ trợ.


        Nên dùng khi toolchain được hỗ trợ nơi thử nghiệm build-time cho lợi ích rõ và artifact
        module được cấu hình lặp lại được. Tránh dùng khi dự án portable có tập compiler bắt buộc
        chưa build cùng module thư viện chuẩn.


        Tách quy tắc chuẩn khỏi mức hỗ trợ thực tế. Làm rõ lifetime, ownership và kiểu suy luận. Ưu
        tiên cú pháp ngắn, đúng ý định. Guard tính năng chưa được hỗ trợ đồng đều.
    rubric:
      required:
        - Chỉ ra chính xác invariant hoặc quy tắc C++23 liên quan.
        - Giải thích hậu quả quan sát được, lỗi compile hoặc undefined behavior nếu có.
        - Đề xuất cách xử lý nhỏ nhất loại bỏ nguyên nhân.
      bonus:
        - Nêu được trade-off của cách xử lý đối với API, lifetime hoặc hiệu năng.
      misconceptions:
        - Cho rằng chương trình an toàn chỉ vì compile hoặc chạy được một lần.
