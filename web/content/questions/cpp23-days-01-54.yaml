  - id: cpp23-out-ptr-inout-ptr-003
    lessonId: cpp23-out-ptr-inout-ptr
    type: pitfall
    responseMode: text
    difficulty: advanced
    interviewCategory: code_review_debug
    interviewFormat: bug_hunt
    estimatedMinutes: 5
    prompt: Vì sao `out_ptr` phù hợp với owner rỗng còn `inout_ptr` cần hợp đồng chính xác về cách hàm C
      xử lý pointer cũ?
    hint: Xác định invariant bị vi phạm, hậu quả và cách sửa nhỏ nhất thay vì chỉ nhìn kết quả một lần
      chạy.
    answer:
      short: Dùng inoutptr với API không giải phóng cũng không thay pointer cũ có thể rò rỉ hoặc
        double-delete; custom deleter phải khớp hàm cấp phát C. Không kiểm tra feature-test macro có
        thể chọn nhánh mã thư viện hiện tại chưa hỗ trợ.
      detailed: >-
        Dùng inoutptr với API không giải phóng cũng không thay pointer cũ có thể rò rỉ hoặc
        double-delete; custom deleter phải khớp hàm cấp phát C. Không kiểm tra feature-test macro có
        thể chọn nhánh mã thư viện hiện tại chưa hỗ trợ.


        Nên dùng khi kết nối smart pointer sở hữu với output parameter C cũ có hợp đồng rõ. Tránh
        dùng khi API C++ mới, vốn nên trả trực tiếp RAII owner thay vì lộ T.


        Tách quy tắc chuẩn khỏi mức hỗ trợ thực tế. Làm rõ lifetime, ownership và kiểu suy luận. Ưu
        tiên cú pháp ngắn, đúng ý định. Guard tính năng chưa được hỗ trợ đồng đều.
    rubric:
      required:
        - Chỉ ra chính xác invariant hoặc quy tắc C++23 liên quan.
        - Giải thích hậu quả quan sát được, lỗi compile hoặc undefined behavior nếu có.
        - Đề xuất cách xử lý nhỏ nhất loại bỏ nguyên nhân.
      bonus:
        - Nêu được trade-off của cách xử lý đối với API, lifetime hoặc hiệu năng.
      misconceptions:
        - Cho rằng chương trình an toàn chỉ vì compile hoặc chạy được một lần.
