    answer:
      short: Mã generic hiện đại phải giữ được việc đối số là đối tượng có tên hay giá trị tạm. Move có
        thể chuyển tài nguyên, còn perfect forwarding giữ value category của lời gọi.
      detailed: >-
        Mã generic hiện đại phải giữ được việc đối số là đối tượng có tên hay giá trị tạm. Move có
        thể chuyển tài nguyên, còn perfect forwarding giữ value category của lời gọi.


        Lvalue là đối tượng có danh tính; rvalue thường là giá trị có thể dùng rồi bỏ. std::move cho
        phép chuyển, còn std::forward giữ đúng category ban đầu theo điều kiện. Hãy xác định giá trị
        đang được biến đổi rồi kiểm tra kiểu, lifetime hoặc quyền sở hữu kết quả. Bật C++23 chưa
        chắc thư viện đã triển khai đủ, vì vậy cần kiểm tra feature-test macro liên quan.
    rubric:
