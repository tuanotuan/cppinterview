        dụng rõ ràng để dễ đối chiếu.


        Chỉ số lùi dùng -1z để giữ kiểu có dấu liên quan size thay vì wrap thành unsigned. Chương
        trình dùng dữ liệu cố định để output dễ kiểm tra.
