    lessonId: cpp23-templates-concepts-crtp-generic-programming
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: "Đọc chương trình mẫu: giá trị, kiểu hoặc nhánh nào được quan sát, và vì sao?"
    code: |
      #include <concepts>
      #include <iostream>

      template <class T>
      concept Addable = requires(T a, T b) {
          { a + b } -> std::same_as<T>;
      };

      template <Addable T>
      T add(T a, T b) {
          return a + b;
      }

      template <class Derived>
      struct Printable {
          void print() const {
              std::cout << static_cast<const Derived&>(*this).value() << '\n';
          }
      };

      struct Number : Printable<Number> {
          int data{7};
          int value() const { return data; }
      };

      int main() {
          std::cout << add(2, 3) << '\n';
          Number number;
          number.print();
      }
    hint: Lần theo dữ liệu cố định trong mã mẫu, rồi gắn từng kết quả với quy tắc C++23 tương ứng.
    answer:
