  - id: cpp23-coroutines-raii-memory-model-concurrency-002
    lessonId: cpp23-coroutines-raii-memory-model-concurrency
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: "Đọc chương trình mẫu: giá trị, kiểu hoặc nhánh nào được quan sát, và vì sao?"
    code: |
      #include <atomic>
      #include <iostream>
      #include <thread>

      int main() {
          std::atomic<int> counter{0};

          {
              std::jthread first([&] {
                  for (int i = 0; i < 1000; ++i)
                      counter.fetch_add(1, std::memory_order_relaxed);
              });
              std::jthread second([&] {
                  for (int i = 0; i < 1000; ++i)
                      counter.fetch_add(1, std::memory_order_relaxed);
              });
              // Both jthreads join when this scope ends.
          }

          std::cout << "counter=" << counter.load() << '\n';
      }
    hint: Lần theo dữ liệu cố định trong mã mẫu, rồi gắn từng kết quả với quy tắc C++23 tương ứng.
    answer:
      short: Ví dụ tạo biểu thức hoặc đối tượng nhỏ nhất cho Coroutines, RAII, memory model và
        concurrency. Chương trình khởi chạy hai thread được RAII quản lý để cập nhật bộ đếm atomic.
        Cuối cùng, nó in hoặc kiểm tra kết quả đếm xác định sau khi hai đối tượng thread ra khỏi
        scope và tự join để dễ đối chiếu.
