  - id: cpp23-toolchain-cpp23-support-003
    lessonId: cpp23-toolchain-cpp23-support
    type: pitfall
    responseMode: text
    difficulty: advanced
    interviewCategory: code_review_debug
    interviewFormat: bug_hunt
    estimatedMinutes: 5
    prompt: Vì sao hai bản cài GCC cùng nhận `-std=c++23` nhưng lại cung cấp các thành phần thư viện
      C++23 khác nhau?
    hint: Xác định invariant bị vi phạm, hậu quả và cách sửa nhỏ nhất thay vì chỉ nhìn kết quả một lần
      chạy.
    answer:
      short: Xem -std=c++23 là bằng chứng hỗ trợ đầy đủ có thể làm mã lỗi trên phiên bản thư viện chuẩn
        khác. Không kiểm tra feature-test macro có thể chọn nhánh mã thư viện hiện tại chưa hỗ trợ.
      detailed: >-
        Xem -std=c++23 là bằng chứng hỗ trợ đầy đủ có thể làm mã lỗi trên phiên bản thư viện chuẩn
        khác. Không kiểm tra feature-test macro có thể chọn nhánh mã thư viện hiện tại chưa hỗ trợ.


        Nên dùng khi khởi tạo dự án, báo lỗi compiler hoặc lập ma trận tính tương thích. Tránh dùng
        khi đóng cứng phiên bản hãng khi feature-test macro có thể kiểm tra đúng tính năng.


        Tách quy tắc chuẩn khỏi mức hỗ trợ thực tế. Làm rõ lifetime, ownership và kiểu suy luận. Ưu
        tiên cú pháp ngắn, đúng ý định. Guard tính năng chưa được hỗ trợ đồng đều.
    rubric:
      required:
        - Chỉ ra chính xác invariant hoặc quy tắc C++23 liên quan.
        - Giải thích hậu quả quan sát được, lỗi compile hoặc undefined behavior nếu có.
        - Đề xuất cách xử lý nhỏ nhất loại bỏ nguyên nhân.
      bonus:
        - Nêu được trade-off của cách xử lý đối với API, lifetime hoặc hiệu năng.
      misconceptions:
        - Cho rằng chương trình an toàn chỉ vì compile hoặc chạy được một lần.
    sources:
