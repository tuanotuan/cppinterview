  - id: cpp23-lifetime-allocation-constexpr-smart-pointers-003
    lessonId: cpp23-lifetime-allocation-constexpr-smart-pointers
    type: pitfall
    responseMode: text
    difficulty: advanced
    interviewCategory: code_review_debug
    interviewFormat: bug_hunt
    estimatedMinutes: 5
    prompt: Vì sao nhận storage đúng alignment và bắt đầu lifetime đối tượng là hai yêu cầu riêng, và
      thao tác nào đáp ứng từng yêu cầu?
    hint: Xác định invariant bị vi phạm, hậu quả và cách sửa nhỏ nhất thay vì chỉ nhìn kết quả một lần
      chạy.
    answer:
      short: Truy cập storage trước khi lifetime đối tượng bắt đầu là undefined behavior; deallocate bằng
        số yêu cầu thay vì số trả về có thể vi phạm hợp đồng allocator. Không kiểm tra feature-test
        macro có thể chọn nhánh mã thư viện hiện tại chưa hỗ trợ.
      detailed: >-
        Truy cập storage trước khi lifetime đối tượng bắt đầu là undefined behavior; deallocate bằng
        số yêu cầu thay vì số trả về có thể vi phạm hợp đồng allocator. Không kiểm tra feature-test
        macro có thể chọn nhánh mã thư viện hiện tại chưa hỗ trợ.


        Nên dùng khi triển khai allocator, object pool và thử nghiệm ownership compile-time có suy
        luận lifetime chặt. Tránh dùng khi đối tượng ứng dụng thường có thể tạo bình thường bằng
        container hoặc factory smart pointer.


        Tách quy tắc chuẩn khỏi mức hỗ trợ thực tế. Làm rõ lifetime, ownership và kiểu suy luận. Ưu
        tiên cú pháp ngắn, đúng ý định. Guard tính năng chưa được hỗ trợ đồng đều.
