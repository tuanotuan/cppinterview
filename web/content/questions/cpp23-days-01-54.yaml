  - id: cpp23-elifdef-elifndef-warning-001
    lessonId: cpp23-elifdef-elifndef-warning
    type: recall
    responseMode: text
    difficulty: beginner
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: Cú pháp ngắn nhất ở Phần 4 là gì và nhiệm vụ chính của nó là gì?
    hint: Đối chiếu vấn đề ban đầu với cú pháp tối thiểu và ý tưởng cốt lõi của bài.
    answer:
      short: Nhánh preprocessor thường kiểm tra macro có tồn tại. C++23 rút gọn dạng elif defined(...) phổ
        biến và chuẩn hóa warning để phát chẩn đoán có chủ ý mà không dừng dịch.
      detailed: >-
        Nhánh preprocessor thường kiểm tra macro có tồn tại. C++23 rút gọn dạng elif defined(...)
        phổ biến và chuẩn hóa warning để phát chẩn đoán có chủ ý mà không dừng dịch.


        Preprocessor chọn văn bản trước khi compiler phân tích C++. elifdef X hỏi nhãn có tồn tại;
        warning để lại cảnh báo rõ cho cấu hình được chọn. Hãy xác định giá trị đang được biến đổi
        rồi kiểm tra kiểu, lifetime hoặc quyền sở hữu kết quả. Bật C++23 chưa chắc thư viện đã triển
        khai đủ, vì vậy cần kiểm tra feature-test macro liên quan.
    rubric:
      required:
        - Nêu đúng mục đích của tính năng.
        - Giải thích đúng cơ chế hoặc contract C++23 liên quan.
        - Không nhầm quy tắc chuẩn với hành vi riêng của compiler.
      bonus:
        - Liên hệ được quy tắc với kiểu, lifetime, ownership hoặc tính portable.
      misconceptions:
        - Chỉ nhắc lại tên tính năng mà không giải thích ràng buộc.
