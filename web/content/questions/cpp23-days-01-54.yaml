    hint: Xác định invariant bị vi phạm, hậu quả và cách sửa nhỏ nhất thay vì chỉ nhìn kết quả một lần
      chạy.
    answer:
      short: Cho rằng mọi câu lệnh trong hàm constexpr đều chạy được lúc tính hằng là nhầm giữa quy tắc
        khai báo và quy tắc đánh giá. Không kiểm tra feature-test macro có thể chọn nhánh mã thư
        viện hiện tại chưa hỗ trợ.
      detailed: >-
        Cho rằng mọi câu lệnh trong hàm constexpr đều chạy được lúc tính hằng là nhầm giữa quy tắc
        khai báo và quy tắc đánh giá. Không kiểm tra feature-test macro có thể chọn nhánh mã thư
        viện hiện tại chưa hỗ trợ.


        Nên dùng khi thuật toán cần chạy cả lúc biên dịch lẫn runtime bằng một thân hàm dễ đọc.
        Tránh dùng khi ép khối lượng lớn vào compile time khi chỉ làm build chậm mà không tăng độ
        đúng.


        Tách quy tắc chuẩn khỏi mức hỗ trợ thực tế. Làm rõ lifetime, ownership và kiểu suy luận. Ưu
        tiên cú pháp ngắn, đúng ý định. Guard tính năng chưa được hỗ trợ đồng đều.
    rubric:
      required:
