  - id: cpp23-size-suffixes-extended-floats-001
    lessonId: cpp23-size-suffixes-extended-floats
    type: recall
    responseMode: text
    difficulty: beginner
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: Cú pháp ngắn nhất ở Phần 4 là gì và nhiệm vụ chính của nó là gì?
    hint: Đối chiếu vấn đề ban đầu với cú pháp tối thiểu và ý tưởng cốt lõi của bài.
    answer:
      short: Số học chỉ số thường trộn số nguyên có dấu với std::sizet, còn mã số học đôi khi cần độ rộng
        trao đổi cụ thể. C++23 thêm suffix liên quan size và các typedef floating mở rộng tùy chọn.
      detailed: >-
        Số học chỉ số thường trộn số nguyên có dấu với std::sizet, còn mã số học đôi khi cần độ rộng
        trao đổi cụ thể. C++23 thêm suffix liên quan size và các typedef floating mở rộng tùy chọn.


        uz tạo std::sizet; z tạo kiểu có dấu tương ứng. <stdfloat đặt tên format floating độ rộng cố
        định được hỗ trợ, nhưng implementation không bắt buộc có mọi format. Hãy xác định giá trị
        đang được biến đổi rồi kiểm tra kiểu, lifetime hoặc quyền sở hữu kết quả. Bật C++23 chưa
        chắc thư viện đã triển khai đủ, vì vậy cần kiểm tra feature-test macro liên quan.
    rubric:
      required:
        - Nêu đúng mục đích của tính năng.
        - Giải thích đúng cơ chế hoặc contract C++23 liên quan.
        - Không nhầm quy tắc chuẩn với hành vi riêng của compiler.
      bonus:
        - Liên hệ được quy tắc với kiểu, lifetime, ownership hoặc tính portable.
      misconceptions:
        - Chỉ nhắc lại tên tính năng mà không giải thích ràng buộc.
    sources:
