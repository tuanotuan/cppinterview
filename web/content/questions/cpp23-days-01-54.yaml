        cho các hàm create và replace kiểu C nhỏ điền std::uniqueptr khi được hỗ trợ. Cuối cùng, nó
        in hoặc kiểm tra giá trị do smart pointer sở hữu sau khi thích nghi để dễ đối chiếu.


        Trình nạp ảnh cũ ghi handle mới cấp phát qua Handle, còn C++ lưu kết quả trong unique owner.
        Chương trình dùng dữ liệu cố định để output dễ kiểm tra.
    rubric:
      required:
        - Nêu đúng giá trị, kiểu hoặc nhánh được quan sát.
        - Gắn kết quả với câu lệnh và quy tắc C++23 tương ứng.
        - Không suy đoán thêm input hoặc trạng thái ngoài mã mẫu.
      bonus:
        - Nêu được hệ quả về lifetime, ownership, ordering hoặc portability.
      misconceptions:
        - Đoán kết quả mà không lần theo dữ liệu và quy tắc trong mã.
