  - id: cpp23-binary-feed-parsing-002
    lessonId: cpp23-binary-feed-parsing
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: "Đọc chương trình mẫu: giá trị, kiểu hoặc nhánh nào được quan sát, và vì sao?"
    code: |
      #include <array>
      #include <bit>
      #include <cstddef>
      #include <cstdint>
      #include <cstring>
      #include <expected>
      #include <iostream>
      #include <span>
      #include <string_view>

      std::expected<std::uint16_t, std::string_view>
      parse_code(std::span<const std::byte> bytes) {
          if (bytes.size() < sizeof(std::uint16_t))
              return std::unexpected("too short");

          std::uint16_t value = 0;
          std::memcpy(&value, bytes.data(), sizeof(value));
          if constexpr (std::endian::native == std::endian::little)
              value = std::byteswap(value);
          return value;
      }

      int main() {
          std::array bytes{std::byte{0x12}, std::byte{0x34}};
          auto result = parse_code(bytes);
          if (result)
              std::cout << "code=" << *result << '\n';
          else
              std::cout << "error=" << result.error() << '\n';
      }
    hint: Lần theo dữ liệu cố định trong mã mẫu, rồi gắn từng kết quả với quy tắc C++23 tương ứng.
    answer:
      short: Ví dụ tạo biểu thức hoặc đối tượng nhỏ nhất cho Parse binary feed với span, byteswap và
        expected. Chương trình kiểm tra hai byte, copy vào số nguyên, đảo network order có điều kiện
        rồi trả kết quả có kiểu. Cuối cùng, nó in hoặc kiểm tra giá trị thập phân 4660 cho hai byte
        0x12 0x34 để dễ đối chiếu.
      detailed: >-
        Ví dụ tạo biểu thức hoặc đối tượng nhỏ nhất cho Parse binary feed với span, byteswap và
        expected. Chương trình kiểm tra hai byte, copy vào số nguyên, đảo network order có điều kiện
        rồi trả kết quả có kiểu. Cuối cùng, nó in hoặc kiểm tra giá trị thập phân 4660 cho hai byte
        0x12 0x34 để dễ đối chiếu.


        Parser mạng đọc message code 16-bit big-endian từ hai byte và báo too short thay vì ném
        exception. Chương trình dùng dữ liệu cố định để output dễ kiểm tra.
    rubric:
      required:
        - Nêu đúng giá trị, kiểu hoặc nhánh được quan sát.
        - Gắn kết quả với câu lệnh và quy tắc C++23 tương ứng.
        - Không suy đoán thêm input hoặc trạng thái ngoài mã mẫu.
      bonus:
        - Nêu được hệ quả về lifetime, ownership, ordering hoặc portability.
      misconceptions:
        - Đoán kết quả mà không lần theo dữ liệu và quy tắc trong mã.
