  - id: cpp23-auto-decay-copy-002
    lessonId: cpp23-auto-decay-copy
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: "Đọc chương trình mẫu: giá trị, kiểu hoặc nhánh nào được quan sát, và vì sao?"
    code: |
      #include <iostream>
      #include <type_traits>

      int main() {
          const int original = 7;
          const int& source = original;

          auto first = auto(source);   // C++23 decay-copy expression
          auto second = auto{source};

          static_assert(std::is_same_v<decltype(first), int>);
          static_assert(std::is_same_v<decltype(second), int>);

          first = 10;
          second = 20;
          std::cout << original << ' ' << first << ' ' << second << '\n';
      }
    hint: Lần theo dữ liệu cố định trong mã mẫu, rồi gắn từng kết quả với quy tắc C++23 tương ứng.
    answer:
      short: Ví dụ tạo biểu thức hoặc đối tượng nhỏ nhất cho Decay-copy với auto(x) và auto{x}. Chương
        trình sao chép một const int& bằng cả hai cách viết rồi kiểm tra kiểu suy luận. Cuối cùng,
        nó in hoặc kiểm tra hai giá trị int độc lập, thay đổi chúng không sửa nguồn để dễ đối chiếu.
      detailed: >-
