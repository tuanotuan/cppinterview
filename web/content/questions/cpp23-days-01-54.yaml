  - id: cpp23-lifetime-allocation-constexpr-smart-pointers-001
    lessonId: cpp23-lifetime-allocation-constexpr-smart-pointers
    type: recall
    responseMode: text
    difficulty: beginner
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: Cú pháp ngắn nhất ở Phần 4 là gì và nhiệm vụ chính của nó là gì?
    hint: Đối chiếu vấn đề ban đầu với cú pháp tối thiểu và ý tưởng cốt lõi của bài.
    answer:
      short: "C++23 mở ba khu vực trước đây khó diễn đạt: bắt đầu đối tượng implicit-lifetime trong raw
        storage, yêu cầu cấp phát kèm số lượng thật nhận được và dùng thêm thao tác smart pointer
        lúc tính hằng."
      detailed: >-
        C++23 mở ba khu vực trước đây khó diễn đạt: bắt đầu đối tượng implicit-lifetime trong raw
        storage, yêu cầu cấp phát kèm số lượng thật nhận được và dùng thêm thao tác smart pointer
        lúc tính hằng.


        Storage là căn phòng trống, lifetime là quyền xem byte như một đối tượng, còn ownership là
        chìa khóa. allocateatleast có thể thuê phòng lớn hơn và báo kích thước thật. Hãy xác định
        giá trị đang được biến đổi rồi kiểm tra kiểu, lifetime hoặc quyền sở hữu kết quả. Bật C++23
        chưa chắc thư viện đã triển khai đủ, vì vậy cần kiểm tra feature-test macro liên quan.
    rubric:
      required:
        - Nêu đúng mục đích của tính năng.
