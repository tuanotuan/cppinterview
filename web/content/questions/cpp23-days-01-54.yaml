    estimatedMinutes: 4
    prompt: "Đọc chương trình mẫu: giá trị, kiểu hoặc nhánh nào được quan sát, và vì sao?"
    code: |
      #include <cstddef>
      #include <iostream>
      #include <type_traits>

      #if __has_include(<stdfloat>)
      #include <stdfloat>
      #endif

      int main() {
          auto count = 10uz;
          auto offset = -1z;

          static_assert(std::is_same_v<decltype(count), std::size_t>);
          static_assert(std::is_same_v<decltype(offset),
                                       std::make_signed_t<std::size_t>>);
          std::cout << "count=" << count << " offset=" << offset << '\n';

      #if defined(__STDCPP_FLOAT32_T__)
          std::float32_t value = static_cast<std::float32_t>(1.5);
          std::cout << "float32 bytes=" << sizeof(value) << '\n';
      #else
          std::cout << "float32 type unavailable\n";
      #endif
      }
    hint: Lần theo dữ liệu cố định trong mã mẫu, rồi gắn từng kết quả với quy tắc C++23 tương ứng.
    answer:
      short: Ví dụ tạo biểu thức hoặc đối tượng nhỏ nhất cho Literal suffix z/uz và extended
        floating-point type. Chương trình kiểm tra kiểu literal và báo có điều kiện một floating
        type độ rộng cố định. Cuối cùng, nó in hoặc kiểm tra thông tin kích thước và kết quả khả
