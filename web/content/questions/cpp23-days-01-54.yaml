        macro có thể chọn nhánh mã thư viện hiện tại chưa hỗ trợ.


        Nên dùng khi lớp dispatch generic và partial application nhỏ có quyền sở hữu giá trị bind rõ
        ràng. Tránh dùng khi sắp xếp đối số phức tạp mà lambda có tên tham số dễ đọc hơn.


