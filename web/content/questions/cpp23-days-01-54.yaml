  - id: cpp23-optional-monadic-operations-002
    lessonId: cpp23-optional-monadic-operations
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: "Đọc chương trình mẫu: giá trị, kiểu hoặc nhánh nào được quan sát, và vì sao?"
    code: |
      #include <iostream>
      #include <optional>
      #include <string>

      int main() {
          std::optional<int> score{8};

          auto result = score
              .transform([](int value) { return value * 2; })
              .and_then([](int value) -> std::optional<std::string> {
                  if (value >= 10)
                      return std::to_string(value);
                  return std::nullopt;
              })
              .or_else([] {
                  return std::optional<std::string>{"no score"};
              });

          std::cout << *result << '\n';
      }
    hint: Lần theo dữ liệu cố định trong mã mẫu, rồi gắn từng kết quả với quy tắc C++23 tương ứng.
    answer:
      short: Ví dụ tạo biểu thức hoặc đối tượng nhỏ nhất cho Monadic operation của std::optional. Chương
        trình nhân đôi điểm có sẵn, kiểm tra, đổi sang chữ và cấp fallback nếu cần. Cuối cùng, nó in
        hoặc kiểm tra chuỗi đã biến đổi cho điểm hợp lệ cố định để dễ đối chiếu.
      detailed: >-
        Ví dụ tạo biểu thức hoặc đối tượng nhỏ nhất cho Monadic operation của std::optional. Chương
        trình nhân đôi điểm có sẵn, kiểm tra, đổi sang chữ và cấp fallback nếu cần. Cuối cùng, nó in
        hoặc kiểm tra chuỗi đã biến đổi cho điểm hợp lệ cố định để dễ đối chiếu.


        Tra cứu cấu hình parse port tùy chọn, kiểm tra khoảng và chỉ dùng mặc định khi không còn giá
