    prompt: Cú pháp ngắn nhất ở Phần 4 là gì và nhiệm vụ chính của nó là gì?
    hint: Đối chiếu vấn đề ban đầu với cú pháp tối thiểu và ý tưởng cốt lõi của bài.
    answer:
      short: Toán tử chèn stream có thể dài dòng và tách format khỏi giá trị. std::print C++23 ghi văn bản
        đã format trực tiếp, còn std::println thêm newline cuối.
      detailed: >-
        Toán tử chèn stream có thể dài dòng và tách format khỏi giá trị. std::print C++23 ghi văn
        bản đã format trực tiếp, còn std::println thêm newline cuối.


        Format string là khuôn có các lỗ theo thứ tự. Đối số lấp lỗ theo quy tắc format biết kiểu
        rồi kết quả đi thẳng đến output stream được chọn. Hãy xác định giá trị đang được biến đổi
        rồi kiểm tra kiểu, lifetime hoặc quyền sở hữu kết quả. Bật C++23 chưa chắc thư viện đã triển
        khai đủ, vì vậy cần kiểm tra feature-test macro liên quan.
