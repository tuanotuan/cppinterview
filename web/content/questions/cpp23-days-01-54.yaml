        programming. Chương trình kiểm tra hàm cộng có ràng buộc và một thao tác in nhỏ do CRTP cung
        cấp. Cuối cùng, nó in hoặc kiểm tra một tổng số học rồi đến giá trị do kiểu dẫn xuất cung
        cấp để dễ đối chiếu.
