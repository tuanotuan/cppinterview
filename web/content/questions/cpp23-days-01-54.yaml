    prompt: "Đọc chương trình mẫu: giá trị, kiểu hoặc nhánh nào được quan sát, và vì sao?"
    code: |
      #include <functional>
      #include <iostream>
      #include <version>

      int main() {
      #if defined(__cpp_lib_invoke_r)
          long result = std::invoke_r<long>(std::plus<>{}, 2, 3);
      #else
          long result = std::plus<>{}(2, 3);
      #endif
          std::cout << "invoke_r=" << result << '\n';

      #if defined(__cpp_lib_bind_back)
          auto add_ten = std::bind_back(std::plus<>{}, 10);
          std::cout << "bind_back=" << add_ten(5) << '\n';
      #else
          std::cout << "bind_back unavailable\n";
      #endif
      }
    hint: Lần theo dữ liệu cố định trong mã mẫu, rồi gắn từng kết quả với quy tắc C++23 tương ứng.
    answer:
      short: Ví dụ tạo biểu thức hoặc đối tượng nhỏ nhất cho std::invoker, std::bindback và callable
        utility. Chương trình gọi phép cộng với kiểu kết quả tường minh và bind có điều kiện một đối
        số cuối. Cuối cùng, nó in hoặc kiểm tra tổng đã chuyển kiểu và, khi có hỗ trợ, kết quả của
        callable đã bind để dễ đối chiếu.
      detailed: >-
        Ví dụ tạo biểu thức hoặc đối tượng nhỏ nhất cho std::invoker, std::bindback và callable
