    answer:
      short: Map dựa trên node cho node ổn định và chèn riêng lẻ rẻ nhưng locality cache kém. Flat map
        C++23 lưu key và value đã sort trong container nền liên tục để đổi lấy tradeoff hiệu năng
        khác.
      detailed: >-
        Map dựa trên node cho node ổn định và chèn riêng lẻ rẻ nhưng locality cache kém. Flat map
        C++23 lưu key và value đã sort trong container nền liên tục để đổi lấy tradeoff hiệu năng
        khác.


        Hãy hình dung bảng đã sort thay vì cây các hộp. Lookup dùng tìm kiếm có thứ tự; chèn có thể
        dời cả hậu tố. flatmap giữ key duy nhất, flatmultimap cho phép lặp. Hãy xác định giá trị
        đang được biến đổi rồi kiểm tra kiểu, lifetime hoặc quyền sở hữu kết quả. Bật C++23 chưa
        chắc thư viện đã triển khai đủ, vì vậy cần kiểm tra feature-test macro liên quan.
