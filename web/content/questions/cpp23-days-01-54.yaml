        frame có thể rò rỉ hoặc hủy trạng thái đang tạm dừng quá sớm. Không kiểm tra feature-test
        macro có thể chọn nhánh mã thư viện hiện tại chưa hỗ trợ.
      detailed: >-
        Dùng int thường cho ghi không đồng bộ tạo data race và undefined behavior; quên quyền sở hữu
        frame có thể rò rỉ hoặc hủy trạng thái đang tạm dừng quá sớm. Không kiểm tra feature-test
        macro có thể chọn nhánh mã thư viện hiện tại chưa hỗ trợ.


        Nên dùng khi công việc bất đồng bộ có cấu trúc, quyền sở hữu rõ và quy tắc đồng bộ có lý do.
        Tránh dùng khi thread hoặc coroutine chỉ để làm công việc tuần tự trông nâng cao hơn.


