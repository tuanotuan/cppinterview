  - id: cpp23-cpp20-cpp23-migration-003
    lessonId: cpp23-cpp20-cpp23-migration
    type: pitfall
    responseMode: text
    difficulty: advanced
    interviewCategory: code_review_debug
    interviewFormat: bug_hunt
    estimatedMinutes: 5
    prompt: Làm sao wrapper tương thích giữ source compatibility mà không âm thầm đổi overload
      resolution hoặc hành vi sở hữu?
    hint: Xác định invariant bị vi phạm, hậu quả và cách sửa nhỏ nhất thay vì chỉ nhìn kết quả một lần
      chạy.
    answer:
      short: Đổi chế độ ngôn ngữ và mọi idiom thư viện cùng lúc làm khó cô lập regression; tắt warning
        deprecation che giấu nợ kỹ thuật. Không kiểm tra feature-test macro có thể chọn nhánh mã thư
        viện hiện tại chưa hỗ trợ.
      detailed: >-
        Đổi chế độ ngôn ngữ và mọi idiom thư viện cùng lúc làm khó cô lập regression; tắt warning
        deprecation che giấu nợ kỹ thuật. Không kiểm tra feature-test macro có thể chọn nhánh mã thư
        viện hiện tại chưa hỗ trợ.


        Nên dùng khi nâng cấp có kế hoạch với test, ma trận compiler và lớp tương thích nhỏ. Tránh
        dùng khi viết lại mã ổn định chỉ để dùng mọi tính năng mới hoặc bỏ fallback trước khi
        compiler mục tiêu theo kịp.


        Tách quy tắc chuẩn khỏi mức hỗ trợ thực tế. Làm rõ lifetime, ownership và kiểu suy luận. Ưu
        tiên cú pháp ngắn, đúng ý định. Guard tính năng chưa được hỗ trợ đồng đều.
    rubric:
      required:
