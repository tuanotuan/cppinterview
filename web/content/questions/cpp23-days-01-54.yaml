  - id: cpp23-mdspan-extents-003
    lessonId: cpp23-mdspan-extents
    type: pitfall
    responseMode: text
    difficulty: advanced
    interviewCategory: code_review_debug
    interviewFormat: bug_hunt
    estimatedMinutes: 5
    prompt: Nếu extent là static trong kiểu, thông tin size nào còn được lưu lúc chạy, và điều gì xảy ra
      khi buffer cấp thật sự quá nhỏ?
    hint: Xác định invariant bị vi phạm, hậu quả và cách sửa nhỏ nhất thay vì chỉ nhìn kết quả một lần
      chạy.
    answer:
      short: Storage nền phải sống lâu hơn mdspan, và index ngoài bất kỳ extent nào là undefined behavior;
        extents không cấp phát hay xác nhận size buffer không liên quan. Không kiểm tra feature-test
        macro có thể chọn nhánh mã thư viện hiện tại chưa hỗ trợ.
      detailed: >-
        Storage nền phải sống lâu hơn mdspan, và index ngoài bất kỳ extent nào là undefined
        behavior; extents không cấp phát hay xác nhận size buffer không liên quan. Không kiểm tra
        feature-test macro có thể chọn nhánh mã thư viện hiện tại chưa hỗ trợ.


        Nên dùng khi kernel số học, ảnh, matrix và interface tensor trên bộ nhớ do nơi khác sở hữu.
        Tránh dùng khi dữ liệu cần view tự sở hữu, resize hoặc tự kiểm tra biên.


        Tách quy tắc chuẩn khỏi mức hỗ trợ thực tế. Làm rõ lifetime, ownership và kiểu suy luận. Ưu
        tiên cú pháp ngắn, đúng ý định. Guard tính năng chưa được hỗ trợ đồng đều.
    rubric:
      required:
        - Chỉ ra chính xác invariant hoặc quy tắc C++23 liên quan.
