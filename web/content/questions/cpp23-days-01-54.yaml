  - id: cpp23-toolchain-cpp23-support-001
    lessonId: cpp23-toolchain-cpp23-support
    type: recall
    responseMode: text
    difficulty: beginner
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: Cú pháp ngắn nhất ở Phần 4 là gì và nhiệm vụ chính của nó là gì?
    hint: Đối chiếu vấn đề ban đầu với cú pháp tối thiểu và ý tưởng cốt lõi của bài.
    answer:
      short: Chuẩn ngôn ngữ là bản đặc tả, còn GCC, Clang và MSVC là các bản triển khai. Bài này chỉ cách
        bật chế độ C++23 và kiểm tra compiler hiện tại thật sự cung cấp gì.
      detailed: >-
        Chuẩn ngôn ngữ là bản đặc tả, còn GCC, Clang và MSVC là các bản triển khai. Bài này chỉ cách
        bật chế độ C++23 và kiểm tra compiler hiện tại thật sự cung cấp gì.


        Hãy hình dung C++23 là một bảng kiểm. Toolchain có thể hỗ trợ nhiều ô nhưng vẫn bỏ trống một
        số tính năng ngôn ngữ hoặc thư viện. Hãy xác định giá trị đang được biến đổi rồi kiểm tra
        kiểu, lifetime hoặc quyền sở hữu kết quả. Bật C++23 chưa chắc thư viện đã triển khai đủ, vì
        vậy cần kiểm tra feature-test macro liên quan.
    rubric:
      required:
        - Nêu đúng mục đích của tính năng.
        - Giải thích đúng cơ chế hoặc contract C++23 liên quan.
        - Không nhầm quy tắc chuẩn với hành vi riêng của compiler.
      bonus:
        - Liên hệ được quy tắc với kiểu, lifetime, ownership hoặc tính portable.
      misconceptions:
        - Chỉ nhắc lại tên tính năng mà không giải thích ràng buộc.
