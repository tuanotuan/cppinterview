  - id: cpp23-toolchain-cpp23-support-002
    lessonId: cpp23-toolchain-cpp23-support
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: "Đọc chương trình mẫu: giá trị, kiểu hoặc nhánh nào được quan sát, và vì sao?"
    code: |
      #include <iostream>

      int main() {
          static_assert(__cplusplus > 202002L);
          std::cout << "__cplusplus=" << __cplusplus << '\n';

      #if defined(__clang__)
          std::cout << "compiler=Clang " << __clang_major__ << '.'
                    << __clang_minor__ << '\n';
      #elif defined(__GNUC__)
          std::cout << "compiler=GCC " << __GNUC__ << '.'
                    << __GNUC_MINOR__ << '.' << __GNUC_PATCHLEVEL__ << '\n';
      #elif defined(_MSC_VER)
          std::cout << "compiler=MSVC " << _MSC_VER << '\n';
      #else
          std::cout << "compiler=unknown\n";
      #endif
      }
    hint: Lần theo dữ liệu cố định trong mã mẫu, rồi gắn từng kết quả với quy tắc C++23 tương ứng.
    answer:
      short: Ví dụ tạo biểu thức hoặc đối tượng nhỏ nhất cho Toolchain và mức hỗ trợ C++23. Chương trình
        in giá trị chế độ chuẩn và nhận diện compiler đang dùng qua macro định nghĩa sẵn. Cuối cùng,
        nó in hoặc kiểm tra số hiệu chế độ C++23 và phiên bản GCC nhìn thấy rõ để dễ đối chiếu.
      detailed: >-
        Ví dụ tạo biểu thức hoặc đối tượng nhỏ nhất cho Toolchain và mức hỗ trợ C++23. Chương trình
        in giá trị chế độ chuẩn và nhận diện compiler đang dùng qua macro định nghĩa sẵn. Cuối cùng,
        nó in hoặc kiểm tra số hiệu chế độ C++23 và phiên bản GCC nhìn thấy rõ để dễ đối chiếu.


        Một tác vụ CI ghi cplusplus và macro của hãng bên cạnh từng kết quả build. Chương trình dùng
        dữ liệu cố định để output dễ kiểm tra.
    rubric:
      required:
        - Nêu đúng giá trị, kiểu hoặc nhánh được quan sát.
        - Gắn kết quả với câu lệnh và quy tắc C++23 tương ứng.
        - Không suy đoán thêm input hoặc trạng thái ngoài mã mẫu.
      bonus:
        - Nêu được hệ quả về lifetime, ownership, ordering hoặc portability.
      misconceptions:
        - Đoán kết quả mà không lần theo dữ liệu và quy tắc trong mã.
    sources:
