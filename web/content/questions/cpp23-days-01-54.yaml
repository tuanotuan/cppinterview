  - id: cpp23-deducing-this-crtp-mixins-recursive-lambdas-003
    lessonId: cpp23-deducing-this-crtp-mixins-recursive-lambdas
    type: pitfall
    responseMode: text
    difficulty: advanced
    interviewCategory: code_review_debug
    interviewFormat: bug_hunt
    estimatedMinutes: 5
    prompt: Vì sao `this auto self` thường sao chép closure object, và khi nào `this auto&& self` làm
      thay đổi hành vi hoặc hiệu năng?
    hint: Xác định invariant bị vi phạm, hậu quả và cách sửa nhỏ nhất thay vì chỉ nhìn kết quả một lần
      chạy.
    answer:
      short: Capture recursive lambda bằng tham chiếu ngay trong lúc chính nó khởi tạo là không hợp lệ; đệ
        quy bất cẩn vẫn có thể tràn stack. Không kiểm tra feature-test macro có thể chọn nhánh mã
        thư viện hiện tại chưa hỗ trợ.
      detailed: >-
        Capture recursive lambda bằng tham chiếu ngay trong lúc chính nó khởi tạo là không hợp lệ;
        đệ quy bất cẩn vẫn có thể tràn stack. Không kiểm tra feature-test macro có thể chọn nhánh mã
        thư viện hiện tại chưa hỗ trợ.


        Nên dùng khi thuật toán đệ quy cục bộ nhỏ và mixin nơi explicit-object bỏ các phép cast CRTP
        lặp lại. Tránh dùng khi đệ quy sâu hoặc trường hợp hàm có tên diễn đạt ý định rõ hơn.


        Tách quy tắc chuẩn khỏi mức hỗ trợ thực tế. Làm rõ lifetime, ownership và kiểu suy luận. Ưu
        tiên cú pháp ngắn, đúng ý định. Guard tính năng chưa được hỗ trợ đồng đều.
    rubric:
      required:
        - Chỉ ra chính xác invariant hoặc quy tắc C++23 liên quan.
        - Giải thích hậu quả quan sát được, lỗi compile hoặc undefined behavior nếu có.
        - Đề xuất cách xử lý nhỏ nhất loại bỏ nguyên nhân.
      bonus:
        - Nêu được trade-off của cách xử lý đối với API, lifetime hoặc hiệu năng.
      misconceptions:
        - Cho rằng chương trình an toàn chỉ vì compile hoặc chạy được một lần.
    sources:
