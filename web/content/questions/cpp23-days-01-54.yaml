  - id: cpp23-chunk-slide-chunk-by-stride-002
    lessonId: cpp23-chunk-slide-chunk-by-stride
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: "Đọc chương trình mẫu: giá trị, kiểu hoặc nhánh nào được quan sát, và vì sao?"
    code: |
      #include <array>
      #include <iostream>
      #include <ranges>
      #include <version>

      int main() {
      #if defined(__cpp_lib_ranges_chunk) && defined(__cpp_lib_ranges_slide) && \
          defined(__cpp_lib_ranges_chunk_by) && defined(__cpp_lib_ranges_stride)
          std::array values{1, 3, 2, 4, 5, 7};

          for (auto group : values | std::views::chunk(2))
              std::cout << '[' << *group.begin() << "] ";
          std::cout << '\n';

          for (auto window : values | std::views::slide(3))
              std::cout << *window.begin() << ' ';
          std::cout << '\n';

          auto same_parity = [](int a, int b) { return a % 2 == b % 2; };
          for (auto run : values | std::views::chunk_by(same_parity))
              std::cout << *run.begin() << ' ';
          std::cout << '\n';

          for (int value : values | std::views::stride(2))
              std::cout << value << ' ';
          std::cout << '\n';
      #else
          std::cout << "C++23 grouping views unavailable\n";
      #endif
      }
    hint: Lần theo dữ liệu cố định trong mã mẫu, rồi gắn từng kết quả với quy tắc C++23 tương ứng.
    answer:
