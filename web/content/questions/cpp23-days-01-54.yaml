        - Đề xuất cách xử lý nhỏ nhất loại bỏ nguyên nhân.
      bonus:
        - Nêu được trade-off của cách xử lý đối với API, lifetime hoặc hiệu năng.
      misconceptions:
        - Cho rằng chương trình an toàn chỉ vì compile hoặc chạy được một lần.
