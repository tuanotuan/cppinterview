  - id: cpp23-as-const-as-rvalue-custom-adaptors-002
    lessonId: cpp23-as-const-as-rvalue-custom-adaptors
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: "Đọc chương trình mẫu: giá trị, kiểu hoặc nhánh nào được quan sát, và vì sao?"
    code: |
      #include <iostream>
      #include <ranges>
      #include <type_traits>
      #include <utility>
      #include <vector>
      #include <version>

      #if defined(__cpp_lib_ranges_as_const) && defined(__cpp_lib_ranges_as_rvalue)
      struct FirstTwo : std::ranges::range_adaptor_closure<FirstTwo> {
          template <std::ranges::viewable_range R>
          constexpr auto operator()(R&& range) const {
              return std::forward<R>(range) | std::views::take(2);
          }
      };
      #endif

      int main() {
      #if defined(__cpp_lib_ranges_as_const) && defined(__cpp_lib_ranges_as_rvalue)
          std::vector values{1, 2, 3};
          auto read_only = values | std::views::as_const;
          static_assert(std::is_same_v<
              std::ranges::range_reference_t<decltype(read_only)>, const int&>);

          auto movable = values | std::views::as_rvalue;
          static_assert(std::is_rvalue_reference_v<
              std::ranges::range_reference_t<decltype(movable)>>);

          for (int value : values | FirstTwo{})
              std::cout << value << ' ';
          std::cout << '\n';
      #else
          std::cout << "as_const or as_rvalue views unavailable\n";
      #endif
      }
    hint: Lần theo dữ liệu cố định trong mã mẫu, rồi gắn từng kết quả với quy tắc C++23 tương ứng.
    answer:
      short: Ví dụ tạo biểu thức hoặc đối tượng nhỏ nhất cho asconst, asrvalue và custom range adaptor.
        Chương trình cung cấp có điều kiện truy cập const, rvalue và pipe range qua custom take
        adaptor nhỏ. Cuối cùng, nó in hoặc kiểm tra tham chiếu chỉ đọc, tham chiếu movable và custom
        view có giới hạn để dễ đối chiếu.
