  - id: cpp23-value-categories-lifetime-move-forwarding-002
    lessonId: cpp23-value-categories-lifetime-move-forwarding
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: "Đọc chương trình mẫu: giá trị, kiểu hoặc nhánh nào được quan sát, và vì sao?"
    code: |
      #include <iostream>
      #include <string>
      #include <utility>

      void inspect(const std::string&) {
          std::cout << "lvalue\n";
      }

      void inspect(std::string&&) {
          std::cout << "rvalue\n";
      }

      template <class T>
      void relay(T&& value) {
          // Preserve the caller's value category.
          inspect(std::forward<T>(value));
      }

      int main() {
          std::string name{"C++23"};
          relay(name);
          relay(std::string{"temporary"});
      }
    hint: Lần theo dữ liệu cố định trong mã mẫu, rồi gắn từng kết quả với quy tắc C++23 tương ứng.
    answer:
      short: Ví dụ tạo biểu thức hoặc đối tượng nhỏ nhất cho Value category, lifetime, move và perfect
        forwarding. Chương trình chuyển tiếp một chuỗi có tên dưới dạng lvalue và một chuỗi tạm dưới
        dạng rvalue. Cuối cùng, nó in hoặc kiểm tra hai nhãn overload khác nhau chứng minh category
        đã được giữ để dễ đối chiếu.
      detailed: >-
        Ví dụ tạo biểu thức hoặc đối tượng nhỏ nhất cho Value category, lifetime, move và perfect
        forwarding. Chương trình chuyển tiếp một chuỗi có tên dưới dạng lvalue và một chuỗi tạm dưới
        dạng rvalue. Cuối cùng, nó in hoặc kiểm tra hai nhãn overload khác nhau chứng minh category
        đã được giữ để dễ đối chiếu.


        Wrapper ghi log chuyển tiếp thông điệp đến overload dành cho chuỗi tái sử dụng và chuỗi tạm
        mà không sao chép thừa. Chương trình dùng dữ liệu cố định để output dễ kiểm tra.
    rubric:
      required:
