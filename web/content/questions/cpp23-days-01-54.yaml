    prompt: Cú pháp ngắn nhất ở Phần 4 là gì và nhiệm vụ chính của nó là gì?
    hint: Đối chiếu vấn đề ban đầu với cú pháp tối thiểu và ý tưởng cốt lõi của bài.
    answer:
      short: C++23 chuẩn hóa named module cho thư viện chuẩn. import std; cung cấp tên thư viện C++, còn
        std.compat thêm tên tương thích thường gắn với C header.
      detailed: >-
        C++23 chuẩn hóa named module cho thư viện chuẩn. import std; cung cấp tên thư viện C++, còn
        std.compat thêm tên tương thích thường gắn với C header.


        Header là văn bản được chèn vào từng translation unit; module là interface đã biên dịch được
        import theo tên. Cú pháp nguồn nhỏ nhưng cách build module vẫn phụ thuộc toolchain. Hãy xác
        định giá trị đang được biến đổi rồi kiểm tra kiểu, lifetime hoặc quyền sở hữu kết quả. Bật
        C++23 chưa chắc thư viện đã triển khai đủ, vì vậy cần kiểm tra feature-test macro liên quan.
