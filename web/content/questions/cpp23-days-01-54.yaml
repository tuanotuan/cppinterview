        trường đã parse hoặc lỗi.


        Hãy xem parsing như qua biên giới có kiểm soát: span nêu vùng byte có sẵn, kiểm tra size cấp
        quyền truy cập, memcpy tạo số nguyên an toàn và đổi endianness cho ý nghĩa trên máy. Hãy xác
        định giá trị đang được biến đổi rồi kiểm tra kiểu, lifetime hoặc quyền sở hữu kết quả. Bật
