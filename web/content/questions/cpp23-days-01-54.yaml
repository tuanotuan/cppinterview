    answer:
      short: Cho rằng mọi constructor kế thừa đều tạo deduction guide hữu ích có thể sai khi không suy ra
        được tham số; đưa alias ra scope rộng làm mất lợi ích. Không kiểm tra feature-test macro có
        thể chọn nhánh mã thư viện hiện tại chưa hỗ trợ.
      detailed: >-
        Cho rằng mọi constructor kế thừa đều tạo deduction guide hữu ích có thể sai khi không suy ra
        được tham số; đưa alias ra scope rộng làm mất lợi ích. Không kiểm tra feature-test macro có
        thể chọn nhánh mã thư viện hiện tại chưa hỗ trợ.


        Nên dùng khi wrapper dẫn xuất nhỏ có đối số constructor suy ra được và tên kiểu cục bộ chỉ
        dùng trong một nhánh. Tránh dùng khi CTAD khi template argument tường minh diễn đạt ý nghĩa
        miền bài toán rõ hơn.


