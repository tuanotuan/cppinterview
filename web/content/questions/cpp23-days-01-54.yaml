    code: |
      #include <iostream>

      #if defined(__cpp_static_call_operator) && __cpp_static_call_operator >= 202207L
      struct Scale {
          static int operator()(int value) {
              return value * 2;
          }

          static int operator[](int value) {
              return value * 3;
          }
      };
