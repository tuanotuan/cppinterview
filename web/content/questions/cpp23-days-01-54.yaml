        lambda. Chương trình dùng tham số self tường minh để tính giai thừa nhỏ bằng đệ quy. Cuối
        cùng, nó in hoặc kiểm tra kết quả giai thừa mong đợi hoặc thông báo chưa hỗ trợ chính xác để
