        feature-test macro có thể chọn nhánh mã thư viện hiện tại chưa hỗ trợ.


        Nên dùng khi trường nhị phân format cố định nhỏ, ownership ở bên gọi và lỗi là tình huống dự
        kiến. Tránh dùng khi giao thức phức tạp chưa có thiết kế rõ về biên, version và validation.


        Tách quy tắc chuẩn khỏi mức hỗ trợ thực tế. Làm rõ lifetime, ownership và kiểu suy luận. Ưu
