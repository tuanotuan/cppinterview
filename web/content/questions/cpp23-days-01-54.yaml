    answer:
      short: Thuật toán dựa trên hàng xóm cần cửa sổ chồng nhau. adjacent<N C++23 tạo tuple gồm N phần tử
        liên tiếp, adjacenttransform<N tính từ mỗi tuple, còn pairwise đặt tên trường hợp N = 2.
      detailed: >-
        Thuật toán dựa trên hàng xóm cần cửa sổ chồng nhau. adjacent<N C++23 tạo tuple gồm N phần tử
        liên tiếp, adjacenttransform<N tính từ mỗi tuple, còn pairwise đặt tên trường hợp N = 2.


        Di chuyển cửa sổ mỗi lần một phần tử. Khác chunk, các cửa sổ liên tiếp chồng nhau nên một
        phần tử nguồn có thể góp vào nhiều output. Hãy xác định giá trị đang được biến đổi rồi kiểm
