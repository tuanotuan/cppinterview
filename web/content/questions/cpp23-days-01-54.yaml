    answer:
      short: Vừa viết qualifier const phía sau vừa dùng explicit object parameter là không hợp lệ vì kiểu
        đối tượng đã nằm trong tham số đó. Không kiểm tra feature-test macro có thể chọn nhánh mã
        thư viện hiện tại chưa hỗ trợ.
      detailed: >-
        Vừa viết qualifier const phía sau vừa dùng explicit object parameter là không hợp lệ vì kiểu
        đối tượng đã nằm trong tham số đó. Không kiểm tra feature-test macro có thể chọn nhánh mã
        thư viện hiện tại chưa hỗ trợ.


        Nên dùng khi thư viện cần suy luận dạng cv/ref của đối tượng hoặc dùng chung một triển khai.
        Tránh dùng khi member thông thường không cần suy luận và rõ hơn với cú pháp truyền thống.


