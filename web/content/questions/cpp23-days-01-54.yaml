  - id: cpp23-range-for-lifetime-extension-001
    lessonId: cpp23-range-for-lifetime-extension
    type: recall
    responseMode: text
    difficulty: beginner
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: Cú pháp ngắn nhất ở Phần 4 là gì và nhiệm vụ chính của nó là gì?
    hint: Đối chiếu vấn đề ban đầu với cú pháp tối thiểu và ý tưởng cốt lõi của bài.
    answer:
      short: Biểu thức range có thể chứa temporary lồng nhau. C++23 kéo dài lifetime của temporary tạo
        trong for-range-initializer đến hết vòng lặp, ngăn các mẫu tham chiếu treo quan trọng.
      detailed: >-
        Biểu thức range có thể chứa temporary lồng nhau. C++23 kéo dài lifetime của temporary tạo
        trong for-range-initializer đến hết vòng lặp, ngăn các mẫu tham chiếu treo quan trọng.


        Vòng lặp ngầm giữ biểu thức range đã đánh giá trong một biến ẩn. C++23 còn bảo vệ các
        temporary hỗ trợ trong initializer, trừ ngoại lệ lifetime tham số thông thường. Hãy xác định
        giá trị đang được biến đổi rồi kiểm tra kiểu, lifetime hoặc quyền sở hữu kết quả. Bật C++23
        chưa chắc thư viện đã triển khai đủ, vì vậy cần kiểm tra feature-test macro liên quan.
    rubric:
      required:
        - Nêu đúng mục đích của tính năng.
        - Giải thích đúng cơ chế hoặc contract C++23 liên quan.
        - Không nhầm quy tắc chuẩn với hành vi riêng của compiler.
      bonus:
        - Liên hệ được quy tắc với kiểu, lifetime, ownership hoặc tính portable.
      misconceptions:
        - Chỉ nhắc lại tên tính năng mà không giải thích ràng buộc.
