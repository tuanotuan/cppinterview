    estimatedMinutes: 2
    prompt: Cú pháp ngắn nhất ở Phần 4 là gì và nhiệm vụ chính của nó là gì?
    hint: Đối chiếu vấn đề ban đầu với cú pháp tối thiểu và ý tưởng cốt lõi của bài.
    answer:
      short: std::function yêu cầu target được lưu phải copy được. C++23 thêm std::moveonlyfunction để
        callback type-erased có thể sở hữu trạng thái move-only như std::uniqueptr.
      detailed: >-
        std::function yêu cầu target được lưu phải copy được. C++23 thêm std::moveonlyfunction để
        callback type-erased có thể sở hữu trạng thái move-only như std::uniqueptr.


        Đây là hộp callable có thể move nhưng không copy. Chữ ký trong dấu ngoặc nhọn quy định bên
        gọi được phép gọi target bên trong như thế nào. Hãy xác định giá trị đang được biến đổi rồi
        kiểm tra kiểu, lifetime hoặc quyền sở hữu kết quả. Bật C++23 chưa chắc thư viện đã triển
        khai đủ, vì vậy cần kiểm tra feature-test macro liên quan.
    rubric:
