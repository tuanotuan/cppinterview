    type: recall
    responseMode: text
    difficulty: beginner
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: Chủ đề hôm nay giải quyết vấn đề gì, và token hoặc khai báo nào trong cú pháp tối thiểu kích
      hoạt nó?
    hint: Đối chiếu phần Vấn đề nó giải quyết với Cú pháp tối thiểu; nêu đúng token hoặc khai báo tạo ra
      hành vi.
    answer:
      short: "Alias template tạo tên kiểu dễ đọc từ tham số; type trait cung cấp sự thật và phép biến đổi
        kiểu tại compile time. Nó làm ràng buộc quan trọng hiện rõ thay vì bắt người đọc đoán. Bài
        chỉ giữ phần cốt lõi C++11 vừa đủ cho một ngày tập trung. Cú pháp tối thiểu liên quan là:
        template<class T> using Vec = std::vector<T>; std::is_integral<T>::value;"
      detailed: "Mental model: Alias template tạo tên kiểu dễ đọc từ tham số; type trait cung cấp sự thật
        và phép biến đổi kiểu tại compile time. Hãy xác định giá trị hoặc trạng thái liên quan, ai
        sở hữu nó và quy tắc tác động lúc compile hay lúc chạy. Trong bài, ràng buộc đó được biểu
        đạt trực tiếp bằng cú pháp: template<class T> using Vec = std::vector<T>;
        std::is_integral<T>::value;"
    rubric:
      required:
