        Vì chương trình không nhận input, kết quả phải được suy ra trực tiếp từ từng câu lệnh và
        contract C++11: Kiểu sở hữu một số nguyên thực hiện deep copy khi dựng và gán, chứng minh
        hai đối tượng giữ hai vùng cấp phát độc lập. File `.cpp` dùng dữ liệu cố định và không thêm
        abstraction ngoài chủ đề."
