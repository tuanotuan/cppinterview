  - id: cpp11-copy-constructor-002
    lessonId: cpp11-copy-constructor
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Đọc ví dụ nhỏ ở trên. Chương trình sẽ in giá trị hoặc trạng thái nào, và quy tắc nào tạo ra
      kết quả đó?
    code: "#include <iostream>\r

      \r

      class Box {\r

      public:\r

      \    explicit Box(int value) : value_(value) {}\r

      \r

      \    Box(const Box& other) : value_(other.value_) {\r

      \        std::cout << \"copied\\n\";\r

      \    }\r

      \r

      \    void set(int value) {\r

      \        value_ = value;\r

      \    }\r

      \r

      \    int get() const {\r

      \        return value_;\r

      \    }\r

      \r

      private:\r

      \    int value_;\r

      };\r

      \r

      int main() {\r

      \    Box original(7);\r

      \    Box copy(original);\r

      \    copy.set(9);\r

      \    std::cout << \"original=\" << original.get() << \" copy=\" << copy.get() << '\\n';\r

      }"
    hint: Theo dõi dữ liệu cố định trong mã mẫu theo thứ tự thực thi rồi đối chiếu với quy tắc ở phần
      Cách nó hoạt động.
    answer:
      short: "Ví dụ tạo trạng thái cố định được mô tả trong bài: Sao chép `Box` nhỏ gọi copy constructor;
        sửa bản sao cho thấy đối tượng gốc vẫn độc lập. File `.cpp` dùng dữ liệu cố định và không
        thêm abstraction ngoài chủ đề."
      detailed: "Ví dụ tạo dữ liệu nhỏ, cố định và không cần nhập bàn phím. C++11 hoặc contract thư viện
        chuẩn áp dụng quy tắc hôm nay. Chương trình in kết quả quan trọng để đối chiếu với mã nguồn.
        Vì chương trình không nhận input, kết quả phải được suy ra trực tiếp từ từng câu lệnh và
        contract C++11: Sao chép `Box` nhỏ gọi copy constructor; sửa bản sao cho thấy đối tượng gốc
        vẫn độc lập. File `.cpp` dùng dữ liệu cố định và không thêm abstraction ngoài chủ đề."
    rubric:
      required:
        - Nêu đúng giá trị hoặc trạng thái quan sát được của chương trình.
        - Liên hệ từng kết quả với câu lệnh và quy tắc C++11 tạo ra nó.
        - Không suy đoán thêm input hoặc trạng thái ngoài mã mẫu.
      bonus:
        - Nêu hệ quả về kiểu, lifetime, ownership hoặc thứ tự nếu có.
      misconceptions:
        - Đoán output mà không lần theo dữ liệu và quy tắc trong mã.
