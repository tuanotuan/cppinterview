  - id: cpp11-exception-safety-noexcept-002
    lessonId: cpp11-exception-safety-noexcept
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Đọc ví dụ nhỏ ở trên. Chương trình sẽ in giá trị hoặc trạng thái nào, và quy tắc nào tạo ra
      kết quả đó?
    code: "#include <iostream>\r

      #include <stdexcept>\r

      \r

      double divide(double numerator, double denominator) {\r

      \    if (denominator == 0.0) {\r

      \        throw std::invalid_argument(\"zero denominator\");\r

      \    }\r

      \    return numerator / denominator;\r

      }\r

      \r

      void cleanup() noexcept {\r

      \    std::cout << \"cleanup\\n\";\r

      }\r

      \r

      int main() {\r

      \    try {\r

      \        std::cout << divide(8.0, 2.0) << '\\n';\r

      \        std::cout << divide(1.0, 0.0) << '\\n';\r

      \    } catch (const std::exception& error) {\r

      \        std::cout << \"caught=\" << error.what() << '\\n';\r

      \    }\r

      \    cleanup();\r

      }"
    hint: Theo dõi dữ liệu cố định trong mã mẫu theo thứ tự thực thi rồi đối chiếu với quy tắc ở phần
      Cách nó hoạt động.
    answer:
      short: "Ví dụ tạo trạng thái cố định được mô tả trong bài: Phép chia có kiểm tra ném lỗi khi mẫu
        bằng 0, caller bắt lỗi và hàm cleanup nhỏ minh họa thao tác thật sự không ném. File `.cpp`
        dùng dữ liệu cố định và không thêm abstraction ngoài chủ đề."
      detailed: "Ví dụ tạo dữ liệu nhỏ, cố định và không cần nhập bàn phím. C++11 hoặc contract thư viện
        chuẩn áp dụng quy tắc hôm nay. Chương trình in kết quả quan trọng để đối chiếu với mã nguồn.
        Vì chương trình không nhận input, kết quả phải được suy ra trực tiếp từ từng câu lệnh và
        contract C++11: Phép chia có kiểm tra ném lỗi khi mẫu bằng 0, caller bắt lỗi và hàm cleanup
        nhỏ minh họa thao tác thật sự không ném. File `.cpp` dùng dữ liệu cố định và không thêm
        abstraction ngoài chủ đề."
    rubric:
      required:
        - Nêu đúng giá trị hoặc trạng thái quan sát được của chương trình.
        - Liên hệ từng kết quả với câu lệnh và quy tắc C++11 tạo ra nó.
        - Không suy đoán thêm input hoặc trạng thái ngoài mã mẫu.
      bonus:
        - Nêu hệ quả về kiểu, lifetime, ownership hoặc thứ tự nếu có.
      misconceptions:
        - Đoán output mà không lần theo dữ liệu và quy tắc trong mã.
    sources:
      - sectionId: cach-no-hoat-dong
      - sectionId: vi-du-don-gian
    sourceHash: 765096a9e9aa2759d4f8266febba1400c799e5ffa7529ea3d94c75a74ebded17
    status: draft
    version: 1
