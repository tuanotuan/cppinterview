  - id: cpp11-atomic-compare-and-swap-002
    lessonId: cpp11-atomic-compare-and-swap
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Đọc ví dụ nhỏ ở trên. Chương trình sẽ in giá trị hoặc trạng thái nào, và quy tắc nào tạo ra
      kết quả đó?
    code: "#include <atomic>\r

      #include <iostream>\r

      \r

      int main() {\r

      \    std::atomic<int> value(5);\r

      \r

      \    int expected = 5;\r

      \    const bool changed = value.compare_exchange_strong(expected, 9);\r

      \    const int before_add = value.fetch_add(3);\r

      \r

      \    std::cout << std::boolalpha;\r

      \    std::cout << \"changed=\" << changed << '\\n';\r

      \    std::cout << \"before_add=\" << before_add << '\\n';\r

      \    std::cout << \"after_add=\" << value.load() << '\\n';\r

      }"
    hint: Theo dõi dữ liệu cố định trong mã mẫu theo thứ tự thực thi rồi đối chiếu với quy tắc ở phần
      Cách nó hoạt động.
