  - id: cpp11-cache-locality-data-oriented-design-002
    lessonId: cpp11-cache-locality-data-oriented-design
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Đọc ví dụ nhỏ ở trên. Chương trình sẽ in giá trị hoặc trạng thái nào, và quy tắc nào tạo ra
      kết quả đó?
    code: "#include <cstddef>\r

      #include <iostream>\r

      #include <vector>\r

      \r

      int main() {\r

      \    // Structure of arrays: the hot loop touches contiguous fields only.\r

      \    std::vector<double> x{0.0, 10.0, 20.0};\r

      \    std::vector<double> y{1.0, 11.0, 21.0};\r

      \    std::vector<double> velocity_x{2.0, 2.0, 2.0};\r

      \    std::vector<double> velocity_y{3.0, 3.0, 3.0};\r

      \r

      \    double checksum = 0.0;\r

      \    for (std::size_t i = 0; i < x.size(); ++i) {\r

      \        x[i] += velocity_x[i];\r

      \        y[i] += velocity_y[i];\r

      \        checksum += x[i] + y[i];\r

      \    }\r

      \r

      \    std::cout << \"checksum=\" << checksum << '\\n';\r

