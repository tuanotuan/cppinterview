  - id: cpp11-literals-raw-strings-unicode-attributes-alignment-thread-local-003
    lessonId: cpp11-literals-raw-strings-unicode-attributes-alignment-thread-local
    type: pitfall
    responseMode: text
    difficulty: advanced
