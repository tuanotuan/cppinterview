    estimatedMinutes: 2
    prompt: Chủ đề hôm nay giải quyết vấn đề gì, và token hoặc khai báo nào trong cú pháp tối thiểu kích
      hoạt nó?
    hint: Đối chiếu phần Vấn đề nó giải quyết với Cú pháp tối thiểu; nêu đúng token hoặc khai báo tạo ra
      hành vi.
    answer:
      short: "Move construction tạo đối tượng mới bằng cách nhận tài nguyên; move assignment thay tài
        nguyên của đối tượng có sẵn bằng tài nguyên từ đối tượng khác. Nó làm ràng buộc quan trọng
        hiện rõ thay vì bắt người đọc đoán. Bài chỉ giữ phần cốt lõi C++11 vừa đủ cho một ngày tập
        trung. Cú pháp tối thiểu liên quan là: Owner(Owner&& other); Owner& operator=(Owner&&
        other);"
      detailed: "Mental model: Move construction tạo đối tượng mới bằng cách nhận tài nguyên; move
        assignment thay tài nguyên của đối tượng có sẵn bằng tài nguyên từ đối tượng khác. Hãy xác
        định giá trị hoặc trạng thái liên quan, ai sở hữu nó và quy tắc tác động lúc compile hay lúc
        chạy. Trong bài, ràng buộc đó được biểu đạt trực tiếp bằng cú pháp: Owner(Owner&& other);
        Owner& operator=(Owner&& other);"
    rubric:
      required:
        - Nêu đúng vấn đề mà chủ đề giải quyết.
        - Chỉ ra token hoặc khai báo C++11 liên quan trong cú pháp tối thiểu.
