  - id: cpp11-copy-constructor-003
    lessonId: cpp11-copy-constructor
    type: pitfall
    responseMode: text
    difficulty: advanced
    interviewCategory: code_review_debug
    interviewFormat: bug_hunt
    estimatedMinutes: 5
    prompt: "Tìm và giải thích lỗi tinh tế trong tình huống sau: Shallow copy một raw pointer sở hữu
      khiến hai đối tượng cùng xóa một vùng nhớ, dẫn tới undefined behavior. Cách sửa nhỏ nhất nhưng
      an toàn trong C++11 là gì?"
    hint: Xác định lifetime, ownership, kiểu hoặc thứ tự bị vi phạm trước khi đề xuất thay đổi nhỏ nhất.
    answer:
      short: "Lỗi nằm ở việc vi phạm contract an toàn của chủ đề: Shallow copy một raw pointer sở hữu
        khiến hai đối tượng cùng xóa một vùng nhớ, dẫn tới undefined behavior. Bản sửa tối thiểu
        phải loại bỏ trạng thái hoặc đường truy cập không hợp lệ đó."
      detailed: "Mental model: Copy constructor tạo đối tượng mới từ đối tượng đã có và quyết định trạng
        thái sở hữu được sao chép an toàn như thế nào. Hãy xác định giá trị hoặc trạng thái liên
        quan, ai sở hữu nó và quy tắc tác động lúc compile hay lúc chạy. Tình huống lỗi là: Shallow
        copy một raw pointer sở hữu khiến hai đối tượng cùng xóa một vùng nhớ, dẫn tới undefined
        behavior. Cách sửa an toàn phải làm ràng buộc này hiện rõ bằng cơ chế C++11 của bài, đồng
        thời giữ đúng hướng dẫn sử dụng: Nên dùng khi kiểu sở hữu trạng thái cần quy tắc nhân bản rõ
        ràng. Tránh dùng khi nó che ownership, lifetime, kiểu, thứ tự hoặc chi phí."
    rubric:
      required:
        - Chỉ ra chính xác quy tắc C++11 hoặc invariant bị vi phạm.
        - Giải thích hậu quả như undefined behavior, lỗi compile hoặc sai trạng thái.
        - Đề xuất thay đổi nhỏ nhất loại bỏ nguyên nhân thay vì chỉ che triệu chứng.
      bonus:
        - Liên hệ bản sửa với lifetime, ownership, kiểu hoặc ordering.
      misconceptions:
        - Cho rằng chương trình an toàn chỉ vì có thể compile hoặc chạy một lần.
