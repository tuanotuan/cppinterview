        đoán. Bài chỉ giữ phần cốt lõi C++11 vừa đủ cho một ngày tập trung. Cú pháp tối thiểu liên
        quan là: Box(const Box& other) : value_(other.value_) {}"
      detailed: "Mental model: Copy constructor tạo đối tượng mới từ đối tượng đã có và quyết định trạng
        thái sở hữu được sao chép an toàn như thế nào. Hãy xác định giá trị hoặc trạng thái liên
        quan, ai sở hữu nó và quy tắc tác động lúc compile hay lúc chạy. Trong bài, ràng buộc đó
        được biểu đạt trực tiếp bằng cú pháp: Box(const Box& other) : value_(other.value_) {}"
    rubric:
      required:
        - Nêu đúng vấn đề mà chủ đề giải quyết.
        - Chỉ ra token hoặc khai báo C++11 liên quan trong cú pháp tối thiểu.
        - Giải thích ràng buộc mà cú pháp đó làm rõ.
      bonus:
        - Phân biệt tác động lúc compile với tác động lúc chạy.
      misconceptions:
        - Chỉ nhắc tên tính năng mà không giải thích vấn đề hoặc cú pháp.
