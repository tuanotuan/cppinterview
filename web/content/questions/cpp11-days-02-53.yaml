        profiling tìm nơi toàn chương trình tốn thời gian hoặc bộ nhớ. Nó làm ràng buộc quan trọng
        hiện rõ thay vì bắt người đọc đoán. Bài chỉ giữ phần cốt lõi C++11 vừa đủ cho một ngày tập
        trung. Cú pháp tối thiểu liên quan là: void* allocate(std::size_t n); auto start =
        std::chrono::steady_clock::now();"
      detailed: "Mental model: Memory pool phục vụ cấp phát lặp từ vùng nhớ chuẩn bị trước; benchmark đo
