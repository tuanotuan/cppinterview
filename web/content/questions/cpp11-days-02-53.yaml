    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: Chủ đề hôm nay giải quyết vấn đề gì, và token hoặc khai báo nào trong cú pháp tối thiểu kích
      hoạt nó?
    hint: Đối chiếu phần Vấn đề nó giải quyết với Cú pháp tối thiểu; nêu đúng token hoặc khai báo tạo ra
      hành vi.
    answer:
      short: "Type alias rút gọn tên kiểu có ý nghĩa, `enum class` giới hạn phạm vi tên enum, còn nested
        template biểu diễn container lồng nhau rõ ràng. Nó làm ràng buộc quan trọng hiện rõ thay vì
        bắt người đọc đoán. Bài chỉ giữ phần cốt lõi C++11 vừa đủ cho một ngày tập trung. Cú pháp
        tối thiểu liên quan là: using Scores = std::vector<int>; enum class State { ready, busy };"
      detailed: "Mental model: Type alias rút gọn tên kiểu có ý nghĩa, `enum class` giới hạn phạm vi tên
        enum, còn nested template biểu diễn container lồng nhau rõ ràng. Hãy xác định giá trị hoặc
        trạng thái liên quan, ai sở hữu nó và quy tắc tác động lúc compile hay lúc chạy. Trong bài,
        ràng buộc đó được biểu đạt trực tiếp bằng cú pháp: using Scores = std::vector<int>; enum
        class State { ready, busy };"
    rubric:
      required:
