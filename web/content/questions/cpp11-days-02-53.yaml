  - id: cpp11-std-thread-lifetime-003
    lessonId: cpp11-std-thread-lifetime
    type: pitfall
    responseMode: text
    difficulty: advanced
    interviewCategory: code_review_debug
    interviewFormat: bug_hunt
    estimatedMinutes: 5
    prompt: "Tìm và giải thích lỗi tinh tế trong tình huống sau: Hủy `std::thread` còn joinable sẽ gọi
      `std::terminate`; detach thiếu cẩn thận còn có thể làm công việc sống lâu hơn dữ liệu tham
      chiếu. Cách sửa nhỏ nhất nhưng an toàn trong C++11 là gì?"
    hint: Xác định lifetime, ownership, kiểu hoặc thứ tự bị vi phạm trước khi đề xuất thay đổi nhỏ nhất.
    answer:
      short: "Lỗi nằm ở việc vi phạm contract an toàn của chủ đề: Hủy `std::thread` còn joinable sẽ gọi
        `std::terminate`; detach thiếu cẩn thận còn có thể làm công việc sống lâu hơn dữ liệu tham
        chiếu. Bản sửa tối thiểu phải loại bỏ trạng thái hoặc đường truy cập không hợp lệ đó."
      detailed: "Mental model: `std::thread` bắt đầu thực thi đồng thời; object thread phải được join hoặc
        detach trước khi hủy; join còn đồng bộ việc hoàn tất. Hãy xác định giá trị hoặc trạng thái
        liên quan, ai sở hữu nó và quy tắc tác động lúc compile hay lúc chạy. Tình huống lỗi là: Hủy
        `std::thread` còn joinable sẽ gọi `std::terminate`; detach thiếu cẩn thận còn có thể làm
        công việc sống lâu hơn dữ liệu tham chiếu. Cách sửa an toàn phải làm ràng buộc này hiện rõ
        bằng cơ chế C++11 của bài, đồng thời giữ đúng hướng dẫn sử dụng: Nên dùng khi công việc độc
        lập nên chạy đồng thời và lifetime có thể đồng bộ. Tránh dùng khi nó che ownership,
        lifetime, kiểu, thứ tự hoặc chi phí."
    rubric:
      required:
        - Chỉ ra chính xác quy tắc C++11 hoặc invariant bị vi phạm.
        - Giải thích hậu quả như undefined behavior, lỗi compile hoặc sai trạng thái.
        - Đề xuất thay đổi nhỏ nhất loại bỏ nguyên nhân thay vì chỉ che triệu chứng.
      bonus:
        - Liên hệ bản sửa với lifetime, ownership, kiểu hoặc ordering.
      misconceptions:
        - Cho rằng chương trình an toàn chỉ vì có thể compile hoặc chạy một lần.
    sources:
      - sectionId: loi-thuong-gap
      - sectionId: khi-nao-nen-dung
    sourceHash: eb6cf4e9e82f095d76bcd0641a11b7ea6fad6f4a7f71a42cc3812faea2aa904f
    status: draft
    version: 1
  - id: cpp11-mutex-locks-condition-variable-001
    lessonId: cpp11-mutex-locks-condition-variable
    type: recall
    responseMode: text
    difficulty: beginner
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: Chủ đề hôm nay giải quyết vấn đề gì, và token hoặc khai báo nào trong cú pháp tối thiểu kích
      hoạt nó?
    hint: Đối chiếu phần Vấn đề nó giải quyết với Cú pháp tối thiểu; nêu đúng token hoặc khai báo tạo ra
      hành vi.
    answer:
      short: "Mutex bảo vệ invariant dùng chung, lock RAII tự nhả an toàn, còn condition variable cho
        thread ngủ tới khi trạng thái được bảo vệ có thể thỏa predicate. Nó làm ràng buộc quan trọng
        hiện rõ thay vì bắt người đọc đoán. Bài chỉ giữ phần cốt lõi C++11 vừa đủ cho một ngày tập
        trung. Cú pháp tối thiểu liên quan là: std::unique_lock<std::mutex> lock(m); cv.wait(lock,
        predicate);"
      detailed: "Mental model: Mutex bảo vệ invariant dùng chung, lock RAII tự nhả an toàn, còn condition
        variable cho thread ngủ tới khi trạng thái được bảo vệ có thể thỏa predicate. Hãy xác định
        giá trị hoặc trạng thái liên quan, ai sở hữu nó và quy tắc tác động lúc compile hay lúc
        chạy. Trong bài, ràng buộc đó được biểu đạt trực tiếp bằng cú pháp:
        std::unique_lock<std::mutex> lock(m); cv.wait(lock, predicate);"
    rubric:
      required:
        - Nêu đúng vấn đề mà chủ đề giải quyết.
        - Chỉ ra token hoặc khai báo C++11 liên quan trong cú pháp tối thiểu.
        - Giải thích ràng buộc mà cú pháp đó làm rõ.
      bonus:
        - Phân biệt tác động lúc compile với tác động lúc chạy.
      misconceptions:
        - Chỉ nhắc tên tính năng mà không giải thích vấn đề hoặc cú pháp.
    sources:
