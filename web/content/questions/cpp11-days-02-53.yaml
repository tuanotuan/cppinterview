  - id: cpp11-alias-templates-type-traits-002
    lessonId: cpp11-alias-templates-type-traits
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Đọc ví dụ nhỏ ở trên. Chương trình sẽ in giá trị hoặc trạng thái nào, và quy tắc nào tạo ra
      kết quả đó?
    code: "#include <iostream>\r

      #include <type_traits>\r

      #include <vector>\r

      \r

      template <typename T>\r

      using Vec = std::vector<T>;\r

      \r

      int main() {\r

      \    Vec<int> values{1, 2, 3};\r

      \r

      \    std::cout << std::boolalpha;\r

      \    std::cout << \"int_integral=\" << std::is_integral<int>::value << '\\n';\r

      \    std::cout << \"double_integral=\" << std::is_integral<double>::value << '\\n';\r

      \    std::cout << \"is_reference=\" << std::is_reference<int&>::value << '\\n';\r

      \    std::cout << \"size=\" << values.size() << '\\n';\r

      }"
    hint: Theo dõi dữ liệu cố định trong mã mẫu theo thứ tự thực thi rồi đối chiếu với quy tắc ở phần
      Cách nó hoạt động.
    answer:
      short: "Ví dụ tạo trạng thái cố định được mô tả trong bài: Alias vector tạo dãy số nguyên, còn trait
        báo các kiểu được chọn có phải integral hoặc reference hay không. File `.cpp` dùng dữ liệu
        cố định và không thêm abstraction ngoài chủ đề."
      detailed: "Ví dụ tạo dữ liệu nhỏ, cố định và không cần nhập bàn phím. C++11 hoặc contract thư viện
        chuẩn áp dụng quy tắc hôm nay. Chương trình in kết quả quan trọng để đối chiếu với mã nguồn.
        Vì chương trình không nhận input, kết quả phải được suy ra trực tiếp từ từng câu lệnh và
        contract C++11: Alias vector tạo dãy số nguyên, còn trait báo các kiểu được chọn có phải
        integral hoặc reference hay không. File `.cpp` dùng dữ liệu cố định và không thêm
        abstraction ngoài chủ đề."
    rubric:
      required:
        - Nêu đúng giá trị hoặc trạng thái quan sát được của chương trình.
        - Liên hệ từng kết quả với câu lệnh và quy tắc C++11 tạo ra nó.
        - Không suy đoán thêm input hoặc trạng thái ngoài mã mẫu.
      bonus:
        - Nêu hệ quả về kiểu, lifetime, ownership hoặc thứ tự nếu có.
      misconceptions:
        - Đoán output mà không lần theo dữ liệu và quy tắc trong mã.
    sources:
      - sectionId: cach-no-hoat-dong
      - sectionId: vi-du-don-gian
    sourceHash: 3a5682112ac0b12fa93250ddb93e117a31cb8c27cfe65d9fd9b41a18097e32e1
    status: draft
    version: 1
