    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Đọc ví dụ nhỏ ở trên. Chương trình sẽ in giá trị hoặc trạng thái nào, và quy tắc nào tạo ra
      kết quả đó?
    code: "#include <iostream>\r

      #include <type_traits>\r

      \r

      template <typename T>\r

      typename std::enable_if<std::is_integral<T>::value, const char*>::type\r

      kind(T) {\r

      \    return \"integral\";\r

      }\r

      \r

      template <typename T>\r

      typename std::enable_if<!std::is_integral<T>::value, const char*>::type\r

      kind(T) {\r

      \    return \"non-integral\";\r

      }\r

      \r

      int main() {\r

      \    std::cout << kind(42) << '\\n';\r

      \    std::cout << kind(3.5) << '\\n';\r

      }"
    hint: Theo dõi dữ liệu cố định trong mã mẫu theo thứ tự thực thi rồi đối chiếu với quy tắc ở phần
      Cách nó hoạt động.
    answer:
      short: "Ví dụ tạo trạng thái cố định được mô tả trong bài: Hai overload `kind` dùng `enable_if` để
        số nguyên in `integral` và số thực in `non-integral`. File `.cpp` dùng dữ liệu cố định và
        không thêm abstraction ngoài chủ đề."
      detailed: "Ví dụ tạo dữ liệu nhỏ, cố định và không cần nhập bàn phím. C++11 hoặc contract thư viện
        chuẩn áp dụng quy tắc hôm nay. Chương trình in kết quả quan trọng để đối chiếu với mã nguồn.
        Vì chương trình không nhận input, kết quả phải được suy ra trực tiếp từ từng câu lệnh và
        contract C++11: Hai overload `kind` dùng `enable_if` để số nguyên in `integral` và số thực
        in `non-integral`. File `.cpp` dùng dữ liệu cố định và không thêm abstraction ngoài chủ đề."
    rubric:
      required:
