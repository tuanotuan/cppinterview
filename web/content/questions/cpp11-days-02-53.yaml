      \    ~Derived() override {\r

      \        std::cout << \"Derived destroyed\\n\";\r

      \    }\r

      \r

      \    const char* name() const override {\r

      \        return \"Derived\";\r

      \    }\r

      };\r

      \r

      int main() {\r

      \    Base* object = new Derived;\r

      \    std::cout << object->name() << '\\n';\r

      \    delete object; // safe because Base has a virtual destructor\r

      }"
