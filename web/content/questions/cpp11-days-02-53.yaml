        substitution context sẽ biến SFINAE thành lỗi biên dịch cứng. Bản sửa tối thiểu phải loại bỏ
        trạng thái hoặc đường truy cập không hợp lệ đó."
      detailed: "Mental model: SFINAE loại candidate template khi phép thế làm kiểu trực tiếp không hợp
        lệ; `enable_if` dùng quy tắc đó để bật overload theo điều kiện. Hãy xác định giá trị hoặc
        trạng thái liên quan, ai sở hữu nó và quy tắc tác động lúc compile hay lúc chạy. Tình huống
        lỗi là: Đặt biểu thức lỗi ngoài immediate substitution context sẽ biến SFINAE thành lỗi biên
        dịch cứng. Cách sửa an toàn phải làm ràng buộc này hiện rõ bằng cơ chế C++11 của bài, đồng
        thời giữ đúng hướng dẫn sử dụng: Nên dùng khi overload generic C++11 chỉ được tham gia với
        nhóm kiểu hỗ trợ. Tránh dùng khi nó che ownership, lifetime, kiểu, thứ tự hoặc chi phí."
    rubric:
      required:
