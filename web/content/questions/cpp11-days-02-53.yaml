    type: recall
    responseMode: text
    difficulty: beginner
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: Chủ đề hôm nay giải quyết vấn đề gì, và token hoặc khai báo nào trong cú pháp tối thiểu kích
      hoạt nó?
    hint: Đối chiếu phần Vấn đề nó giải quyết với Cú pháp tối thiểu; nêu đúng token hoặc khai báo tạo ra
      hành vi.
    answer:
      short: "Class gom trạng thái với thao tác; constructor tạo trạng thái ban đầu hợp lệ; member
        initializer list dựng member trực tiếp. Nó làm ràng buộc quan trọng hiện rõ thay vì bắt
        người đọc đoán. Bài chỉ giữ phần cốt lõi C++11 vừa đủ cho một ngày tập trung. Cú pháp tối
        thiểu liên quan là: class Counter { int value_; public: Counter(int v) : value_(v) {} };"
      detailed: "Mental model: Class gom trạng thái với thao tác; constructor tạo trạng thái ban đầu hợp
        lệ; member initializer list dựng member trực tiếp. Hãy xác định giá trị hoặc trạng thái liên
        quan, ai sở hữu nó và quy tắc tác động lúc compile hay lúc chạy. Trong bài, ràng buộc đó
        được biểu đạt trực tiếp bằng cú pháp: class Counter { int value_; public: Counter(int v) :
        value_(v) {} };"
    rubric:
      required:
        - Nêu đúng vấn đề mà chủ đề giải quyết.
        - Chỉ ra token hoặc khai báo C++11 liên quan trong cú pháp tối thiểu.
        - Giải thích ràng buộc mà cú pháp đó làm rõ.
      bonus:
        - Phân biệt tác động lúc compile với tác động lúc chạy.
      misconceptions:
        - Chỉ nhắc tên tính năng mà không giải thích vấn đề hoặc cú pháp.
