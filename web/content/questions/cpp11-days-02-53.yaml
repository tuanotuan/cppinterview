        Token() = default; Token(const Token&) = delete;"
      detailed: "Mental model: `= default` yêu cầu implementation chuẩn của compiler; `= delete` giữ thao
        tác trong chẩn đoán nhưng cấm sử dụng. Hãy xác định giá trị hoặc trạng thái liên quan, ai sở
        hữu nó và quy tắc tác động lúc compile hay lúc chạy. Trong bài, ràng buộc đó được biểu đạt
        trực tiếp bằng cú pháp: Token() = default; Token(const Token&) = delete;"
