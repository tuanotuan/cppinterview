        chuẩn áp dụng quy tắc hôm nay. Chương trình in kết quả quan trọng để đối chiếu với mã nguồn.
        Vì chương trình không nhận input, kết quả phải được suy ra trực tiếp từ từng câu lệnh và
        contract C++11: Ring bốn ô công bố ba số nguyên từ một producer; một consumer pop theo FIFO
        bằng index acquire/release. File `.cpp` dùng dữ liệu cố định và không thêm abstraction ngoài
        chủ đề."
