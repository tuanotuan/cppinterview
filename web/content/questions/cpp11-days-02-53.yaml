        liệu. Bản sửa tối thiểu phải loại bỏ trạng thái hoặc đường truy cập không hợp lệ đó."
      detailed: "Mental model: Data race là truy cập đồng thời thiếu đồng bộ, deadlock là chờ vòng tròn,
        còn false sharing là tranh chấp cache line giữa các phép ghi độc lập về logic. Hãy xác định
        giá trị hoặc trạng thái liên quan, ai sở hữu nó và quy tắc tác động lúc compile hay lúc
