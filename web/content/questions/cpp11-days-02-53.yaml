        trạng thái liên quan, ai sở hữu nó và quy tắc tác động lúc compile hay lúc chạy. Trong bài,
        ràng buộc đó được biểu đạt trực tiếp bằng cú pháp: std::array<int, 3> a{{1,2,3}}; for (int x
        : a) { }"
    rubric:
      required:
