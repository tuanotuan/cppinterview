      vẫn còn false sharing; thứ tự khóa mutex không nhất quán có thể deadlock thao tác đúng về dữ
      liệu. Cách sửa nhỏ nhất nhưng an toàn trong C++11 là gì?"
    hint: Xác định lifetime, ownership, kiểu hoặc thứ tự bị vi phạm trước khi đề xuất thay đổi nhỏ nhất.
