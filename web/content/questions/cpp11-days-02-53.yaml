  - id: cpp11-move-constructor-move-assignment-002
    lessonId: cpp11-move-constructor-move-assignment
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Đọc ví dụ nhỏ ở trên. Chương trình sẽ in giá trị hoặc trạng thái nào, và quy tắc nào tạo ra
      kết quả đó?
    code: "#include <iostream>\r

      #include <utility>\r

      \r

      class IntOwner {\r

      public:\r

      \    explicit IntOwner(int value) : data_(new int(value)) {}\r

      \    ~IntOwner() { delete data_; }\r

      \r

      \    IntOwner(IntOwner&& other) : data_(other.data_) {\r

      \        other.data_ = nullptr;\r

      \        std::cout << \"move-constructed\\n\";\r

      \    }\r

      \r

      \    IntOwner& operator=(IntOwner&& other) {\r

      \        if (this != &other) {\r

      \            delete data_;\r

      \            data_ = other.data_;\r

      \            other.data_ = nullptr;\r

      \        }\r

      \        std::cout << \"move-assigned\\n\";\r

      \        return *this;\r

      \    }\r

      \r

      \    int get() const { return data_ ? *data_ : -1; }\r

      \r

      private:\r

      \    IntOwner(const IntOwner&);\r

      \    IntOwner& operator=(const IntOwner&);\r

      \    int* data_;\r

      };\r

      \r

      int main() {\r

      \    IntOwner first(7);\r

      \    IntOwner second(std::move(first));\r

      \    IntOwner third(1);\r

      \    third = std::move(second);\r

      \    std::cout << \"first=\" << first.get() << \" third=\" << third.get() << '\\n';\r

      }"
    hint: Theo dõi dữ liệu cố định trong mã mẫu theo thứ tự thực thi rồi đối chiếu với quy tắc ở phần
      Cách nó hoạt động.
    answer:
      short: "Ví dụ tạo trạng thái cố định được mô tả trong bài: Một owner nhỏ chuyển một số nguyên động
        qua move construction rồi move assignment, để mỗi nguồn ở trạng thái rỗng an toàn. File
        `.cpp` dùng dữ liệu cố định và không thêm abstraction ngoài chủ đề."
      detailed: "Ví dụ tạo dữ liệu nhỏ, cố định và không cần nhập bàn phím. C++11 hoặc contract thư viện
        chuẩn áp dụng quy tắc hôm nay. Chương trình in kết quả quan trọng để đối chiếu với mã nguồn.
        Vì chương trình không nhận input, kết quả phải được suy ra trực tiếp từ từng câu lệnh và
        contract C++11: Một owner nhỏ chuyển một số nguyên động qua move construction rồi move
        assignment, để mỗi nguồn ở trạng thái rỗng an toàn. File `.cpp` dùng dữ liệu cố định và
        không thêm abstraction ngoài chủ đề."
    rubric:
      required:
        - Nêu đúng giá trị hoặc trạng thái quan sát được của chương trình.
        - Liên hệ từng kết quả với câu lệnh và quy tắc C++11 tạo ra nó.
        - Không suy đoán thêm input hoặc trạng thái ngoài mã mẫu.
      bonus:
        - Nêu hệ quả về kiểu, lifetime, ownership hoặc thứ tự nếu có.
      misconceptions:
        - Đoán output mà không lần theo dữ liệu và quy tắc trong mã.
    sources:
      - sectionId: cach-no-hoat-dong
      - sectionId: vi-du-don-gian
    sourceHash: 4798ceee410d4398e897500243d3d12d952611bc4809d141de4beb548c79511a
    status: draft
    version: 1
