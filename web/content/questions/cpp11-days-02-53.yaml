  - id: cpp11-iterator-categories-invalidation-003
    lessonId: cpp11-iterator-categories-invalidation
    type: pitfall
    responseMode: text
    difficulty: advanced
    interviewCategory: code_review_debug
    interviewFormat: bug_hunt
    estimatedMinutes: 5
    prompt: "Tìm và giải thích lỗi tinh tế trong tình huống sau: Giải tham chiếu iterator đã invalidated
      gây undefined behavior dù địa chỉ cũ có vẻ vẫn chứa giá trị mong đợi. Cách sửa nhỏ nhất nhưng
      an toàn trong C++11 là gì?"
    hint: Xác định lifetime, ownership, kiểu hoặc thứ tự bị vi phạm trước khi đề xuất thay đổi nhỏ nhất.
    answer:
      short: "Lỗi nằm ở việc vi phạm contract an toàn của chủ đề: Giải tham chiếu iterator đã invalidated
        gây undefined behavior dù địa chỉ cũ có vẻ vẫn chứa giá trị mong đợi. Bản sửa tối thiểu phải
        loại bỏ trạng thái hoặc đường truy cập không hợp lệ đó."
      detailed: "Mental model: Iterator category mô tả cách di chuyển và truy cập được hỗ trợ; quy tắc
        invalidation cho biết khi nào sửa container làm iterator cũ không còn dùng được. Hãy xác
        định giá trị hoặc trạng thái liên quan, ai sở hữu nó và quy tắc tác động lúc compile hay lúc
        chạy. Tình huống lỗi là: Giải tham chiếu iterator đã invalidated gây undefined behavior dù
        địa chỉ cũ có vẻ vẫn chứa giá trị mong đợi. Cách sửa an toàn phải làm ràng buộc này hiện rõ
        bằng cơ chế C++11 của bài, đồng thời giữ đúng hướng dẫn sử dụng: Nên dùng khi chọn thuật
        toán và giữ trạng thái duyệt qua thay đổi container. Tránh dùng khi nó che ownership,
        lifetime, kiểu, thứ tự hoặc chi phí."
    rubric:
      required:
        - Chỉ ra chính xác quy tắc C++11 hoặc invariant bị vi phạm.
        - Giải thích hậu quả như undefined behavior, lỗi compile hoặc sai trạng thái.
        - Đề xuất thay đổi nhỏ nhất loại bỏ nguyên nhân thay vì chỉ che triệu chứng.
      bonus:
        - Liên hệ bản sửa với lifetime, ownership, kiểu hoặc ordering.
      misconceptions:
        - Cho rằng chương trình an toàn chỉ vì có thể compile hoặc chạy một lần.
    sources:
