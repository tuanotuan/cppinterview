  - id: cpp11-nullptr-std-nullptr-t-003
    lessonId: cpp11-nullptr-std-nullptr-t
    type: pitfall
    responseMode: text
    difficulty: advanced
    interviewCategory: code_review_debug
    interviewFormat: bug_hunt
    estimatedMinutes: 5
    prompt: "Tìm và giải thích lỗi tinh tế trong tình huống sau: Giải tham chiếu null pointer gây
      undefined behavior dù việc tạo, sao chép và so sánh giá trị null là an toàn. Cách sửa nhỏ nhất
      nhưng an toàn trong C++11 là gì?"
    hint: Xác định lifetime, ownership, kiểu hoặc thứ tự bị vi phạm trước khi đề xuất thay đổi nhỏ nhất.
    answer:
      short: "Lỗi nằm ở việc vi phạm contract an toàn của chủ đề: Giải tham chiếu null pointer gây
        undefined behavior dù việc tạo, sao chép và so sánh giá trị null là an toàn. Bản sửa tối
        thiểu phải loại bỏ trạng thái hoặc đường truy cập không hợp lệ đó."
      detailed: "Mental model: `nullptr` là giá trị null pointer có kiểu riêng, loại bỏ sự nhập nhằng giữa
        số nguyên và pointer khi dùng `0` hoặc `NULL`. Hãy xác định giá trị hoặc trạng thái liên
        quan, ai sở hữu nó và quy tắc tác động lúc compile hay lúc chạy. Tình huống lỗi là: Giải
        tham chiếu null pointer gây undefined behavior dù việc tạo, sao chép và so sánh giá trị null
        là an toàn. Cách sửa an toàn phải làm ràng buộc này hiện rõ bằng cơ chế C++11 của bài, đồng
        thời giữ đúng hướng dẫn sử dụng: Nên dùng khi pointer chủ ý không trỏ tới đâu hoặc overload
        cần phân biệt null với số 0. Tránh dùng khi nó che ownership, lifetime, kiểu, thứ tự hoặc
        chi phí."
    rubric:
      required:
        - Chỉ ra chính xác quy tắc C++11 hoặc invariant bị vi phạm.
        - Giải thích hậu quả như undefined behavior, lỗi compile hoặc sai trạng thái.
        - Đề xuất thay đổi nhỏ nhất loại bỏ nguyên nhân thay vì chỉ che triệu chứng.
      bonus:
