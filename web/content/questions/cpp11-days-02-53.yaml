    interviewFormat: bug_hunt
    estimatedMinutes: 5
    prompt: "Tìm và giải thích lỗi tinh tế trong tình huống sau: Chuỗi UTF-8 vẫn là dãy code unit; index
      theo byte không tương đương index theo ký tự người dùng nhìn thấy. Cách sửa nhỏ nhất nhưng an
      toàn trong C++11 là gì?"
    hint: Xác định lifetime, ownership, kiểu hoặc thứ tự bị vi phạm trước khi đề xuất thay đổi nhỏ nhất.
    answer:
      short: "Lỗi nằm ở việc vi phạm contract an toàn của chủ đề: Chuỗi UTF-8 vẫn là dãy code unit; index
        theo byte không tương đương index theo ký tự người dùng nhìn thấy. Bản sửa tối thiểu phải
        loại bỏ trạng thái hoặc đường truy cập không hợp lệ đó."
      detailed: "Mental model: C++11 bổ sung ký pháp và metadata cho giá trị miền, text dễ đọc, chuỗi có
        encoding, ý định cho compiler, căn chỉnh bộ nhớ và trạng thái riêng từng thread. Hãy xác
        định giá trị hoặc trạng thái liên quan, ai sở hữu nó và quy tắc tác động lúc compile hay lúc
        chạy. Tình huống lỗi là: Chuỗi UTF-8 vẫn là dãy code unit; index theo byte không tương đương
        index theo ký tự người dùng nhìn thấy. Cách sửa an toàn phải làm ràng buộc này hiện rõ bằng
        cơ chế C++11 của bài, đồng thời giữ đúng hướng dẫn sử dụng: Nên dùng khi cú pháp cần biểu
        đạt trực tiếp đơn vị, text, ràng buộc bộ nhớ hoặc trạng thái từng thread. Tránh dùng khi nó
        che ownership, lifetime, kiểu, thứ tự hoặc chi phí."
    rubric:
      required:
        - Chỉ ra chính xác quy tắc C++11 hoặc invariant bị vi phạm.
        - Giải thích hậu quả như undefined behavior, lỗi compile hoặc sai trạng thái.
        - Đề xuất thay đổi nhỏ nhất loại bỏ nguyên nhân thay vì chỉ che triệu chứng.
      bonus:
        - Liên hệ bản sửa với lifetime, ownership, kiểu hoặc ordering.
      misconceptions:
        - Cho rằng chương trình an toàn chỉ vì có thể compile hoặc chạy một lần.
