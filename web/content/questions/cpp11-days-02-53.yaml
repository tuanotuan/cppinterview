      detailed: "Mental model: Future nhận một kết quả trong tương lai, promise cung cấp kết quả rõ ràng,
        còn `std::async` gói việc chạy task và chuyển kết quả. Hãy xác định giá trị hoặc trạng thái
        liên quan, ai sở hữu nó và quy tắc tác động lúc compile hay lúc chạy. Tình huống lỗi là: Gọi
        `get` hai lần là không hợp lệ vì future thường chỉ chuyển kết quả một lần; promise bị bỏ dở
        còn báo exception. Cách sửa an toàn phải làm ràng buộc này hiện rõ bằng cơ chế C++11 của
        bài, đồng thời giữ đúng hướng dẫn sử dụng: Nên dùng khi một kết quả hoặc exception cần đi
        qua ranh giới bất đồng bộ. Tránh dùng khi nó che ownership, lifetime, kiểu, thứ tự hoặc chi
        phí."
    rubric:
      required:
        - Chỉ ra chính xác quy tắc C++11 hoặc invariant bị vi phạm.
        - Giải thích hậu quả như undefined behavior, lỗi compile hoặc sai trạng thái.
        - Đề xuất thay đổi nhỏ nhất loại bỏ nguyên nhân thay vì chỉ che triệu chứng.
      bonus:
        - Liên hệ bản sửa với lifetime, ownership, kiểu hoặc ordering.
      misconceptions:
        - Cho rằng chương trình an toàn chỉ vì có thể compile hoặc chạy một lần.
