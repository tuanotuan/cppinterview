    interviewFormat: bug_hunt
    estimatedMinutes: 5
    prompt: "Tìm và giải thích lỗi tinh tế trong tình huống sau: Lambda capture biến local bằng
      reference không được sống lâu hơn biến đó; gọi về sau sẽ truy cập reference bị treo. Cách sửa
      nhỏ nhất nhưng an toàn trong C++11 là gì?"
    hint: Xác định lifetime, ownership, kiểu hoặc thứ tự bị vi phạm trước khi đề xuất thay đổi nhỏ nhất.
    answer:
      short: "Lỗi nằm ở việc vi phạm contract an toàn của chủ đề: Lambda capture biến local bằng reference
        không được sống lâu hơn biến đó; gọi về sau sẽ truy cập reference bị treo. Bản sửa tối thiểu
        phải loại bỏ trạng thái hoặc đường truy cập không hợp lệ đó."
      detailed: "Mental model: Lambda tạo một callable nhỏ ngay gần nơi sử dụng; capture chỉ rõ giá trị
        bên ngoài nào được sao chép hoặc tham chiếu. Hãy xác định giá trị hoặc trạng thái liên quan,
        ai sở hữu nó và quy tắc tác động lúc compile hay lúc chạy. Tình huống lỗi là: Lambda capture
        biến local bằng reference không được sống lâu hơn biến đó; gọi về sau sẽ truy cập reference
        bị treo. Cách sửa an toàn phải làm ràng buộc này hiện rõ bằng cơ chế C++11 của bài, đồng
        thời giữ đúng hướng dẫn sử dụng: Nên dùng khi thao tác ngắn nên nằm ngay cạnh thuật toán
        hoặc nơi đăng ký callback. Tránh dùng khi nó che ownership, lifetime, kiểu, thứ tự hoặc chi
        phí."
    rubric:
      required:
        - Chỉ ra chính xác quy tắc C++11 hoặc invariant bị vi phạm.
        - Giải thích hậu quả như undefined behavior, lỗi compile hoặc sai trạng thái.
        - Đề xuất thay đổi nhỏ nhất loại bỏ nguyên nhân thay vì chỉ che triệu chứng.
      bonus:
        - Liên hệ bản sửa với lifetime, ownership, kiểu hoặc ordering.
      misconceptions:
        - Cho rằng chương trình an toàn chỉ vì có thể compile hoặc chạy một lần.
