  - id: cpp11-stl-numeric-algorithms-lambda-002
    lessonId: cpp11-stl-numeric-algorithms-lambda
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Đọc ví dụ nhỏ ở trên. Chương trình sẽ in giá trị hoặc trạng thái nào, và quy tắc nào tạo ra
      kết quả đó?
    code: "#include <algorithm>\r

      #include <iostream>\r

      #include <numeric>\r

      #include <vector>\r

      \r

      int main() {\r

      \    std::vector<int> values{5, 2, 4, 1, 3};\r

      \r

      \    std::sort(values.begin(), values.end());\r

      \    const int even_count = std::count_if(\r

      \        values.begin(), values.end(),\r

      \        [](int value) { return value % 2 == 0; });\r

      \    const int total = std::accumulate(values.begin(), values.end(), 0);\r

      \r

      \    std::cout << \"first=\" << values.front() << '\\n';\r

      \    std::cout << \"even=\" << even_count << '\\n';\r

      \    std::cout << \"total=\" << total << '\\n';\r

      }"
