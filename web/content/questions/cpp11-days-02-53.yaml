        block"
      detailed: "Mental model: Scope quyết định nơi nhìn thấy tên; storage duration quyết định vùng nhớ
        tồn tại bao lâu; lifetime quyết định lúc nào đối tượng được phép sử dụng. Hãy xác định giá
