      short: "Ví dụ tạo trạng thái cố định được mô tả trong bài: Strong CAS đổi 5 thành 9, sau đó
        `fetch_add` trả giá trị cũ đồng thời tăng giá trị đang lưu. File `.cpp` dùng dữ liệu cố định
        và không thêm abstraction ngoài chủ đề."
      detailed: "Ví dụ tạo dữ liệu nhỏ, cố định và không cần nhập bàn phím. C++11 hoặc contract thư viện
