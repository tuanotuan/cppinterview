  - id: cpp11-mutex-locks-condition-variable-002
    lessonId: cpp11-mutex-locks-condition-variable
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Đọc ví dụ nhỏ ở trên. Chương trình sẽ in giá trị hoặc trạng thái nào, và quy tắc nào tạo ra
      kết quả đó?
    code: "#include <condition_variable>\r

      #include <iostream>\r

      #include <mutex>\r

      #include <thread>\r

      \r

      int main() {\r

      \    std::mutex mutex;\r

      \    std::condition_variable ready_cv;\r

      \    bool ready = false;\r

      \    int value = 0;\r

      \r

      \    std::thread consumer([&] {\r

      \        std::unique_lock<std::mutex> lock(mutex);\r

      \        ready_cv.wait(lock, [&] { return ready; });\r

      \        std::cout << \"value=\" << value << '\\n';\r

      \    });\r

      \r

      \    std::thread producer([&] {\r

      \        {\r

      \            std::lock_guard<std::mutex> lock(mutex);\r

      \            value = 42;\r

      \            ready = true;\r

      \        }\r

      \        ready_cv.notify_one();\r

      \    });\r

      \r

      \    producer.join();\r

      \    consumer.join();\r

      }"
    hint: Theo dõi dữ liệu cố định trong mã mẫu theo thứ tự thực thi rồi đối chiếu với quy tắc ở phần
      Cách nó hoạt động.
    answer:
      short: "Ví dụ tạo trạng thái cố định được mô tả trong bài: Producer lưu một giá trị dưới lock rồi
        notify; consumer wait với predicate và in giá trị đó. File `.cpp` dùng dữ liệu cố định và
        không thêm abstraction ngoài chủ đề."
