    code: "#include <cstddef>\r

      #include <iostream>\r

      \r

      constexpr unsigned long long operator\"\" _kb(unsigned long long value) {\r

      \    return value * 1024ULL;\r

      }\r

      \r

      thread_local int calls = 0;\r

      \r

      struct alignas(16) Block {\r

      \    char bytes[16];\r

      };\r

      \r

      [[noreturn]] void stop() {\r

      \    throw 1;\r

      }\r

      \r

      int main() {\r

      \    const char* path = R\"(C:\\ticks\\day1)\";\r

      \    const char* text = u8\"Giá\";\r

      \    ++calls;\r

      \r

      \    std::cout << \"bytes=\" << 2_kb << '\\n';\r

      \    std::cout << \"path=\" << path << '\\n';\r

      \    std::cout << \"text=\" << text << '\\n';\r

      \    std::cout << \"alignment=\" << alignof(Block) << \" calls=\" << calls << '\\n';\r

      \r

      \    try { stop(); } catch (int) { std::cout << \"caught\\n\"; }\r

      }"
