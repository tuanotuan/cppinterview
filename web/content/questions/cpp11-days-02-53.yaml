    estimatedMinutes: 4
    prompt: Đọc ví dụ nhỏ ở trên. Chương trình sẽ in giá trị hoặc trạng thái nào, và quy tắc nào tạo ra
      kết quả đó?
    code: "#include <iostream>\r

      \r

      class Base {\r

      public:\r

      \    virtual ~Base() {\r

      \        std::cout << \"Base destroyed\\n\";\r

      \    }\r

      \r

      \    virtual const char* name() const {\r

      \        return \"Base\";\r

      \    }\r

      };\r

      \r

