      kết quả đó?
    code: "#include <array>\r

      #include <atomic>\r

      #include <cstddef>\r

      #include <iostream>\r

      #include <thread>\r

      \r

      class SpscQueue {\r

      public:\r

      \    SpscQueue() : head_(0), tail_(0) {}\r

      \r

      \    bool push(int value) {\r

      \        const std::size_t tail = tail_.load(std::memory_order_relaxed);\r

      \        const std::size_t next = (tail + 1) % data_.size();\r

      \        if (next == head_.load(std::memory_order_acquire)) {\r

      \            return false;\r

      \        }\r

      \        data_[tail] = value;\r

      \        tail_.store(next, std::memory_order_release);\r

      \        return true;\r

      \    }\r

      \r

      \    bool pop(int& value) {\r

      \        const std::size_t head = head_.load(std::memory_order_relaxed);\r

      \        if (head == tail_.load(std::memory_order_acquire)) {\r

      \            return false;\r

      \        }\r

      \        value = data_[head];\r

      \        head_.store((head + 1) % data_.size(), std::memory_order_release);\r

      \        return true;\r

      \    }\r

      \r

      private:\r

      \    std::array<int, 4> data_;\r

      \    std::atomic<std::size_t> head_;\r

      \    std::atomic<std::size_t> tail_;\r

      };\r

      \r

      int main() {\r

      \    SpscQueue queue;\r

      \    std::thread producer([&] {\r

      \        for (int value = 1; value <= 3; ++value) {\r

      \            while (!queue.push(value)) {}\r

      \        }\r

      \    });\r

      \    std::thread consumer([&] {\r

      \        for (int count = 0; count < 3;) {\r

      \            int value = 0;\r

      \            if (queue.pop(value)) {\r

      \                std::cout << value << (count == 2 ? '\\n' : ' ');\r

      \                ++count;\r

      \            }\r

      \        }\r

      \    });\r

      \    producer.join();\r

      \    consumer.join();\r

      }"
    hint: Theo dõi dữ liệu cố định trong mã mẫu theo thứ tự thực thi rồi đối chiếu với quy tắc ở phần
      Cách nó hoạt động.
    answer:
      short: "Ví dụ tạo trạng thái cố định được mô tả trong bài: Ring bốn ô công bố ba số nguyên từ một
        producer; một consumer pop theo FIFO bằng index acquire/release. File `.cpp` dùng dữ liệu cố
        định và không thêm abstraction ngoài chủ đề."
