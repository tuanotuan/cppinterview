  - id: cpp11-stack-queue-priority-queue-ring-buffer-002
    lessonId: cpp11-stack-queue-priority-queue-ring-buffer
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Đọc ví dụ nhỏ ở trên. Chương trình sẽ in giá trị hoặc trạng thái nào, và quy tắc nào tạo ra
      kết quả đó?
    code: "#include <array>\r

      #include <iostream>\r

      #include <queue>\r

      #include <stack>\r

      \r

      int main() {\r

      \    std::stack<int> undo;\r

      \    undo.push(1);\r

      \    undo.push(2);\r

      \r

      \    std::queue<int> tasks;\r

      \    tasks.push(3);\r

      \    tasks.push(4);\r

      \r

      \    std::priority_queue<int> urgent;\r

      \    urgent.push(5);\r

      \    urgent.push(9);\r

      \r

      \    std::array<int, 3> ring{{0, 0, 0}};\r

      \    std::size_t write = 0;\r

      \    for (int value = 10; value <= 13; ++value) {\r

      \        ring[write] = value;\r

      \        write = (write + 1) % ring.size();\r

      \    }\r

      \r

      \    std::cout << \"stack=\" << undo.top() << '\\n';\r

      \    std::cout << \"queue=\" << tasks.front() << '\\n';\r

      \    std::cout << \"priority=\" << urgent.top() << '\\n';\r

      \    std::cout << \"ring=\" << ring[0] << ',' << ring[1] << ',' << ring[2] << '\\n';\r

      }"
    hint: Theo dõi dữ liệu cố định trong mã mẫu theo thứ tự thực thi rồi đối chiếu với quy tắc ở phần
      Cách nó hoạt động.
    answer:
      short: "Ví dụ tạo trạng thái cố định được mô tả trong bài: Ba adapter chuẩn cho biết phần tử kế
        tiếp; mảng ba ô minh họa ghi vòng bằng phép modulo. File `.cpp` dùng dữ liệu cố định và
        không thêm abstraction ngoài chủ đề."
      detailed: "Ví dụ tạo dữ liệu nhỏ, cố định và không cần nhập bàn phím. C++11 hoặc contract thư viện
        chuẩn áp dụng quy tắc hôm nay. Chương trình in kết quả quan trọng để đối chiếu với mã nguồn.
        Vì chương trình không nhận input, kết quả phải được suy ra trực tiếp từ từng câu lệnh và
        contract C++11: Ba adapter chuẩn cho biết phần tử kế tiếp; mảng ba ô minh họa ghi vòng bằng
        phép modulo. File `.cpp` dùng dữ liệu cố định và không thêm abstraction ngoài chủ đề."
    rubric:
      required:
        - Nêu đúng giá trị hoặc trạng thái quan sát được của chương trình.
        - Liên hệ từng kết quả với câu lệnh và quy tắc C++11 tạo ra nó.
        - Không suy đoán thêm input hoặc trạng thái ngoài mã mẫu.
      bonus:
        - Nêu hệ quả về kiểu, lifetime, ownership hoặc thứ tự nếu có.
      misconceptions:
        - Đoán output mà không lần theo dữ liệu và quy tắc trong mã.
    sources:
      - sectionId: cach-no-hoat-dong
      - sectionId: vi-du-don-gian
    sourceHash: 74208b05d83366db37c4a5afae01af76ed33873506772716854269f3ca518cf9
    status: draft
    version: 1
