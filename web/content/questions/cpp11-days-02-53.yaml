        contract C++11: Kiểu giây `explicit` phải được dựng tại nơi gọi, còn kiểu điểm cố ý implicit
        cho thấy sự khác biệt. File `.cpp` dùng dữ liệu cố định và không thêm abstraction ngoài chủ
        đề."
    rubric:
      required:
        - Nêu đúng giá trị hoặc trạng thái quan sát được của chương trình.
        - Liên hệ từng kết quả với câu lệnh và quy tắc C++11 tạo ra nó.
        - Không suy đoán thêm input hoặc trạng thái ngoài mã mẫu.
      bonus:
