  - id: cpp11-exception-safety-noexcept-001
    lessonId: cpp11-exception-safety-noexcept
    type: recall
    responseMode: text
    difficulty: beginner
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: Chủ đề hôm nay giải quyết vấn đề gì, và token hoặc khai báo nào trong cú pháp tối thiểu kích
      hoạt nó?
    hint: Đối chiếu phần Vấn đề nó giải quyết với Cú pháp tối thiểu; nêu đúng token hoặc khai báo tạo ra
      hành vi.
    answer:
      short: "Exception safety quy định trạng thái còn lại khi thao tác thất bại; `noexcept` ghi lời hứa
        rằng exception không thoát khỏi hàm. Nó làm ràng buộc quan trọng hiện rõ thay vì bắt người
        đọc đoán. Bài chỉ giữ phần cốt lõi C++11 vừa đủ cho một ngày tập trung. Cú pháp tối thiểu
        liên quan là: void cleanup() noexcept; try { risky(); } catch (const std::exception& e) { }"
      detailed: "Mental model: Exception safety quy định trạng thái còn lại khi thao tác thất bại;
        `noexcept` ghi lời hứa rằng exception không thoát khỏi hàm. Hãy xác định giá trị hoặc trạng
        thái liên quan, ai sở hữu nó và quy tắc tác động lúc compile hay lúc chạy. Trong bài, ràng
        buộc đó được biểu đạt trực tiếp bằng cú pháp: void cleanup() noexcept; try { risky(); }
        catch (const std::exception& e) { }"
    rubric:
      required:
        - Nêu đúng vấn đề mà chủ đề giải quyết.
        - Chỉ ra token hoặc khai báo C++11 liên quan trong cú pháp tối thiểu.
        - Giải thích ràng buộc mà cú pháp đó làm rõ.
      bonus:
        - Phân biệt tác động lúc compile với tác động lúc chạy.
      misconceptions:
        - Chỉ nhắc tên tính năng mà không giải thích vấn đề hoặc cú pháp.
    sources:
      - sectionId: van-de-no-giai-quyet
