  - id: cpp11-memory-pool-custom-allocator-benchmark-profiling-002
    lessonId: cpp11-memory-pool-custom-allocator-benchmark-profiling
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Đọc ví dụ nhỏ ở trên. Chương trình sẽ in giá trị hoặc trạng thái nào, và quy tắc nào tạo ra
      kết quả đó?
    code: "#include <chrono>\r

      #include <cstddef>\r

      #include <iostream>\r

      #include <new>\r

      \r

      class IntPool {\r

      public:\r

      \    IntPool() : used_(0) {}\r

      \r

      \    void* allocate() {\r

      \        if (used_ == capacity) {\r

      \            throw std::bad_alloc();\r

      \        }\r

      \        return storage_ + sizeof(int) * used_++;\r

      \    }\r

      \r

      \    void reset() { used_ = 0; }\r

      \r

      private:\r

      \    static const std::size_t capacity = 100;\r

      \    alignas(int) unsigned char storage_[capacity * sizeof(int)];\r

      \    std::size_t used_;\r

      };\r

      \r

      int main() {\r

      \    IntPool pool;\r

      \    volatile long long checksum = 0;\r

      \    const auto start = std::chrono::steady_clock::now();\r

      \r

      \    for (int batch = 0; batch < 10; ++batch) {\r

      \        for (int i = 0; i < 100; ++i) {\r

      \            int* value = new (pool.allocate()) int(batch * 100 + i);\r

      \            checksum += *value;\r

      \        }\r

      \        pool.reset();\r

      \    }\r

      \r

      \    const auto end = std::chrono::steady_clock::now();\r

      \    const auto elapsed = end - start;\r

      \    std::cout << \"checksum=\" << checksum << '\\n';\r

      \    std::cout << \"time_captured=\" << (elapsed.count() >= 0) << '\\n';\r

      }"
    hint: Theo dõi dữ liệu cố định trong mã mẫu theo thứ tự thực thi rồi đối chiếu với quy tắc ở phần
      Cách nó hoạt động.
    answer:
      short: "Ví dụ tạo trạng thái cố định được mô tả trong bài: Pool cố định có alignment dùng placement
        construction cho số nguyên theo batch, tính checksum và xác minh đã đo duration bằng steady
        clock. File `.cpp` dùng dữ liệu cố định và không thêm abstraction ngoài chủ đề."
      detailed: "Ví dụ tạo dữ liệu nhỏ, cố định và không cần nhập bàn phím. C++11 hoặc contract thư viện
        chuẩn áp dụng quy tắc hôm nay. Chương trình in kết quả quan trọng để đối chiếu với mã nguồn.
        Vì chương trình không nhận input, kết quả phải được suy ra trực tiếp từ từng câu lệnh và
        contract C++11: Pool cố định có alignment dùng placement construction cho số nguyên theo
        batch, tính checksum và xác minh đã đo duration bằng steady clock. File `.cpp` dùng dữ liệu
        cố định và không thêm abstraction ngoài chủ đề."
    rubric:
      required:
        - Nêu đúng giá trị hoặc trạng thái quan sát được của chương trình.
        - Liên hệ từng kết quả với câu lệnh và quy tắc C++11 tạo ra nó.
        - Không suy đoán thêm input hoặc trạng thái ngoài mã mẫu.
      bonus:
        - Nêu hệ quả về kiểu, lifetime, ownership hoặc thứ tự nếu có.
      misconceptions:
        - Đoán output mà không lần theo dữ liệu và quy tắc trong mã.
