        con, virtual destructor cho phép xóa qua base pointer an toàn, còn `override/final` kiểm tra
        ý định. Hãy xác định giá trị hoặc trạng thái liên quan, ai sở hữu nó và quy tắc tác động lúc
        compile hay lúc chạy. Trong bài, ràng buộc đó được biểu đạt trực tiếp bằng cú pháp: struct
        Derived final : Base { const char* name() const override; };"
    rubric:
      required:
        - Nêu đúng vấn đề mà chủ đề giải quyết.
        - Chỉ ra token hoặc khai báo C++11 liên quan trong cú pháp tối thiểu.
