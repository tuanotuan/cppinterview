  - id: cpp11-data-race-deadlock-false-sharing-002
    lessonId: cpp11-data-race-deadlock-false-sharing
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Đọc ví dụ nhỏ ở trên. Chương trình sẽ in giá trị hoặc trạng thái nào, và quy tắc nào tạo ra
      kết quả đó?
    code: "#include <atomic>\r

      #include <iostream>\r

      #include <mutex>\r

      #include <thread>\r

      \r

      struct alignas(64) PaddedCounter {\r

      \    PaddedCounter() : value(0) {}\r

      \    std::atomic<int> value;\r

      };\r

      \r

      int main() {\r

      \    PaddedCounter left;\r

      \    PaddedCounter right; // padding reduces likely cache-line sharing\r

      \r

      \    std::thread first([&] {\r

      \        for (int i = 0; i < 1000; ++i) {\r

      \            left.value.fetch_add(1, std::memory_order_relaxed);\r

      \        }\r

      \    });\r

      \    std::thread second([&] {\r

      \        for (int i = 0; i < 1000; ++i) {\r

      \            right.value.fetch_add(1, std::memory_order_relaxed);\r

      \        }\r

      \    });\r

      \r

      \    std::mutex a;\r

      \    std::mutex b;\r

      \    std::lock(a, b); // deadlock-aware acquisition\r

      \    std::lock_guard<std::mutex> lock_a(a, std::adopt_lock);\r

      \    std::lock_guard<std::mutex> lock_b(b, std::adopt_lock);\r

      \r

      \    first.join();\r

      \    second.join();\r

      \    std::cout << left.value << ',' << right.value << '\\n';\r

      }"
    hint: Theo dõi dữ liệu cố định trong mã mẫu theo thứ tự thực thi rồi đối chiếu với quy tắc ở phần
      Cách nó hoạt động.
    answer:
      short: "Ví dụ tạo trạng thái cố định được mô tả trong bài: Hai thread cập nhật atomic counter được
        padding; `std::lock` lấy hai mutex mà không áp đặt thứ tự thủ công nguy hiểm. File `.cpp`
        dùng dữ liệu cố định và không thêm abstraction ngoài chủ đề."
      detailed: "Ví dụ tạo dữ liệu nhỏ, cố định và không cần nhập bàn phím. C++11 hoặc contract thư viện
        chuẩn áp dụng quy tắc hôm nay. Chương trình in kết quả quan trọng để đối chiếu với mã nguồn.
        Vì chương trình không nhận input, kết quả phải được suy ra trực tiếp từ từng câu lệnh và
        contract C++11: Hai thread cập nhật atomic counter được padding; `std::lock` lấy hai mutex
        mà không áp đặt thứ tự thủ công nguy hiểm. File `.cpp` dùng dữ liệu cố định và không thêm
        abstraction ngoài chủ đề."
    rubric:
      required:
        - Nêu đúng giá trị hoặc trạng thái quan sát được của chương trình.
        - Liên hệ từng kết quả với câu lệnh và quy tắc C++11 tạo ra nó.
        - Không suy đoán thêm input hoặc trạng thái ngoài mã mẫu.
      bonus:
        - Nêu hệ quả về kiểu, lifetime, ownership hoặc thứ tự nếu có.
      misconceptions:
        - Đoán output mà không lần theo dữ liệu và quy tắc trong mã.
