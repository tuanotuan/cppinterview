      hành vi.
    answer:
      short: "Container C++11 sở hữu phần tử và có mô hình duyệt thống nhất; range-for cùng
        `std::begin/end` dùng được với container lẫn mảng built-in. Nó làm ràng buộc quan trọng hiện
        rõ thay vì bắt người đọc đoán. Bài chỉ giữ phần cốt lõi C++11 vừa đủ cho một ngày tập trung.
        Cú pháp tối thiểu liên quan là: std::array<int, 3> a{{1,2,3}}; for (int x : a) { }"
      detailed: "Mental model: Container C++11 sở hữu phần tử và có mô hình duyệt thống nhất; range-for
