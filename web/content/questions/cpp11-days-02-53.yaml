  - id: cpp11-type-aliases-enum-class-nested-templates-002
    lessonId: cpp11-type-aliases-enum-class-nested-templates
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Đọc ví dụ nhỏ ở trên. Chương trình sẽ in giá trị hoặc trạng thái nào, và quy tắc nào tạo ra
      kết quả đó?
    code: "#include <iostream>\r

      #include <vector>\r

      \r

      using Scores = std::vector<int>;\r

      \r

      enum class State { ready, busy };\r

      \r

      int main() {\r

      \    Scores scores{7, 8, 9};\r

      \    std::vector<std::vector<int> > grid{{1, 2}, {3, 4}};\r

      \    State state = State::ready;\r

      \r

      \    std::cout << \"score=\" << scores[1] << '\\n';\r

      \    std::cout << \"cell=\" << grid[1][0] << '\\n';\r

      \    std::cout << \"ready=\" << (state == State::ready) << '\\n';\r

      }"
    hint: Theo dõi dữ liệu cố định trong mã mẫu theo thứ tự thực thi rồi đối chiếu với quy tắc ở phần
      Cách nó hoạt động.
    answer:
      short: "Ví dụ tạo trạng thái cố định được mô tả trong bài: Chương trình đặt tên cho vector điểm,
        dùng trạng thái có scope và lưu lưới hai chiều nhỏ bằng `std::vector` lồng nhau. File `.cpp`
        dùng dữ liệu cố định và không thêm abstraction ngoài chủ đề."
      detailed: "Ví dụ tạo dữ liệu nhỏ, cố định và không cần nhập bàn phím. C++11 hoặc contract thư viện
        chuẩn áp dụng quy tắc hôm nay. Chương trình in kết quả quan trọng để đối chiếu với mã nguồn.
        Vì chương trình không nhận input, kết quả phải được suy ra trực tiếp từ từng câu lệnh và
        contract C++11: Chương trình đặt tên cho vector điểm, dùng trạng thái có scope và lưu lưới
        hai chiều nhỏ bằng `std::vector` lồng nhau. File `.cpp` dùng dữ liệu cố định và không thêm
        abstraction ngoài chủ đề."
    rubric:
      required:
        - Nêu đúng giá trị hoặc trạng thái quan sát được của chương trình.
        - Liên hệ từng kết quả với câu lệnh và quy tắc C++11 tạo ra nó.
        - Không suy đoán thêm input hoặc trạng thái ngoài mã mẫu.
      bonus:
        - Nêu hệ quả về kiểu, lifetime, ownership hoặc thứ tự nếu có.
      misconceptions:
        - Đoán output mà không lần theo dữ liệu và quy tắc trong mã.
    sources:
