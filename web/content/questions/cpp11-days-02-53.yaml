  - id: cpp11-nullptr-std-nullptr-t-002
    lessonId: cpp11-nullptr-std-nullptr-t
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Đọc ví dụ nhỏ ở trên. Chương trình sẽ in giá trị hoặc trạng thái nào, và quy tắc nào tạo ra
      kết quả đó?
    code: "#include <cstddef>\r

      #include <iostream>\r

      \r

      void inspect(int* pointer) {\r

      \    std::cout << \"pointer=\" << *pointer << '\\n';\r

      }\r

      \r

      void inspect(std::nullptr_t) {\r

      \    std::cout << \"null\\n\";\r

      }\r

      \r

      int main() {\r

      \    int value = 42;\r

      \    inspect(&value);\r

      \    inspect(nullptr); // selects the exact nullptr overload\r

      }"
    hint: Theo dõi dữ liệu cố định trong mã mẫu theo thứ tự thực thi rồi đối chiếu với quy tắc ở phần
      Cách nó hoạt động.
    answer:
      short: "Ví dụ tạo trạng thái cố định được mô tả trong bài: Hai overload phân biệt một `int*` thật
        với đối số đúng kiểu `std::nullptr_t` rồi in overload được chọn. File `.cpp` dùng dữ liệu cố
