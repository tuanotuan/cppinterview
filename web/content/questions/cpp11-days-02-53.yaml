        `std::forward` luôn coi tham số có tên là sắp hết dùng và có thể move nhầm từ lvalue gốc.
        Cách sửa an toàn phải làm ràng buộc này hiện rõ bằng cơ chế C++11 của bài, đồng thời giữ
        đúng hướng dẫn sử dụng: Nên dùng khi wrapper generic cần truyền đối số mà không đổi ý định
        lvalue/rvalue. Tránh dùng khi nó che ownership, lifetime, kiểu, thứ tự hoặc chi phí."
    rubric:
      required:
        - Chỉ ra chính xác quy tắc C++11 hoặc invariant bị vi phạm.
        - Giải thích hậu quả như undefined behavior, lỗi compile hoặc sai trạng thái.
        - Đề xuất thay đổi nhỏ nhất loại bỏ nguyên nhân thay vì chỉ che triệu chứng.
      bonus:
        - Liên hệ bản sửa với lifetime, ownership, kiểu hoặc ordering.
      misconceptions:
        - Cho rằng chương trình an toàn chỉ vì có thể compile hoặc chạy một lần.
