  - id: cpp11-scope-storage-duration-object-lifetime-002
    lessonId: cpp11-scope-storage-duration-object-lifetime
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Đọc ví dụ nhỏ ở trên. Chương trình sẽ in giá trị hoặc trạng thái nào, và quy tắc nào tạo ra
      kết quả đó?
    code: "#include <iostream>\r

      \r

      int next_call() {\r

      \    static int calls = 0; // storage lasts for the whole program\r

      \    return ++calls;\r

      }\r

      \r

      int main() {\r

      \    int outer = 10;\r

      \    {\r

      \        int inner = 5; // automatic lifetime ends with this block\r

      \        std::cout << \"inside=\" << outer + inner << '\\n';\r

      \    }\r

      \r

      \    std::cout << \"calls=\" << next_call() << ',' << next_call() << '\\n';\r

      }"
    hint: Theo dõi dữ liệu cố định trong mã mẫu theo thứ tự thực thi rồi đối chiếu với quy tắc ở phần
      Cách nó hoạt động.
    answer:
      short: "Ví dụ tạo trạng thái cố định được mô tả trong bài: Biến local trong block kết thúc ở dấu
        ngoặc đóng, còn bộ đếm `static` trong hàm giữ giá trị qua nhiều lần gọi. File `.cpp` dùng dữ
        liệu cố định và không thêm abstraction ngoài chủ đề."
      detailed: "Ví dụ tạo dữ liệu nhỏ, cố định và không cần nhập bàn phím. C++11 hoặc contract thư viện
