    prompt: Đọc ví dụ nhỏ ở trên. Chương trình sẽ in giá trị hoặc trạng thái nào, và quy tắc nào tạo ra
      kết quả đó?
    code: "#include <initializer_list>\r

      #include <iostream>\r

      \r

      void show(int first, int second) {\r

      \    std::cout << \"ordinary=\" << first + second << '\\n';\r

      }\r

      \r

      void show(std::initializer_list<int> values) {\r

      \    int sum = 0;\r

      \    for (int value : values) {\r

      \        sum += value;\r

      \    }\r

      \    std::cout << \"list=\" << sum << '\\n';\r

      }\r

      \r

      int main() {\r

      \    show(1, 2);\r

      \    show({1, 2, 3}); // selects initializer_list overload\r

      }"
    hint: Theo dõi dữ liệu cố định trong mã mẫu theo thứ tự thực thi rồi đối chiếu với quy tắc ở phần
      Cách nó hoạt động.
    answer:
      short: "Ví dụ tạo trạng thái cố định được mô tả trong bài: Các overload nhận hai số nguyên hoặc một
        initializer list; lời gọi bằng ngoặc chọn bản list và in tổng. File `.cpp` dùng dữ liệu cố
        định và không thêm abstraction ngoài chủ đề."
      detailed: "Ví dụ tạo dữ liệu nhỏ, cố định và không cần nhập bàn phím. C++11 hoặc contract thư viện
        chuẩn áp dụng quy tắc hôm nay. Chương trình in kết quả quan trọng để đối chiếu với mã nguồn.
        Vì chương trình không nhận input, kết quả phải được suy ra trực tiếp từ từng câu lệnh và
        contract C++11: Các overload nhận hai số nguyên hoặc một initializer list; lời gọi bằng
        ngoặc chọn bản list và in tổng. File `.cpp` dùng dữ liệu cố định và không thêm abstraction
        ngoài chủ đề."
    rubric:
      required:
        - Nêu đúng giá trị hoặc trạng thái quan sát được của chương trình.
        - Liên hệ từng kết quả với câu lệnh và quy tắc C++11 tạo ra nó.
        - Không suy đoán thêm input hoặc trạng thái ngoài mã mẫu.
      bonus:
        - Nêu hệ quả về kiểu, lifetime, ownership hoặc thứ tự nếu có.
      misconceptions:
        - Đoán output mà không lần theo dữ liệu và quy tắc trong mã.
