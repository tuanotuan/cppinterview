    lessonId: cpp11-copy-assignment-rule-of-three
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Đọc ví dụ nhỏ ở trên. Chương trình sẽ in giá trị hoặc trạng thái nào, và quy tắc nào tạo ra
      kết quả đó?
    code: "#include <iostream>\r

      \r

      class IntOwner {\r

      public:\r

      \    explicit IntOwner(int value) : data_(new int(value)) {}\r

      \r

      \    ~IntOwner() {\r

      \        delete data_;\r

      \    }\r

      \r

      \    IntOwner(const IntOwner& other) : data_(new int(*other.data_)) {}\r

      \r

      \    IntOwner& operator=(const IntOwner& other) {\r

      \        if (this != &other) {\r

      \            int* replacement = new int(*other.data_);\r

      \            delete data_;\r

      \            data_ = replacement;\r

      \        }\r

      \        return *this;\r

      \    }\r

      \r

      \    void set(int value) { *data_ = value; }\r

      \    int get() const { return *data_; }\r

      \r

      private:\r

      \    int* data_;\r

      };\r

      \r

      int main() {\r

      \    IntOwner first(3);\r

      \    IntOwner second(first);\r

      \    IntOwner third(0);\r

      \    third = first;\r

      \    second.set(8);\r

      \    std::cout << first.get() << ',' << second.get() << ',' << third.get() << '\\n';\r

      }"
    hint: Theo dõi dữ liệu cố định trong mã mẫu theo thứ tự thực thi rồi đối chiếu với quy tắc ở phần
