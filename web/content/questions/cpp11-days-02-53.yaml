schemaVersion: 1
questions:
  - id: cpp11-const-pointer-lvalue-reference-001
    lessonId: cpp11-const-pointer-lvalue-reference
    type: recall
    responseMode: text
    difficulty: beginner
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: Chủ đề hôm nay giải quyết vấn đề gì, và token hoặc khai báo nào trong cú pháp tối thiểu kích
      hoạt nó?
    hint: Đối chiếu phần Vấn đề nó giải quyết với Cú pháp tối thiểu; nêu đúng token hoặc khai báo tạo ra
      hành vi.
    answer:
      short: "`const` ngăn sửa nhầm, pointer giữ địa chỉ, còn lvalue reference là một tên khác của đối
        tượng đang tồn tại. Nó làm ràng buộc quan trọng hiện rõ thay vì bắt người đọc đoán. Bài chỉ
        giữ phần cốt lõi C++11 vừa đủ cho một ngày tập trung. Cú pháp tối thiểu liên quan là: const
        int limit = 10; int* p = &value; int& ref = value;"
      detailed: "Mental model: `const` ngăn sửa nhầm, pointer giữ địa chỉ, còn lvalue reference là một tên
        khác của đối tượng đang tồn tại. Hãy xác định giá trị hoặc trạng thái liên quan, ai sở hữu
        nó và quy tắc tác động lúc compile hay lúc chạy. Trong bài, ràng buộc đó được biểu đạt trực
        tiếp bằng cú pháp: const int limit = 10; int* p = &value; int& ref = value;"
    rubric:
      required:
        - Nêu đúng vấn đề mà chủ đề giải quyết.
        - Chỉ ra token hoặc khai báo C++11 liên quan trong cú pháp tối thiểu.
        - Giải thích ràng buộc mà cú pháp đó làm rõ.
      bonus:
        - Phân biệt tác động lúc compile với tác động lúc chạy.
      misconceptions:
        - Chỉ nhắc tên tính năng mà không giải thích vấn đề hoặc cú pháp.
    sources:
      - sectionId: van-de-no-giai-quyet
      - sectionId: cu-phap-toi-thieu
    sourceHash: 8a6e735c39209a4e14acbdff07b8ae2a4e65303c9b0e45ef7da09bfe608fd357
    status: draft
    version: 1
  - id: cpp11-const-pointer-lvalue-reference-002
    lessonId: cpp11-const-pointer-lvalue-reference
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Đọc ví dụ nhỏ ở trên. Chương trình sẽ in giá trị hoặc trạng thái nào, và quy tắc nào tạo ra
      kết quả đó?
    code: "#include <iostream>\r

      \r

      int main() {\r

      \    int value = 10;\r

      \    const int limit = 100;\r

      \r

      \    int* pointer = &value;       // stores value's address\r

      \    int& reference = value;      // another name for value\r

      \    const int* read_only = &limit;\r

      \r

      \    *pointer += 5;\r

      \    reference *= 2;\r

      \r

      \    std::cout << \"value=\" << value << '\\n';\r

      \    std::cout << \"limit=\" << *read_only << '\\n';\r

      }"
    hint: Theo dõi dữ liệu cố định trong mã mẫu theo thứ tự thực thi rồi đối chiếu với quy tắc ở phần
      Cách nó hoạt động.
    answer:
      short: "Ví dụ tạo trạng thái cố định được mô tả trong bài: Pointer và reference cùng sửa một số
        nguyên, còn pointer-to-const chỉ quan sát giá trị cuối và không được phép sửa. File `.cpp`
        dùng dữ liệu cố định và không thêm abstraction ngoài chủ đề."
      detailed: "Ví dụ tạo dữ liệu nhỏ, cố định và không cần nhập bàn phím. C++11 hoặc contract thư viện
        chuẩn áp dụng quy tắc hôm nay. Chương trình in kết quả quan trọng để đối chiếu với mã nguồn.
        Vì chương trình không nhận input, kết quả phải được suy ra trực tiếp từ từng câu lệnh và
        contract C++11: Pointer và reference cùng sửa một số nguyên, còn pointer-to-const chỉ quan
        sát giá trị cuối và không được phép sửa. File `.cpp` dùng dữ liệu cố định và không thêm
        abstraction ngoài chủ đề."
    rubric:
      required:
        - Nêu đúng giá trị hoặc trạng thái quan sát được của chương trình.
        - Liên hệ từng kết quả với câu lệnh và quy tắc C++11 tạo ra nó.
        - Không suy đoán thêm input hoặc trạng thái ngoài mã mẫu.
      bonus:
        - Nêu hệ quả về kiểu, lifetime, ownership hoặc thứ tự nếu có.
      misconceptions:
        - Đoán output mà không lần theo dữ liệu và quy tắc trong mã.
    sources:
      - sectionId: cach-no-hoat-dong
      - sectionId: vi-du-don-gian
    sourceHash: 8a6e735c39209a4e14acbdff07b8ae2a4e65303c9b0e45ef7da09bfe608fd357
    status: draft
    version: 1
  - id: cpp11-const-pointer-lvalue-reference-003
    lessonId: cpp11-const-pointer-lvalue-reference
    type: pitfall
    responseMode: text
    difficulty: advanced
    interviewCategory: code_review_debug
    interviewFormat: bug_hunt
    estimatedMinutes: 5
    prompt: "Tìm và giải thích lỗi tinh tế trong tình huống sau: Pointer hoặc reference bị treo vẫn trỏ
      tới đối tượng đã hết đời; truy cập qua nó gây undefined behavior. Cách sửa nhỏ nhất nhưng an
      toàn trong C++11 là gì?"
    hint: Xác định lifetime, ownership, kiểu hoặc thứ tự bị vi phạm trước khi đề xuất thay đổi nhỏ nhất.
    answer:
      short: "Lỗi nằm ở việc vi phạm contract an toàn của chủ đề: Pointer hoặc reference bị treo vẫn trỏ
        tới đối tượng đã hết đời; truy cập qua nó gây undefined behavior. Bản sửa tối thiểu phải
        loại bỏ trạng thái hoặc đường truy cập không hợp lệ đó."
      detailed: "Mental model: `const` ngăn sửa nhầm, pointer giữ địa chỉ, còn lvalue reference là một tên
        khác của đối tượng đang tồn tại. Hãy xác định giá trị hoặc trạng thái liên quan, ai sở hữu
        nó và quy tắc tác động lúc compile hay lúc chạy. Tình huống lỗi là: Pointer hoặc reference
        bị treo vẫn trỏ tới đối tượng đã hết đời; truy cập qua nó gây undefined behavior. Cách sửa
        an toàn phải làm ràng buộc này hiện rõ bằng cơ chế C++11 của bài, đồng thời giữ đúng hướng
        dẫn sử dụng: Nên dùng khi cần truy cập không sở hữu, địa chỉ có thể đổi, hoặc muốn thể hiện
        chỉ đọc. Tránh dùng khi nó che ownership, lifetime, kiểu, thứ tự hoặc chi phí."
    rubric:
      required:
        - Chỉ ra chính xác quy tắc C++11 hoặc invariant bị vi phạm.
        - Giải thích hậu quả như undefined behavior, lỗi compile hoặc sai trạng thái.
        - Đề xuất thay đổi nhỏ nhất loại bỏ nguyên nhân thay vì chỉ che triệu chứng.
      bonus:
        - Liên hệ bản sửa với lifetime, ownership, kiểu hoặc ordering.
      misconceptions:
        - Cho rằng chương trình an toàn chỉ vì có thể compile hoặc chạy một lần.
    sources:
      - sectionId: loi-thuong-gap
      - sectionId: khi-nao-nen-dung
    sourceHash: 8a6e735c39209a4e14acbdff07b8ae2a4e65303c9b0e45ef7da09bfe608fd357
    status: draft
    version: 1
