    prompt: "Tìm và giải thích lỗi tinh tế trong tình huống sau: Đặt biểu thức lỗi ngoài immediate
      substitution context sẽ biến SFINAE thành lỗi biên dịch cứng. Cách sửa nhỏ nhất nhưng an toàn
      trong C++11 là gì?"
    hint: Xác định lifetime, ownership, kiểu hoặc thứ tự bị vi phạm trước khi đề xuất thay đổi nhỏ nhất.
    answer:
