  - id: cpp20-designated-initializers-001
    lessonId: cpp20-designated-initializers
    type: code_reasoning
    difficulty: intermediate
    estimatedMinutes: 3
    prompt: Đoạn C++20 dưới đây có hợp lệ không? Nêu hai constraint quan trọng của designated initializers.
    code: |-
      struct RiskConfig {
          int maxPosition;
          double maxLoss;
      };

      RiskConfig config{
          .maxLoss = 5000.0,
          .maxPosition = 1000
      };
    hint: Kiểm tra loại object và thứ tự khai báo member.
    answer:
      short: Không hợp lệ trong C++20 vì designator phải theo thứ tự khai báo member. Feature này áp dụng
        cho aggregate types và không phải named arguments.
      detailed: "`RiskConfig` là aggregate phù hợp, nhưng `maxLoss` được chỉ định trước `maxPosition`,
        ngược declaration order. Cần viết `.maxPosition` trước `.maxLoss`. Designated initializers
        khởi tạo aggregate members bằng tên; chúng không cung cấp named parameters cho
        constructor/function."
    rubric:
      required:
        - Kết luận code không hợp lệ.
        - Chỉ ra lỗi thứ tự member.
        - Nêu constraint aggregate type.
      bonus:
        - Phân biệt với named parameters.
      misconceptions:
        - Designator có thể xuất hiện theo thứ tự bất kỳ như trong C.
    sources:
      - sectionId: member-order-still-matters
      - sectionId: aggregate-types-only
    sourceHash: 77220c505e8b03b2f6646e03eee9a3e31bbcdfa6b1b0bf0cd6db45d2a56c7f24
    status: archived
    version: 2
  - id: cpp98-address-pointer-001
    lessonId: cpp98-address-pointer
    type: recall
    difficulty: beginner
    estimatedMinutes: 2
    prompt: Phân biệt object, address, pointer và thao tác dereference.
    hint: "`ptr` và `*ptr` biểu diễn hai thứ khác nhau."
    answer:
      short: Object nằm tại một địa chỉ trong memory; pointer là biến lưu địa chỉ đó; dereference pointer
        bằng `*ptr` để truy cập object được trỏ tới.
      detailed: Toán tử `&object` lấy address của object. Pointer như `int* ptr` có thể lưu address phù
        hợp. Bản thân `ptr` là giá trị địa chỉ, còn `*ptr` là lvalue chỉ object tại địa chỉ đó. Chỉ
        dereference khi pointer trỏ tới object còn sống và hợp lệ.
    rubric:
      required:
        - Phân biệt address với object.
        - Nêu pointer lưu address.
        - Nêu dereference truy cập object.
      bonus:
        - Nhắc điều kiện pointer phải hợp lệ và object còn lifetime.
      misconceptions:
        - Pointer chính là object mà nó trỏ tới.
    sources:
      - sectionId: memory-model
    sourceHash: aa153e754d77a72d89eff13c9d2c517e950c1d947061bca1289f9ea3a40c045c
    status: verified
    version: 1
  - id: cpp98-address-pointer-002
    lessonId: cpp98-address-pointer
    type: pitfall
    difficulty: intermediate
    estimatedMinutes: 3
    prompt: Dangling pointer là gì, và vì sao việc pointer khác null vẫn chưa đủ để bảo đảm dereference
      an toàn?
    hint: Pointer có thể giữ lại address sau khi lifetime của object kết thúc.
    answer:
      short: Dangling pointer giữ địa chỉ của object không còn sống. Nó có thể khác null nhưng dereference
        vẫn gây undefined behavior vì lifetime đã kết thúc.
      detailed: Null check chỉ loại trừ null pointer; nó không chứng minh address còn thuộc về một object
        hợp lệ. Pointer có thể dangling sau khi local scope kết thúc, resource bị giải phóng hoặc
        owner di chuyển. Cần quản lý lifetime/ownership, không chỉ kiểm tra `ptr != nullptr`.
    rubric:
      required:
        - Định nghĩa pointer trỏ tới object đã hết lifetime.
        - Nêu pointer vẫn có thể khác null.
        - Nêu dereference là undefined behavior.
      bonus:
        - Liên hệ tới ownership thay vì chỉ null check.
      misconceptions:
        - Mọi non-null pointer đều hợp lệ để dereference.
    sources:
      - sectionId: common-mistakes
    sourceHash: aa153e754d77a72d89eff13c9d2c517e950c1d947061bca1289f9ea3a40c045c
    status: verified
    version: 1
  - id: cpp98-struct-padding-001
    lessonId: cpp98-struct-padding
    type: scenario
    difficulty: intermediate
    estimatedMinutes: 3
    prompt: Vì sao `sizeof(struct)` có thể lớn hơn tổng `sizeof` các field, và đổi thứ tự field có thể
      giúp gì?
    hint: CPU alignment có thể tạo khoảng trống giữa hoặc sau các member.
    answer:
      short: Compiler có thể chèn padding để các member đáp ứng alignment. Gom các field có alignment
        tương tự hoặc đặt field lớn trước đôi khi giảm khoảng trống và kích thước struct, nhưng kích
        thước cụ thể phụ thuộc implementation/ABI.
      detailed: Mỗi member thường phải bắt đầu ở offset phù hợp với alignment của type và toàn bộ struct
        cũng có alignment để phần tử trong array được đặt đúng. Vì vậy có thể có internal và tail
        padding. Reorder member có thể giảm padding, cải thiện cache density, nhưng phải đo trên
        target ABI và cân nhắc semantic readability thay vì giả định một layout tuyệt đối.
    rubric:
      required:
        - Nêu padding phục vụ alignment.
        - Nêu có thể có khoảng trống giữa hoặc sau member.
        - Nêu field order có thể ảnh hưởng size.
      bonus:
        - Nêu layout/size cụ thể phụ thuộc implementation hoặc ABI.
        - Liên hệ tới cache density.
      misconceptions:
        - "`sizeof(struct)` luôn bằng tổng kích thước field."
        - Reorder luôn tạo cùng kết quả trên mọi platform.
    sources:
      - sectionId: padding
    sourceHash: d87a0674a56e2699438c3775f1bead1dfb83a0d32716b8434d0a1e92e4f7398a
    status: verified
    version: 1
