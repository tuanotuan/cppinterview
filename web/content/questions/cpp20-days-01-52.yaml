      \        std::jthread a{[&] { sync.arrive_and_wait(); sync.arrive_and_wait(); }};\r

      \        std::jthread b{[&] { sync.arrive_and_wait(); sync.arrive_and_wait(); }};\r

      \    }\r

      \r

      \    std::cout << \"latch sum = \" << sum.load() << '\\n';\r

      \    std::cout << \"barrier phases = \" << phases << '\\n';\r

      }\r\n"
