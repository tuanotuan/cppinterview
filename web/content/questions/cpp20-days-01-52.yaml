    estimatedMinutes: 2
    prompt: Nhiệm vụ chính của `.member = value` trong ví dụ tối thiểu là gì?
    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu contract mà tính năng C++20 làm rõ.
    answer:
      short: Designated initializer làm aggregate construction dễ đọc bằng cách nêu tên member nhận giá
        trị. Nó làm một giả định quan trọng trở nên rõ và có thể kiểm tra.
      detailed: >-
        Designated initializer làm aggregate construction dễ đọc bằng cách nêu tên member nhận giá
        trị. Nó làm một giả định quan trọng trở nên rõ và có thể kiểm tra.


        Aggregate là record mở đơn giản. Designator là nhãn gắn vào initializer để người đọc không
        phải nhớ ý nghĩa chỉ theo vị trí. Hãy đọc .member = value như lời hứa chính xác; runtime
        precondition vẫn do lập trình viên chịu trách nhiệm.
    rubric:
