        - Không nhầm tính năng C++20 với hành vi phụ thuộc compiler.
      bonus:
        - Liên hệ được tác động compile time với hành vi quan sát được lúc chạy.
      misconceptions:
        - Chỉ nhắc tên tính năng mà không giải thích mục đích hoặc ràng buộc.
