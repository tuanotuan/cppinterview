    prompt: Deadlock cụ thể nào xảy ra nếu barrier chờ hai arrival nhưng một participant thoát trước
      `arrive_and_wait`?
    hint: Xác định invariant về kiểu, lifetime, ownership, bounds hoặc ordering trước khi đề xuất cách
      sửa nhỏ nhất.
    answer:
      short: Hủy synchronization object khi thread còn dùng là không hợp lệ; thiếu một arrival dự kiến có
        thể deadlock cả phase. Hãy kiểm tra cả header, mức hỗ trợ thư viện C++20, lifetime và kiểu
        được suy luận.
      detailed: >-
        Hủy synchronization object khi thread còn dùng là không hợp lệ; thiếu một arrival dự kiến có
        thể deadlock cả phase. Hãy kiểm tra cả header, mức hỗ trợ thư viện C++20, lifetime và kiểu
        được suy luận.


        Nên dùng khi worker có completion point một lần rõ ràng hoặc lặp nhiều phase đồng bộ. Tránh
        dùng khi participant có thể biến mất bất ngờ mà không drop đúng khỏi barrier.


        std::barrier diễn đạt ý tưởng C++20 trung tâm của ngày này. Ví dụ cô lập một hành vi bằng dữ
        liệu cố định. Compiler check không thay thế suy luận về lifetime và runtime. Ưu tiên
        interface nhỏ nhất nói đúng yêu cầu thật.
    rubric:
