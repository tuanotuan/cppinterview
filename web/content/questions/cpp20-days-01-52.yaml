    prompt: Exception bị throw được lưu ở đâu trước khi caller rethrow?
    code: "// Day 49: Coroutine Cancellation, Exceptions, Lifetime, and Allocation\r

      #include <coroutine>\r

      #include <cstddef>\r

      #include <exception>\r

      #include <iostream>\r

      #include <new>\r

      #include <stdexcept>\r

      #include <stop_token>\r

      #include <utility>\r

      \r

      int live_frames = 0;\r

      \r

      struct Task {\r

      \    struct promise_type;\r

      \    using Handle = std::coroutine_handle<promise_type>;\r

      \    struct promise_type {\r

      \        int result{};\r

      \        std::exception_ptr error{};\r

      \        static void* operator new(std::size_t size) {\r

      \            ++live_frames;\r

      \            return ::operator new(size);\r

      \        }\r

      \        static void operator delete(void* pointer, std::size_t size) noexcept {\r

      \            --live_frames;\r

      \            ::operator delete(pointer, size);\r

      \        }\r

      \        Task get_return_object() { return Task{Handle::from_promise(*this)}; }\r

      \        std::suspend_never initial_suspend() noexcept { return {}; }\r

      \        std::suspend_always final_suspend() noexcept { return {}; }\r

      \        void return_value(int value) noexcept { result = value; }\r

      \        void unhandled_exception() { error = std::current_exception(); }\r

      \    };\r

      \    Handle handle{};\r

      \    explicit Task(Handle value) : handle{value} {}\r

      \    Task(Task&& other) noexcept : handle{std::exchange(other.handle, {})} {}\r

      \    Task(const Task&) = delete;\r

      \    ~Task() { if (handle) handle.destroy(); }\r

      \    int value() const {\r

      \        if (handle.promise().error) std::rethrow_exception(handle.promise().error);\r

      \        return handle.promise().result;\r

      \    }\r

      };\r

      \r

      Task work(std::stop_token token, bool fail) {\r

      \    if (token.stop_requested()) co_return -1;\r

      \    if (fail) throw std::runtime_error(\"task failed\");\r

      \    co_return 1;\r

      }\r

      \r

      int main() {\r

      \    {\r

      \        std::stop_source source;\r

      \        source.request_stop();\r

      \        Task cancelled = work(source.get_token(), false);\r

      \        Task failed = work({}, true);\r

      \        std::cout << \"cancelled result = \" << cancelled.value() << '\\n';\r

      \        try { (void)failed.value(); }\r

      \        catch (const std::exception& error) { std::cout << error.what() << '\\n'; }\r

      \        std::cout << \"live frames in scope = \" << live_frames << '\\n';\r

      \    }\r

      \    std::cout << \"live frames after scope = \" << live_frames << '\\n';\r

      }\r\n"
