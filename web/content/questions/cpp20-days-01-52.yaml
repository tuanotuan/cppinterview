  - id: cpp20-custom-concepts-003
    lessonId: cpp20-custom-concepts
    type: pitfall
    responseMode: text
    difficulty: advanced
    interviewCategory: code_review_debug
    interviewFormat: bug_hunt
    estimatedMinutes: 5
    prompt: Một biểu thức `a + b` hợp lệ về cú pháp vẫn có thể sai ý nghĩa “cộng được” như thế nào, và
      điều đó dạy gì về thiết kế concept?
    hint: Xác định invariant về kiểu, lifetime, ownership, bounds hoặc ordering trước khi đề xuất cách
      sửa nhỏ nhất.
    answer:
      short: Concept kiểm tra cú pháp tình cờ thay vì nhu cầu thật có thể nhận kiểu gây hiểu nhầm hoặc
        siết API quá mức. Hãy kiểm tra cả header, mức hỗ trợ thư viện C++20, lifetime và kiểu được
        suy luận.
      detailed: >-
        Concept kiểm tra cú pháp tình cờ thay vì nhu cầu thật có thể nhận kiểu gây hiểu nhầm hoặc
        siết API quá mức. Hãy kiểm tra cả header, mức hỗ trợ thư viện C++20, lifetime và kiểu được
        suy luận.


        Nên dùng khi cùng một quy tắc miền nghiệp vụ ràng buộc nhiều template và cần tên dễ đọc.
        Tránh dùng khi điều kiện chỉ dùng một lần và standard concept ngắn đã diễn đạt chính xác.


