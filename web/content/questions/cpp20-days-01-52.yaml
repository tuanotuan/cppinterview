        và có thể kiểm tra.


        constexpr là làn nhanh có thể phục vụ cả runtime; consteval là cổng chỉ nhận lưu lượng
        compile time. Hãy đọc consteval như lời hứa chính xác; runtime precondition vẫn do lập trình
        viên chịu trách nhiệm.
