    prompt: Vì sao giá trị cuối vẫn xác định sau hai lệnh `join` dù thứ tự các lần tăng không xác định?
    code: "// Day 6: Threads, Atomics, and the C++ Memory Model\r

      #include <atomic>\r

      #include <iostream>\r

      #include <thread>\r

      \r

      int main() {\r

      \    std::atomic<int> counter{0};\r

      \r

