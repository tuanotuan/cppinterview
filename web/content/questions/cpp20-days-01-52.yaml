  - id: cpp20-toolchain-compiler-flags-cpp20-003
    lessonId: cpp20-toolchain-compiler-flags-cpp20
    type: pitfall
    responseMode: text
    difficulty: advanced
    interviewCategory: code_review_debug
    interviewFormat: bug_hunt
    estimatedMinutes: 5
    prompt: Vì sao cùng một mã nguồn có thể cho kết quả biên dịch khác khi chỉ bỏ `-std=c++20`, dù vẫn
      dùng đúng compiler đó?
    hint: Xác định invariant về kiểu, lifetime, ownership, bounds hoặc ordering trước khi đề xuất cách
      sửa nhỏ nhất.
    answer:
      short: Nếu thiếu -std=c++20, compiler có thể từ chối cú pháp hợp lệ hoặc âm thầm dùng chuẩn cũ; bỏ
        qua warning có thể che giấu lỗi thật. Hãy kiểm tra cả header, mức hỗ trợ thư viện C++20,
        lifetime và kiểu được suy luận.
      detailed: >-
        Nếu thiếu -std=c++20, compiler có thể từ chối cú pháp hợp lệ hoặc âm thầm dùng chuẩn cũ; bỏ
        qua warning có thể che giấu lỗi thật. Hãy kiểm tra cả header, mức hỗ trợ thư viện C++20,
        lifetime và kiểu được suy luận.


        Nên dùng khi bạn biên dịch bài học, thử một tính năng hoặc cần chẩn đoán có thể lặp lại.
        Tránh dùng khi bạn chỉ chạy một tệp thực thi đã được biên dịch sẵn.


        -std=c++20 diễn đạt ý tưởng C++20 trung tâm của ngày này. Ví dụ cô lập một hành vi bằng dữ
        liệu cố định. Compiler check không thay thế suy luận về lifetime và runtime. Ưu tiên
        interface nhỏ nhất nói đúng yêu cầu thật.
    rubric:
      required:
        - Chỉ ra chính xác quy tắc C++20 hoặc invariant có liên quan.
        - Giải thích hậu quả quan sát được, lỗi compile hoặc undefined behavior nếu có.
        - Đề xuất xử lý nhỏ nhất loại bỏ nguyên nhân thay vì che triệu chứng.
      bonus:
        - Nêu được trade-off của cách xử lý đối với API, lifetime hoặc hiệu năng.
      misconceptions:
        - Cho rằng chương trình an toàn chỉ vì có thể compile hoặc chạy một lần.
    sources:
