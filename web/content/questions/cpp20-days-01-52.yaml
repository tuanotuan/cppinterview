        C++20, lifetime và kiểu được suy luận.
      detailed: >-
        Dùng if thường không ngăn compiler kiểm tra kiểu ở cả hai nhánh, nên phép toán sai trong
        nhánh không chạy vẫn có thể gây lỗi biên dịch. Hãy kiểm tra cả header, mức hỗ trợ thư viện
        C++20, lifetime và kiểu được suy luận.


