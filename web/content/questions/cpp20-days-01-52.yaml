      \        buffer.data(), buffer.size(), std::pmr::null_memory_resource()};\r

      \    std::pmr::vector<int> values{&arena};\r

      \r

      \    values.reserve(100); // Allocate before the measured hot path.\r

      \    for (int i = 0; i < 100; ++i) values.push_back(i);\r

      \r

