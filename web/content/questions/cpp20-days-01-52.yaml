    answer:
      short: Awaiter định nghĩa coroutine có suspend không, điều gì xảy ra tại suspension và giá
        trị/effect nào xuất hiện khi resume. Nó làm một giả định quan trọng trở nên rõ và có thể
        kiểm tra.
      detailed: >-
        Awaiter định nghĩa coroutine có suspend không, điều gì xảy ra tại suspension và giá
        trị/effect nào xuất hiện khi resume. Nó làm một giả định quan trọng trở nên rõ và có thể
        kiểm tra.


        Ba hook tạo checkpoint: await_ready có thể bỏ qua, await_suspend đỗ hoặc chuyển control,
        await_resume cung cấp result cho continuation. Hãy đọc await_suspend như lời hứa chính xác;
        runtime precondition vẫn do lập trình viên chịu trách nhiệm.
    rubric:
