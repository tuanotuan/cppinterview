questions:
  - id: cpp20-toolchain-compiler-flags-cpp20-001
    lessonId: cpp20-toolchain-compiler-flags-cpp20
    type: recall
    responseMode: text
    difficulty: beginner
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: Nhiệm vụ chính của `-std=c++20` trong ví dụ tối thiểu là gì?
    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu contract mà tính năng C++20 làm rõ.
    answer:
      short: Toolchain biến mã nguồn thành chương trình chạy được, còn các cờ compiler chọn bộ quy tắc
        ngôn ngữ, mức cảnh báo và tên tệp đầu ra. Nó làm một giả định quan trọng trở nên rõ và có
        thể kiểm tra.
      detailed: >-
        Toolchain biến mã nguồn thành chương trình chạy được, còn các cờ compiler chọn bộ quy tắc
        ngôn ngữ, mức cảnh báo và tên tệp đầu ra. Nó làm một giả định quan trọng trở nên rõ và có
        thể kiểm tra.


        Hãy hình dung một dây chuyền: mã nguồn được dịch, kiểm tra theo luật C++20, liên kết rồi mới
        chạy. Cờ biên dịch là chỉ dẫn gắn vào dây chuyền đó. Hãy đọc -std=c++20 như lời hứa chính
        xác; runtime precondition vẫn do lập trình viên chịu trách nhiệm.
    rubric:
      required:
        - Nêu đúng vấn đề mà chủ đề giải quyết.
        - Mô tả đúng cơ chế hoặc contract C++20 liên quan.
        - Không nhầm tính năng C++20 với hành vi phụ thuộc compiler.
      bonus:
        - Liên hệ được tác động compile time với hành vi quan sát được lúc chạy.
      misconceptions:
        - Chỉ nhắc tên tính năng mà không giải thích mục đích hoặc ràng buộc.
