  - id: cpp20-generic-lambda-variadic-templates-callables-001
    lessonId: cpp20-generic-lambda-variadic-templates-callables
    type: recall
    responseMode: text
    difficulty: beginner
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: Nhiệm vụ chính của `auto...` trong ví dụ tối thiểu là gì?
    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu contract mà tính năng C++20 làm rõ.
    answer:
      short: Callable cho phép thuật toán nhận hành vi như dữ liệu; dạng generic và variadic giúp một
        callable xử lý nhiều kiểu hoặc số lượng đối số khác nhau. Nó làm một giả định quan trọng trở
        nên rõ và có thể kiểm tra.
      detailed: >-
        Callable cho phép thuật toán nhận hành vi như dữ liệu; dạng generic và variadic giúp một
        callable xử lý nhiều kiểu hoặc số lượng đối số khác nhau. Nó làm một giả định quan trọng trở
        nên rõ và có thể kiểm tra.


        Hãy xem lambda như một object hàm nhỏ không tên. Mỗi tham số auto được suy luận kiểu, còn
        parameter pack là túi đối số được bung tại dấu .... Hãy đọc auto... như lời hứa chính xác;
        runtime precondition vẫn do lập trình viên chịu trách nhiệm.
    rubric:
      required:
