        comparison category phù hợp. Hãy kiểm tra cả header, mức hỗ trợ thư viện C++20, lifetime và
        kiểu được suy luận.
      detailed: >-
        Truyền cặp iterator không hợp lệ gây undefined behavior; custom comparator cũng phải trả
        comparison category phù hợp. Hãy kiểm tra cả header, mức hỗ trợ thư viện C++20, lifetime và
        kiểu được suy luận.


        Nên dùng khi hai dãy cần một category result phân biệt nhỏ hơn, bằng và lớn hơn. Tránh dùng
        khi caller chỉ cần kiểm tra bằng nhau hoặc Boolean lexicographical nhỏ hơn.


        std::lexicographical_compare_three_way diễn đạt ý tưởng C++20 trung tâm của ngày này. Ví dụ
        cô lập một hành vi bằng dữ liệu cố định. Compiler check không thay thế suy luận về lifetime
        và runtime. Ưu tiên interface nhỏ nhất nói đúng yêu cầu thật.
    rubric:
      required:
        - Chỉ ra chính xác quy tắc C++20 hoặc invariant có liên quan.
        - Giải thích hậu quả quan sát được, lỗi compile hoặc undefined behavior nếu có.
        - Đề xuất xử lý nhỏ nhất loại bỏ nguyên nhân thay vì che triệu chứng.
      bonus:
