  - id: cpp20-toolchain-compiler-flags-cpp20-002
    lessonId: cpp20-toolchain-compiler-flags-cpp20
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Nếu `__cplusplus` nhỏ hơn `202002`, bạn cần kiểm tra phần nào của lệnh biên dịch?
    code: "// Day 1: Toolchain, Compiler Flags, and C++20 Mode\r

      #include <iostream>\r

      \r

      int main() {\r

      \    std::cout << \"__cplusplus = \" << __cplusplus << '\\n';\r

      \r

      #if __cplusplus >= 202002L\r

      \    std::cout << \"C++20 mode active\\n\";\r

      #else\r

      \    std::cout << \"C++20 mode not active\\n\";\r

      #endif\r

      }\r\n"
    hint: Lần theo dữ liệu cố định trong mã mẫu, rồi gắn kết quả với từng quy tắc C++20 liên quan.
    answer:
      short: Chương trình đưa vào dạng nhỏ nhất cần thiết của -std=c++20. Nó áp dụng tính năng lên dữ liệu
        cố định và giữ owner cần thiết trong scope. Nó in một kết quả để đối chiếu trực tiếp với
        source.
      detailed: >-
        Hãy hình dung một dây chuyền: mã nguồn được dịch, kiểm tra theo luật C++20, liên kết rồi mới
        chạy. Cờ biên dịch là chỉ dẫn gắn vào dây chuyền đó. Hãy đọc -std=c++20 như lời hứa chính
        xác; runtime precondition vẫn do lập trình viên chịu trách nhiệm.


        Chương trình đưa vào dạng nhỏ nhất cần thiết của -std=c++20. Nó áp dụng tính năng lên dữ
        liệu cố định và giữ owner cần thiết trong scope. Nó in một kết quả để đối chiếu trực tiếp
        với source.


        Chương trình in __cplusplus và xác nhận compiler có đang dùng C++20 trở lên hay không. Tệp
        .cpp không nhận input nên kết quả dễ lặp lại.
    rubric:
      required:
        - Nêu đúng giá trị, kiểu hoặc trạng thái mà ví dụ tạo ra.
        - Gắn từng kết quả với câu lệnh và quy tắc C++20 tương ứng.
        - Không suy đoán thêm input hoặc trạng thái ngoài mã mẫu.
      bonus:
        - Nêu được hệ quả liên quan đến kiểu, lifetime, ownership hoặc ordering.
      misconceptions:
        - Đoán kết quả mà không lần theo dữ liệu và quy tắc trong mã.
