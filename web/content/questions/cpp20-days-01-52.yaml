    lessonId: cpp20-standard-concepts-library
    type: recall
    responseMode: text
    difficulty: beginner
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: Nhiệm vụ chính của `std::integral` trong ví dụ tối thiểu là gì?
    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu contract mà tính năng C++20 làm rõ.
    answer:
      short: Thư viện chuẩn cung cấp các vocabulary concept phổ biến để interface generic diễn đạt quan hệ
        kiểu một cách nhất quán. Nó làm một giả định quan trọng trở nên rõ và có thể kiểm tra.
      detailed: >-
        Thư viện chuẩn cung cấp các vocabulary concept phổ biến để interface generic diễn đạt quan
        hệ kiểu một cách nhất quán. Nó làm một giả định quan trọng trở nên rõ và có thể kiểm tra.


        Hãy dùng standard concept như nhãn chung trên cửa thư viện. Người đọc và compiler đã thống
        nhất ý nghĩa của integral, same_as hay invocable. Hãy đọc std::integral như lời hứa chính
        xác; runtime precondition vẫn do lập trình viên chịu trách nhiệm.
