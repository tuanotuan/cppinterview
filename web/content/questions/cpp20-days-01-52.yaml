    answer:
      short: Đọc quá span là sai; cast byte pointer không aligned sang integer pointer có thể vi phạm
        alignment và aliasing; native endian không phải wire endian. Hãy kiểm tra cả header, mức hỗ
        trợ thư viện C++20, lifetime và kiểu được suy luận.
