        viện C++20, lifetime và kiểu được suy luận.
      detailed: >-
        Hai truy cập xung đột không đồng bộ vào object không atomic tạo data race và undefined
        behavior, chứ không chỉ thỉnh thoảng cho tổng sai. Hãy kiểm tra cả header, mức hỗ trợ thư
        viện C++20, lifetime và kiểu được suy luận.


        Nên dùng khi nhiều thread chia sẻ một giá trị nhỏ, độc lập như bộ đếm hoặc cờ. Tránh dùng
