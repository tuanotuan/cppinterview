      \        std::suspend_always final_suspend() noexcept { return {}; }\r

      \        void return_value(int value) noexcept { result = value; }\r

      \        void unhandled_exception() { std::terminate(); }\r

      \    };\r

      \    Handle handle{};\r

      \    explicit Task(Handle value) : handle{value} {}\r

      \    Task(Task&& other) noexcept : handle{std::exchange(other.handle, {})} {}\r

      \    Task(const Task&) = delete;\r

      \    ~Task() { if (handle) handle.destroy(); }\r

      \    void resume() { handle.resume(); }\r

      \    bool done() const { return handle.done(); }\r

      \    int value() const { if (!done()) throw std::logic_error(\"not ready\"); return
      handle.promise().result; }\r

      };\r

      \r

      Task async_value() {\r

      \    co_await std::suspend_always{}; // Educational scheduling boundary.\r

      \    co_return 42;\r

      }\r

      \r

      int main() {\r

