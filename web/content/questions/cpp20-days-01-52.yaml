    code: "// Day 19: Three-Way Comparison and Comparison Categories\r

      #include <compare>\r

      #include <iostream>\r

      #include <type_traits>\r

      \r

      struct Measurement {\r

      \    double value{};\r

      \    auto operator<=>(const Measurement&) const = default;\r

      };\r

      \r

      int main() {\r

      \    Measurement first{2.5};\r

      \    Measurement second{3.0};\r

      \    using Order = decltype(first <=> second);\r

      \r

