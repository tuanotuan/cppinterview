        cố định và giữ owner cần thiết trong scope. Nó in một kết quả để đối chiếu trực tiếp với
        source.
      detailed: >-
        Owner giống như ngôi nhà, còn view chỉ là địa chỉ. RAII dọn tài nguyên khi owner ra khỏi
