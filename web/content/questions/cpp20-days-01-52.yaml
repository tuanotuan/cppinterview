    prompt: Sau khi span sửa phần tử đầu, vector in giá trị nào và vì sao?
    code: "// Day 2: Lifetime, RAII, Ownership, and Non-Owning Views\r

      #include <iostream>\r

      #include <span>\r

      #include <vector>\r

      \r

      int main() {\r

      \    std::vector<int> owner{10, 20, 30}; // Owns the elements.\r

      \    std::span<int> view{owner};         // Borrows the elements.\r

      \r

      \    view.front() = 99;\r

      \r

      \    std::cout << \"owner[0] = \" << owner[0] << '\\n';\r

      \    std::cout << \"view size = \" << view.size() << '\\n';\r

      }\r\n"
    hint: Lần theo dữ liệu cố định trong mã mẫu, rồi gắn kết quả với từng quy tắc C++20 liên quan.
