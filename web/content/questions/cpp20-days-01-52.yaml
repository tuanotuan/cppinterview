    hint: Xác định invariant về kiểu, lifetime, ownership, bounds hoặc ordering trước khi đề xuất cách
      sửa nhỏ nhất.
    answer:
      short: Macro và giả định include-order không đi qua module boundary như declaration thường; hỗ trợ
        compiler và lệnh build cũng khác nhau. Hãy kiểm tra cả header, mức hỗ trợ thư viện C++20,
        lifetime và kiểu được suy luận.
      detailed: >-
        Macro và giả định include-order không đi qua module boundary như declaration thường; hỗ trợ
        compiler và lệnh build cũng khác nhau. Hãy kiểm tra cả header, mức hỗ trợ thư viện C++20,
        lifetime và kiểu được suy luận.


        Nên dùng khi build system hỗ trợ header unit rõ ràng và migration đã đo đạc giúp giảm parse
        lặp. Tránh dùng khi khả năng build portable hoặc hành vi legacy phụ thuộc macro chưa được
        kiểm soát.


