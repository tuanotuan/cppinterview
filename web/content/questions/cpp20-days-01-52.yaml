  - id: cpp20-view-pipelines-borrowed-dangling-002
    lessonId: cpp20-view-pipelines-borrowed-dangling
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Vì sao `std::span<int>` là borrowed range còn `std::vector<int>` thì không?
    code: "// Day 32: View Pipelines, Borrowed Ranges, and Dangling Views\r

      #include <iostream>\r

      #include <ranges>\r

      #include <span>\r

      #include <vector>\r

      \r

      int main() {\r

      \    static_assert(std::ranges::borrowed_range<std::span<int>>);\r

      \    static_assert(!std::ranges::borrowed_range<std::vector<int>>);\r

      \r

      \    std::vector values{1, 2, 3, 4, 5}; // Named owner stays alive.\r

      \    auto pipeline = values\r

      \        | std::views::filter([](int x) { return x % 2 != 0; })\r

      \        | std::views::transform([](int x) { return x * 10; });\r

      \r

      \    for (int value : pipeline) {\r

