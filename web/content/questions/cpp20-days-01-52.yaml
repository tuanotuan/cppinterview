        cố định. Compiler check không thay thế suy luận về lifetime và runtime. Ưu tiên interface
        nhỏ nhất nói đúng yêu cầu thật.
    rubric:
      required:
        - Chỉ ra chính xác quy tắc C++20 hoặc invariant có liên quan.
