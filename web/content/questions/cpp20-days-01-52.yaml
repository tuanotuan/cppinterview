    prompt: Caller lấy lại quyền điều khiển ở statement nào sau khi yêu cầu generated value đầu?
    code: "// Day 44: Coroutine Model: co_await, co_yield, and co_return\r

      #include <coroutine>\r

      #include <exception>\r

      #include <iostream>\r

      #include <utility>\r

      \r

      struct Generator {\r

      \    struct promise_type;\r

      \    using Handle = std::coroutine_handle<promise_type>;\r

      \r

      \    struct promise_type {\r

      \        int current{};\r

      \        Generator get_return_object() { return Generator{Handle::from_promise(*this)}; }\r

      \        std::suspend_always initial_suspend() noexcept { return {}; }\r

      \        std::suspend_always final_suspend() noexcept { return {}; }\r

      \        std::suspend_always yield_value(int value) noexcept { current = value; return {}; }\r

      \        void return_void() noexcept {}\r

      \        void unhandled_exception() { std::terminate(); }\r

      \    };\r

      \r

      \    Handle handle{};\r

      \    explicit Generator(Handle value) : handle{value} {}\r

      \    Generator(Generator&& other) noexcept : handle{std::exchange(other.handle, {})} {}\r

      \    Generator(const Generator&) = delete;\r

      \    ~Generator() { if (handle) handle.destroy(); }\r

      \r

      \    bool next() { handle.resume(); return !handle.done(); }\r

      \    int value() const { return handle.promise().current; }\r

      };\r

      \r

      Generator sequence() {\r

      \    co_await std::suspend_never{};\r

      \    co_yield 1;\r

      \    co_yield 2;\r

      \    co_return;\r

      }\r

      \r

      int main() {\r

      \    auto values = sequence();\r

      \    while (values.next()) std::cout << values.value() << ' ';\r

      \    std::cout << '\\n';\r

      }\r\n"
    hint: Lần theo dữ liệu cố định trong mã mẫu, rồi gắn kết quả với từng quy tắc C++20 liên quan.
