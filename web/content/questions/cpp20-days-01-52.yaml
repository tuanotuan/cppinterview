  - id: cpp20-lifetime-raii-ownership-views-001
    lessonId: cpp20-lifetime-raii-ownership-views
    type: recall
    responseMode: text
    difficulty: beginner
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: Nhiệm vụ chính của `std::span` trong ví dụ tối thiểu là gì?
    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu contract mà tính năng C++20 làm rõ.
    answer:
      short: Các khái niệm này trả lời ai sở hữu tài nguyên, tài nguyên sống bao lâu và đoạn mã khác được
        quan sát nó thế nào mà không nhận quyền sở hữu. Nó làm một giả định quan trọng trở nên rõ và
        có thể kiểm tra.
      detailed: >-
        Các khái niệm này trả lời ai sở hữu tài nguyên, tài nguyên sống bao lâu và đoạn mã khác được
        quan sát nó thế nào mà không nhận quyền sở hữu. Nó làm một giả định quan trọng trở nên rõ và
        có thể kiểm tra.


        Owner giống như ngôi nhà, còn view chỉ là địa chỉ. RAII dọn tài nguyên khi owner ra khỏi
        scope, nhưng địa chỉ không còn hữu ích sau khi ngôi nhà biến mất. Hãy đọc std::span như lời
        hứa chính xác; runtime precondition vẫn do lập trình viên chịu trách nhiệm.
    rubric:
      required:
        - Nêu đúng vấn đề mà chủ đề giải quyết.
        - Mô tả đúng cơ chế hoặc contract C++20 liên quan.
        - Không nhầm tính năng C++20 với hành vi phụ thuộc compiler.
      bonus:
        - Liên hệ được tác động compile time với hành vi quan sát được lúc chạy.
      misconceptions:
        - Chỉ nhắc tên tính năng mà không giải thích mục đích hoặc ràng buộc.
