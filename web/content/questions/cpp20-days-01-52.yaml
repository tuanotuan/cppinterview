    code: "// Day 42: Latch and Reusable Barrier\r

      #include <atomic>\r

      #include <barrier>\r

      #include <iostream>\r

      #include <latch>\r

      #include <thread>\r

      \r

      int main() {\r

      \    std::atomic<int> sum{0};\r

      \    std::latch done{2};\r

      \    std::jthread first{[&] { sum.fetch_add(1); done.count_down(); }};\r

      \    std::jthread second{[&] { sum.fetch_add(2); done.count_down(); }};\r

      \    done.wait();\r

      \r

      \    int phases = 0;\r

      \    {\r

