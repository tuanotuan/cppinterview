      \    using value_type = int;\r

      \    int value{};\r

      };\r

      \r

      Number operator+(Number a, Number b) {\r

      \    return {a.value + b.value};\r

      }\r

      \r

      template<class T>\r

      concept SmallAddable = requires(T a, T b) {\r

      \    typename T::value_type;              // Type requirement\r

      \    a + b;                               // Simple requirement\r

      \    { a + b } -> std::same_as<T>;        // Compound requirement\r

      \    requires (sizeof(T) <= 8);           // Nested requirement\r

      };\r

      \r

      int main() {\r

      \    std::cout << std::boolalpha << SmallAddable<Number> << '\\n';\r

      }\r\n"
