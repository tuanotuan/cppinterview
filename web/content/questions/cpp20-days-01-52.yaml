    answer:
      short: Initializer của range-for C++20 tạo trạng thái chuẩn bị có tên và lifetime bao trùm toàn bộ
        vòng lặp. Nó làm một giả định quan trọng trở nên rõ và có thể kiểm tra.
      detailed: >-
        Initializer của range-for C++20 tạo trạng thái chuẩn bị có tên và lifetime bao trùm toàn bộ
        vòng lặp. Nó làm một giả định quan trọng trở nên rõ và có thể kiểm tra.


        Initializer giống phòng chờ nhỏ trước loop: object tạo tại đó sống trong khi mọi iteration
        dùng range expression. Hãy đọc for (init; declaration : range) như lời hứa chính xác;
        runtime precondition vẫn do lập trình viên chịu trách nhiệm.
