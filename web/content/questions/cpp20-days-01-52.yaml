        hoặc được giữ ở runtime. Nó làm một giả định quan trọng trở nên rõ và có thể kiểm tra.
      detailed: >-
        std::span truyền dãy phần tử liên tục mà không copy hay sở hữu, với kích thước nằm trong
        kiểu hoặc được giữ ở runtime. Nó làm một giả định quan trọng trở nên rõ và có thể kiểm tra.


        Span là cửa sổ nhìn vào storage có sẵn. Static extent khắc kích thước vào type; dynamic
