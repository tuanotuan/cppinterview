      \r

      void classify(Integer auto) {\r

      \    std::cout << \"integer\\n\";\r

      }\r

      \r

      void classify(SignedInteger auto) {\r

      \    std::cout << \"signed integer\\n\";\r

      }\r

      \r

      int main() {\r

      \    classify(1);\r

      \    classify(1u);\r

      }\r\n"
