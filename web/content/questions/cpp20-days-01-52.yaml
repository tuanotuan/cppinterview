    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: Nhiệm vụ chính của `std::jthread` trong ví dụ tối thiểu là gì?
    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu contract mà tính năng C++20 làm rõ.
    answer:
      short: std::jthread sở hữu thread với RAII joining và có thể truyền cooperative stop token cho
        worker. Nó làm một giả định quan trọng trở nên rõ và có thể kiểm tra.
      detailed: >-
        std::jthread sở hữu thread với RAII joining và có thể truyền cooperative stop token cho
        worker. Nó làm một giả định quan trọng trở nên rõ và có thể kiểm tra.


        Nó là worker theo scope: ra khỏi scope thực hiện cleanup và join; token là biển dừng lịch sự
        mà worker chủ động quan sát. Hãy đọc std::jthread như lời hứa chính xác; runtime
        precondition vẫn do lập trình viên chịu trách nhiệm.
