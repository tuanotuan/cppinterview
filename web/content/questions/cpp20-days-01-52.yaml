  - id: cpp20-binary-parsing-span-byte-bit-cast-endian-002
    lessonId: cpp20-binary-parsing-span-byte-bit-cast-endian
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Giá trị hexadecimal nào được parse từ byte `78 56 34 12` theo little-endian?
    code: "// Day 52: Binary Parsing with span, byte, bit_cast, and Endian\r

      #include <array>\r

      #include <bit>\r

      #include <cstddef>\r

      #include <cstdint>\r

      #include <iomanip>\r

      #include <iostream>\r

      #include <span>\r

      \r

      constexpr std::uint32_t swap32(std::uint32_t value) {\r

      \    return ((value & 0x000000FFu) << 24)\r

      \         | ((value & 0x0000FF00u) << 8)\r

      \         | ((value & 0x00FF0000u) >> 8)\r

      \         | ((value & 0xFF000000u) >> 24);\r

      }\r

      \r

      int main() {\r

      \    std::array raw{\r

      \        std::byte{0x78}, std::byte{0x56},\r

      \        std::byte{0x34}, std::byte{0x12}};\r

      \    std::span<const std::byte> packet{raw};\r

      \r

      \    std::array<std::byte, 4> field{};\r

      \    for (std::size_t i = 0; i < field.size(); ++i) field[i] = packet[i];\r

      \    std::uint32_t value = std::bit_cast<std::uint32_t>(field);\r

      \r

      \    if constexpr (std::endian::native == std::endian::big) {\r

      \        value = swap32(value);\r

      \    } else if constexpr (std::endian::native != std::endian::little) {\r

      \        value = std::to_integer<std::uint32_t>(field[0])\r

      \              | (std::to_integer<std::uint32_t>(field[1]) << 8)\r

      \              | (std::to_integer<std::uint32_t>(field[2]) << 16)\r

      \              | (std::to_integer<std::uint32_t>(field[3]) << 24);\r

      \    }\r

      \r

      \    std::cout << \"value = 0x\" << std::hex << value << '\\n';\r

      }\r\n"
    hint: Lần theo dữ liệu cố định trong mã mẫu, rồi gắn kết quả với từng quy tắc C++20 liên quan.
    answer:
      short: Chương trình đưa vào dạng nhỏ nhất cần thiết của std::span<const std::byte>. Nó áp dụng tính
        năng lên dữ liệu cố định và giữ owner cần thiết trong scope. Nó in một kết quả để đối chiếu
        trực tiếp với source.
      detailed: >-
        Span là biên packet, std::byte nói “raw data”, bit_cast dựng representation cùng size, còn
        endian logic dịch wire order. Hãy đọc std::span<const std::byte> như lời hứa chính xác;
        runtime precondition vẫn do lập trình viên chịu trách nhiệm.


