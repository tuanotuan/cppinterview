  - id: cpp20-three-way-comparison-categories-003
    lessonId: cpp20-three-way-comparison-categories
    type: pitfall
    responseMode: text
    difficulty: advanced
    interviewCategory: code_review_debug
    interviewFormat: bug_hunt
    estimatedMinutes: 5
    prompt: Vì sao comparison mặc định chứa `double` thường không suy luận thành `std::strong_ordering`?
    hint: Xác định invariant về kiểu, lifetime, ownership, bounds hoặc ordering trước khi đề xuất cách
      sửa nhỏ nhất.
    answer:
      short: Member số thực thường tạo std::partial_ordering vì NaN có thể unordered; giả định strong
        ordering có thể phá kỳ vọng của sorted container. Hãy kiểm tra cả header, mức hỗ trợ thư
        viện C++20, lifetime và kiểu được suy luận.
      detailed: >-
        Member số thực thường tạo std::partial_ordering vì NaN có thể unordered; giả định strong
        ordering có thể phá kỳ vọng của sorted container. Hãy kiểm tra cả header, mức hỗ trợ thư
        viện C++20, lifetime và kiểu được suy luận.


        Nên dùng khi kiểu có thứ tự nhất quán và cần sinh các phép quan hệ đồng bộ. Tránh dùng khi
        miền bài toán không có thứ tự toàn phần hoặc bán phần có ý nghĩa.


        operator<=> diễn đạt ý tưởng C++20 trung tâm của ngày này. Ví dụ cô lập một hành vi bằng dữ
        liệu cố định. Compiler check không thay thế suy luận về lifetime và runtime. Ưu tiên
        interface nhỏ nhất nói đúng yêu cầu thật.
    rubric:
      required:
        - Chỉ ra chính xác quy tắc C++20 hoặc invariant có liên quan.
        - Giải thích hậu quả quan sát được, lỗi compile hoặc undefined behavior nếu có.
        - Đề xuất xử lý nhỏ nhất loại bỏ nguyên nhân thay vì che triệu chứng.
      bonus:
        - Nêu được trade-off của cách xử lý đối với API, lifetime hoặc hiệu năng.
      misconceptions:
        - Cho rằng chương trình an toàn chỉ vì có thể compile hoặc chạy một lần.
