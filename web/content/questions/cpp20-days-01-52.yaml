    prompt: Future nào sở hữu từng intermediate result trước khi stage tiếp theo gọi `get`?
    code: "// Day 43: Designing a Concurrent Data Pipeline\r

      #include <future>\r

      #include <iostream>\r

      #include <numeric>\r

      #include <utility>\r

      #include <vector>\r

      \r

      int main() {\r

      \    auto produced = std::async(std::launch::async, [] {\r

      \        return std::vector<int>{1, 2, 3, 4};\r

      \    });\r

      \r

      \    auto transformed = std::async(std::launch::async,\r

      \        [input = std::move(produced)]() mutable {\r

      \            auto values = input.get();\r

      \            for (int& value : values) {\r

      \                value *= 2;\r

      \            }\r

      \            return values;\r

      \        });\r

      \r

      \    auto reduced = std::async(std::launch::async,\r

      \        [input = std::move(transformed)]() mutable {\r

      \            auto values = input.get();\r

      \            return std::accumulate(values.begin(), values.end(), 0);\r

      \        });\r

      \r

      \    std::cout << \"pipeline sum = \" << reduced.get() << '\\n';\r

      }\r\n"
