    prompt: Multiple inheritance là gì và có thể gây ra vấn đề nào?
    hint: Nêu kết luận trước, sau đó chỉ ra quy tắc C++ và điều kiện khiến kết luận đó đúng.
    answer:
      short: Multiple inheritance cho phép một class dẫn xuất từ nhiều base. Nó có thể gây ambiguous
        member lookup, nhân đôi base subobject trong diamond, làm phức tạp thứ tự construction và
        tăng coupling; virtual inheritance giúp diamond dùng chung một virtual base nhưng cũng thêm
        độ phức tạp. Multiple inheritance phù hợp nhất với các interface nhỏ, trực giao, còn
        composition thường rõ hơn khi kết hợp implementation có state.
