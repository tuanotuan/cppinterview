    answer:
      short: Có. Template, CRTP, concept và discriminated union như `std::variant` có thể cung cấp static
        hoặc closed-set polymorphism mà không cần virtual dispatch. Đổi lại là coupling ở compile
        time, code size và khả năng mở rộng runtime thấp hơn.
      detailed: >-
        Có. Template, CRTP, concept và discriminated union như `std::variant` có thể cung cấp static
        hoặc closed-set polymorphism mà không cần virtual dispatch. Đổi lại là coupling ở compile
        time, code size và khả năng mở rộng runtime thấp hơn.


