    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Khi nào nên dùng `decltype(auto)`?
    hint: Nêu kết luận trước, sau đó chỉ ra quy tắc C++ và điều kiện khiến kết luận đó đúng.
    answer:
      short: Dùng `decltype(auto)` khi khai báo hoặc kiểu trả về suy luận phải giữ chính xác kết quả của
        `decltype(expression)`, kể cả reference. Nó hữu ích cho forwarding accessor nhưng cũng có
        thể vô tình trả dangling reference.
      detailed: >-
        Dùng `decltype(auto)` khi khai báo hoặc kiểu trả về suy luận phải giữ chính xác kết quả của
        `decltype(expression)`, kể cả reference. Nó hữu ích cho forwarding accessor nhưng cũng có
        thể vô tình trả dangling reference.


        Hãy liên hệ trực tiếp kết luận với kiểu, lifetime, ownership, overload resolution hoặc
        library contract xuất hiện trong câu hỏi. Nếu kết quả phụ thuộc implementation hoặc vi phạm
