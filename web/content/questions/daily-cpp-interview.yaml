        function khác, và lambda không capture có thể chuyển sang function pointer tương thích.
        Pointer tới non-static member function có kiểu khác và cần một object; `std::function` hỗ
        trợ type erasure cùng callable có state nhưng có overhead lớn hơn raw function pointer.


