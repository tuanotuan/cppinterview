      short: Scalar nhỏ và kiểu giá trị rẻ nên thường được truyền theo giá trị; reference có thể chiếm
        kích thước tương đương nhưng thêm indirection và aliasing. Dùng const reference khi việc
        copy thực sự đắt hoặc identity quan trọng.
      detailed: >-
        Scalar nhỏ và kiểu giá trị rẻ nên thường được truyền theo giá trị; reference có thể chiếm
        kích thước tương đương nhưng thêm indirection và aliasing. Dùng const reference khi việc
        copy thực sự đắt hoặc identity quan trọng.


