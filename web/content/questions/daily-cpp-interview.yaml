  - id: dailycpp-q028-001
    lessonId: dailycpp-q028
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Đoạn mã sau in gì và vì sao?
    code: |-
      #include <iostream>

      class A {
      public:
          int value() { return 1; }
          int value() const { return 2; }
      };

      int main() {
          A a;
          const auto b = a.value();
          std::cout << b << '\n';
      }
    hint: Nêu kết luận trước, sau đó chỉ ra quy tắc C++ và điều kiện khiến kết luận đó đúng.
    answer:
      short: Kết quả là `1`. Overload resolution dựa trên cv-qualification của object `a`; vì `a` không
        const nên hàm member non-const được gọi. `const` trên biến kết quả `b` không ảnh hưởng lời
        gọi đã xảy ra.
      detailed: >-
        Kết quả là `1`. Overload resolution dựa trên cv-qualification của object `a`; vì `a` không
        const nên hàm member non-const được gọi. `const` trên biến kết quả `b` không ảnh hưởng lời
        gọi đã xảy ra.


        Hãy liên hệ trực tiếp kết luận với kiểu, lifetime, ownership, overload resolution hoặc
        library contract xuất hiện trong câu hỏi. Nếu kết quả phụ thuộc implementation hoặc vi phạm
        precondition, cần nói rõ thay vì chỉ đoán output.
