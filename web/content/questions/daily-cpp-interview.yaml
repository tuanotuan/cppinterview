    estimatedMinutes: 4
    prompt: "`this` pointer là gì và được dùng như thế nào?"
    hint: Nêu kết luận trước, sau đó chỉ ra quy tắc C++ và điều kiện khiến kết luận đó đúng.
    answer:
      short: Bên trong non-static member function, `this` trỏ tới object mà function được gọi trên đó;
        pointee của nó là const trong member function được const-qualify. Nó thường dùng để phân
        biệt member với parameter trùng tên, truyền object hiện tại hoặc trả `*this` để chaining.
        Static member function không có `this`, còn `delete this` chỉ hợp lệ trong contract
        ownership rất hiếm và khó bảo đảm an toàn nên thông thường cần tránh.
