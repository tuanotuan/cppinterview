    answer:
      short: "`T&&` chỉ là forwarding reference khi `T` không có cv-qualifier và được suy luận trong ngữ
        cảnh đó (hoặc dạng `auto&&` tương ứng). Trường hợp khác, nó là rvalue reference thường chỉ
        bind rvalue; khác biệt này chi phối reference collapsing và forwarding."
      detailed: >-
        `T&&` chỉ là forwarding reference khi `T` không có cv-qualifier và được suy luận trong ngữ
        cảnh đó (hoặc dạng `auto&&` tương ứng). Trường hợp khác, nó là rvalue reference thường chỉ
        bind rvalue; khác biệt này chi phối reference collapsing và forwarding.


        Hãy liên hệ trực tiếp kết luận với kiểu, lifetime, ownership, overload resolution hoặc
        library contract xuất hiện trong câu hỏi. Nếu kết quả phụ thuộc implementation hoặc vi phạm
