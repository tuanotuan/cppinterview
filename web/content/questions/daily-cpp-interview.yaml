    estimatedMinutes: 6
    prompt: Standard Template Library (STL) là gì? Hãy kể tên một số container thường dùng.
    hint: Nêu kết luận trước, sau đó chỉ ra quy tắc C++ và điều kiện khiến kết luận đó đúng.
    answer:
      short: STL là nền tảng generic programming của thư viện chuẩn C++, xoay quanh container, iterator,
        algorithm và function object. Sequence container phổ biến gồm `vector`, `array`, `deque`,
        `list`, `forward_list`; associative container có thứ tự gồm `map`, `set`; biến thể unordered
        dựa trên hash; adaptor gồm `stack`, `queue`, `priority_queue`. Cần chọn container theo
        access pattern, quy tắc invalidation, ordering và yêu cầu độ phức tạp thay vì theo thói
        quen.
