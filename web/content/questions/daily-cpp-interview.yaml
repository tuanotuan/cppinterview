    answer:
      short: Function overloading khai báo nhiều function cùng tên trong cùng scope nhưng khác danh sách
        parameter hoặc, với member function, khác cv/ref qualifier phù hợp. Overload resolution chọn
        candidate khả dụng tốt nhất ở compile time dựa trên kiểu argument và conversion. Chỉ khác
        return type không đủ tạo overload, còn conversion hay default argument có thể làm lời gọi bị
        ambiguous.
