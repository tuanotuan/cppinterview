  - id: dailycpp-q163-001
    lessonId: dailycpp-q163
    type: recall
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Static data member và data member thông thường khác nhau như thế nào?
    hint: Nêu kết luận trước, sau đó chỉ ra quy tắc C++ và điều kiện khiến kết luận đó đúng.
    answer:
      short: Mỗi object chứa bản riêng của non-static data member, còn static data member thuộc về class
        và được chia sẻ giữa mọi object. Static member có static storage duration và có thể tồn tại
        khi chưa có instance; từ C++17 có thể định nghĩa nó bằng `inline static` ngay trong class.
        Static member function không có `this` pointer và chỉ truy cập trực tiếp static member, còn
        non-static member function làm việc trên một object cụ thể.
      detailed: >-
        Mỗi object chứa bản riêng của non-static data member, còn static data member thuộc về class
        và được chia sẻ giữa mọi object. Static member có static storage duration và có thể tồn tại
        khi chưa có instance; từ C++17 có thể định nghĩa nó bằng `inline static` ngay trong class.
        Static member function không có `this` pointer và chỉ truy cập trực tiếp static member, còn
        non-static member function làm việc trên một object cụ thể.


