  - id: dailycpp-q160-001
    lessonId: dailycpp-q160
    type: recall
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Abstract class và interface trong C++ khác nhau thế nào? Làm sao triển khai hành vi giống
      interface?
    hint: Nêu kết luận trước, sau đó chỉ ra quy tắc C++ và điều kiện khiến kết luận đó đúng.
    answer:
      short: Abstract class có ít nhất một pure virtual function và vẫn có thể sở hữu state, constructor,
        function không virtual hay virtual function đã có implementation. C++ không có keyword
        `interface`; contract runtime giống interface thường là abstract class chỉ chứa các
        operation pure virtual cần thiết cùng virtual destructor khi hỗ trợ xóa qua base. C++20
        concept là một dạng contract compile time riêng cho generic code, không cần inheritance hay
        runtime dispatch.
