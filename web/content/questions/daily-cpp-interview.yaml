    prompt: Object slicing trong C++ là gì và tránh nó bằng cách nào?
    hint: Nêu kết luận trước, sau đó chỉ ra quy tắc C++ và điều kiện khiến kết luận đó đúng.
    answer:
      short: Object slicing xảy ra khi object dẫn xuất được copy theo value vào một object base, khiến
        object mới chỉ còn base subobject và mất state cùng behavior của phần dẫn xuất. Có thể tránh
        bằng cách truyền và lưu object đa hình qua reference hoặc smart pointer sở hữu, đồng thời
        cho base đa hình một virtual destructor. Khi thực sự cần value semantics, dùng virtual
        `clone`, type erasure hoặc sum type đóng như `std::variant` thay vì vô tình copy theo base
        value.
      detailed: >-
        Object slicing xảy ra khi object dẫn xuất được copy theo value vào một object base, khiến
        object mới chỉ còn base subobject và mất state cùng behavior của phần dẫn xuất. Có thể tránh
        bằng cách truyền và lưu object đa hình qua reference hoặc smart pointer sở hữu, đồng thời
        cho base đa hình một virtual destructor. Khi thực sự cần value semantics, dùng virtual
        `clone`, type erasure hoặc sum type đóng như `std::variant` thay vì vô tình copy theo base
        value.


