        exhaustiveness hữu ích; dùng `if` cho range, predicate không cùng loại hoặc điều kiện hỗn
        hợp. Readability và hình dạng bài toán quan trọng hơn giả định một dạng luôn nhanh hơn.
      detailed: >-
        Dùng `switch` cho một discriminator rời rạc kiểu integral hoặc enum, nhất là khi diagnostic
        exhaustiveness hữu ích; dùng `if` cho range, predicate không cùng loại hoặc điều kiện hỗn
        hợp. Readability và hình dạng bài toán quan trọng hơn giả định một dạng luôn nhanh hơn.


