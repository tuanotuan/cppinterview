    answer:
      short: Function pointer lưu địa chỉ của free function hoặc static function có một signature cụ thể
        và hỗ trợ lời gọi gián tiếp, callback hay dispatch table. Nó có thể null hoặc trỏ lại
        function khác, và lambda không capture có thể chuyển sang function pointer tương thích.
        Pointer tới non-static member function có kiểu khác và cần một object; `std::function` hỗ
        trợ type erasure cùng callable có state nhưng có overhead lớn hơn raw function pointer.
      detailed: >-
        Function pointer lưu địa chỉ của free function hoặc static function có một signature cụ thể
