    answer:
      short: Chuẩn C++ quy định storage duration chứ không bắt buộc cách triển khai vật lý bằng stack hay
        heap. Object có automatic storage thường sống đến khi thoát scope và được hủy tự động;
        object cấp phát động sống đến khi thao tác sở hữu giải phóng nó. Cấp phát automatic thường
        rẻ nhưng bị giới hạn bởi không gian stack của thread, còn cấp phát động linh hoạt hơn nhưng
        có chi phí allocator và rủi ro lifetime, nên C++ production thường quản lý bằng container
        RAII và smart pointer thay vì `new`/`delete` thô.
