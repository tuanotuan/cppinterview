    prompt: Lambda expression trong C++11 trở lên là gì?
    hint: Nêu kết luận trước, sau đó chỉ ra quy tắc C++ và điều kiện khiến kết luận đó đúng.
    answer:
      short: Lambda expression tạo một closure object không tên có call operator chứa body được viết.
        Capture list có thể copy hoặc reference entity xung quanh, dùng init-capture hoặc không
        capture; parameter có thể ghi kiểu hay dùng `auto` để tạo generic lambda. Entity được
        capture bằng copy không thể bị sửa qua call operator mặc định dạng const trừ khi lambda được
        đánh dấu `mutable`, và chỉ lambda không capture mới chuyển trực tiếp sang function pointer
        tương thích.
