  - id: dailycpp-q125-001
    lessonId: dailycpp-q125
    type: recall
    responseMode: text
    difficulty: beginner
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: Reference và pointer khác nhau thế nào?
    hint: Nêu kết luận trước, sau đó chỉ ra quy tắc C++ và điều kiện khiến kết luận đó đúng.
    answer:
      short: Reference là alias phải được khởi tạo và không thể reseat; pointer là object có thể null, gán
        lại và thực hiện pointer arithmetic khi hợp lệ. Cả hai đều có thể dangling và tự chúng không
        biểu diễn ownership.
      detailed: >-
        Reference là alias phải được khởi tạo và không thể reseat; pointer là object có thể null,
        gán lại và thực hiện pointer arithmetic khi hợp lệ. Cả hai đều có thể dangling và tự chúng
        không biểu diễn ownership.


        Hãy liên hệ trực tiếp kết luận với kiểu, lifetime, ownership, overload resolution hoặc
        library contract xuất hiện trong câu hỏi. Nếu kết quả phụ thuộc implementation hoặc vi phạm
        precondition, cần nói rõ thay vì chỉ đoán output.
