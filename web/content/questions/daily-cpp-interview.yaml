    prompt: Biến thành viên `static` trong C++ có ý nghĩa gì?
    hint: Nêu kết luận trước, sau đó chỉ ra quy tắc C++ và điều kiện khiến kết luận đó đúng.
    answer:
      short: Biến thành viên `static` thuộc về lớp thay vì từng object, nên mọi instance dùng chung một
        vùng lưu trữ. Quy tắc định nghĩa và khởi tạo phụ thuộc việc nó có phải inline static member
        hay không và chuẩn ngôn ngữ đang dùng.
      detailed: >-
        Biến thành viên `static` thuộc về lớp thay vì từng object, nên mọi instance dùng chung một
        vùng lưu trữ. Quy tắc định nghĩa và khởi tạo phụ thuộc việc nó có phải inline static member
        hay không và chuẩn ngôn ngữ đang dùng.


        Hãy liên hệ trực tiếp kết luận với kiểu, lifetime, ownership, overload resolution hoặc
        library contract xuất hiện trong câu hỏi. Nếu kết quả phụ thuộc implementation hoặc vi phạm
        precondition, cần nói rõ thay vì chỉ đoán output.
