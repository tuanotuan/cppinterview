    prompt: Các keyword `auto` và `decltype` được dùng để làm gì?
    hint: Nêu kết luận trước, sau đó chỉ ra quy tắc C++ và điều kiện khiến kết luận đó đúng.
    answer:
      short: "`auto` yêu cầu compiler suy luận kiểu khai báo từ initializer theo quy tắc phần lớn tương tự
        template argument deduction; declarator được viết vẫn quyết định reference và
        cv-qualification. `decltype(expr)` xác định kiểu mà không evaluate biểu thức và giữ thông
        tin value category, với quy tắc riêng cho tên không có ngoặc. `decltype(auto)` áp dụng quy
        tắc `decltype` cho declaration hoặc return type được suy luận nên có thể giữ reference mà
        `auto` thường bỏ."
      detailed: >-
        `auto` yêu cầu compiler suy luận kiểu khai báo từ initializer theo quy tắc phần lớn tương tự
        template argument deduction; declarator được viết vẫn quyết định reference và
        cv-qualification. `decltype(expr)` xác định kiểu mà không evaluate biểu thức và giữ thông
        tin value category, với quy tắc riêng cho tên không có ngoặc. `decltype(auto)` áp dụng quy
        tắc `decltype` cho declaration hoặc return type được suy luận nên có thể giữ reference mà
        `auto` thường bỏ.


