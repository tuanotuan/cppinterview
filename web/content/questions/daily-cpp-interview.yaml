    estimatedMinutes: 2
    prompt: Nên dùng dấu ngoặc nhọn hay dấu ngoặc kép trong `#include`?
    hint: Nêu kết luận trước, sau đó chỉ ra quy tắc C++ và điều kiện khiến kết luận đó đúng.
    answer:
      short: Dấu ngoặc kép thường tìm ở vị trí tương đối hoặc user header trước include path của
        implementation, còn ngoặc nhọn dùng cách tìm kiểu system. Thứ tự chính xác phụ thuộc
        implementation; convention là dùng ngoặc kép cho header nội bộ dự án và ngoặc nhọn cho
        standard/external dependency.
