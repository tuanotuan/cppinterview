  - id: dailycpp-q019-001
    lessonId: dailycpp-q019
    type: code_reasoning
    responseMode: text
    difficulty: advanced
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 6
    prompt: Chương trình mẫu sau in gì? Đó có phải điều bạn mong đợi không? Vì sao?
    code: |-
      #include <iostream>
      #include <memory>

      class Animal {
      public:
          ~Animal() = default;

          virtual void eat(int quantity) {
              std::cout << "Animal eats " << quantity << '\n';
          }

          void speak() {
              std::cout << "Animal speaks\n";
          }
      };

      class Dog : public Animal {
      public:
          void eat(unsigned int quantity) {
              std::cout << "Dog eats " << quantity << '\n';
          }

          void speak() {
              std::cout << "Dog speaks\n";
          }
      };

      int main() {
          Dog dog;
          dog.speak();
          dog.eat(42u);

          std::unique_ptr<Animal> animal = std::make_unique<Dog>();
          animal->speak();
          animal->eat(42u);
      }
    hint: Nêu kết luận trước, sau đó chỉ ra quy tắc C++ và điều kiện khiến kết luận đó đúng.
    answer:
      short: Chương trình in lần lượt `Dog speaks`, `Dog eats 42`, `Animal speaks`, rồi `Animal eats 42`.
        `speak` không phải virtual, còn `Dog::eat(unsigned)` không override `Animal::eat(int)`; thêm
        `override` sẽ làm lộ cả hai lỗi ngay khi compile.
      detailed: >-
        Chương trình in lần lượt `Dog speaks`, `Dog eats 42`, `Animal speaks`, rồi `Animal eats 42`.
        `speak` không phải virtual, còn `Dog::eat(unsigned)` không override `Animal::eat(int)`; thêm
        `override` sẽ làm lộ cả hai lỗi ngay khi compile.


