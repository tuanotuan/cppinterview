      detailed: >-
        `std::string_view` là view non-owning rẻ của một chuỗi ký tự liên tục. Nó hữu ích cho tham
        số chỉ đọc và slicing, nhưng storage nền phải sống lâu hơn view và dữ liệu không được bảo
        đảm null-terminated; không nên máy móc thay mọi `const std::string&`.


