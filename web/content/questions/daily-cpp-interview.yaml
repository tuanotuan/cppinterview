    prompt: Move semantics trong C++11 là gì và vì sao quan trọng?
    hint: Nêu kết luận trước, sau đó chỉ ra quy tắc C++ và điều kiện khiến kết luận đó đúng.
    answer:
      short: Move semantics cho phép object chuyển resource từ một source sắp hết lifetime thay vì nhân
        bản resource, thông qua rvalue reference cùng move constructor hoặc move assignment.
        `std::move` chỉ thực hiện cast để object đủ điều kiện được move; operation được chọn mới
        thực sự chuyển resource. Object thư viện chuẩn sau move vẫn hợp lệ nhưng thường có giá trị
        không xác định cụ thể, và đánh dấu move operation thật sự là `noexcept` giúp container ưu
        tiên move mà vẫn giữ strong guarantee khi reallocation.
      detailed: >-
        Move semantics cho phép object chuyển resource từ một source sắp hết lifetime thay vì nhân
        bản resource, thông qua rvalue reference cùng move constructor hoặc move assignment.
        `std::move` chỉ thực hiện cast để object đủ điều kiện được move; operation được chọn mới
        thực sự chuyển resource. Object thư viện chuẩn sau move vẫn hợp lệ nhưng thường có giá trị
        không xác định cụ thể, và đánh dấu move operation thật sự là `noexcept` giúp container ưu
        tiên move mà vẫn giữ strong guarantee khi reallocation.


