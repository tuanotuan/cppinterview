    prompt: SFINAE là gì và liên quan thế nào tới template specialization?
    hint: Nêu kết luận trước, sau đó chỉ ra quy tắc C++ và điều kiện khiến kết luận đó đúng.
    answer:
      short: "SFINAE là viết tắt của Substitution Failure Is Not An Error: khi substitution thất bại trong
        immediate context của một candidate function template, candidate đó bị loại khỏi overload
        resolution thay vì làm cả chương trình ill-formed. Cơ chế này có thể bật overload hoặc
        partial class specialization theo điều kiện, nhưng bản thân nó không phải explicit
        specialization và function template không được partial-specialize. Trong C++20, constraint
        và concept thường diễn đạt cùng ý định rõ hơn và cho diagnostic tốt hơn."
      detailed: >-
        SFINAE là viết tắt của Substitution Failure Is Not An Error: khi substitution thất bại trong
