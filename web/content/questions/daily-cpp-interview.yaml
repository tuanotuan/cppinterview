  - id: dailycpp-q170-001
    lessonId: dailycpp-q170
    type: recall
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: RAII giúp bảo đảm exception safety như thế nào?
    hint: Nêu kết luận trước, sau đó chỉ ra quy tắc C++ và điều kiện khiến kết luận đó đúng.
    answer:
      short: "RAII đặt ownership của resource vào state của object: construction thiết lập quyền sở hữu và
        destructor giải phóng resource. Vì destructor của automatic object đã construction hoàn
        chỉnh chạy cả khi return bình thường lẫn stack unwinding, file, lock, memory và resource
        khác được dọn mà không cần lặp cleanup path. RAII ngăn leak nhưng không tự bảo đảm state
        mang tính transaction; strong exception guarantee còn có thể cần thiết kế chỉ commit sau khi
        thành công như copy-and-swap."
      detailed: >-
        RAII đặt ownership của resource vào state của object: construction thiết lập quyền sở hữu và
        destructor giải phóng resource. Vì destructor của automatic object đã construction hoàn
        chỉnh chạy cả khi return bình thường lẫn stack unwinding, file, lock, memory và resource
        khác được dọn mà không cần lặp cleanup path. RAII ngăn leak nhưng không tự bảo đảm state
        mang tính transaction; strong exception guarantee còn có thể cần thiết kế chỉ commit sau khi
        thành công như copy-and-swap.


        Hãy liên hệ trực tiếp kết luận với kiểu, lifetime, ownership, overload resolution hoặc
        library contract xuất hiện trong câu hỏi. Nếu kết quả phụ thuộc implementation hoặc vi phạm
