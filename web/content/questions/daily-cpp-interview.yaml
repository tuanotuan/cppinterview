    prompt: Access specifier trong C++ là gì?
    hint: Nêu kết luận trước, sau đó chỉ ra quy tắc C++ và điều kiện khiến kết luận đó đúng.
    answer:
      short: Các access specifier `public`, `protected` và `private` kiểm soát nơi member của class được
        phép được gọi tên. Member public nhìn chung truy cập được từ bên ngoài; member protected
        dành cho chính class, friend và class dẫn xuất; member private dành cho chính class và
        friend. `class` mặc định private còn `struct` mặc định public; đây là quy tắc interface ở
        compile time, không phải ranh giới bảo mật bộ nhớ.
