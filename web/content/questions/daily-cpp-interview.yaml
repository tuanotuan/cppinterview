      short: Khởi tạo pointer bằng `nullptr` khi trạng thái rỗng là hợp lệ và chưa có target thật, để việc
        kiểm tra có hành vi xác định. Nếu có thể, nên khởi tạo ngay tới target hợp lệ vì null thêm
        một trạng thái mà mọi nơi sử dụng phải xử lý.
      detailed: >-
        Khởi tạo pointer bằng `nullptr` khi trạng thái rỗng là hợp lệ và chưa có target thật, để
        việc kiểm tra có hành vi xác định. Nếu có thể, nên khởi tạo ngay tới target hợp lệ vì null
        thêm một trạng thái mà mọi nơi sử dụng phải xử lý.


