    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: Kiểu trả về đặt sau (trailing return type) là gì?
    hint: Nêu kết luận trước, sau đó chỉ ra quy tắc C++ và điều kiện khiến kết luận đó đúng.
    answer:
      short: Trailing return type đặt kiểu trả về sau danh sách tham số, ví dụ `auto f(T value) ->
        Result`. Nó hữu ích khi kiểu trả về phụ thuộc tham số hoặc khi member type dễ gọi tên hơn
        sau khi đã vào scope của lớp.
      detailed: >-
        Trailing return type đặt kiểu trả về sau danh sách tham số, ví dụ `auto f(T value) ->
