    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Dùng algorithm để tìm kiếm nhị phân một phần tử!
    code: |-
      #include <algorithm>
      #include <iostream>
      #include <vector>

      int main() {
          std::vector<int> numbers{1, 54, 7, 5335, 8};
          std::cout << std::binary_search(numbers.begin(), numbers.end(), 7) << '\n';
      }
    hint: Nêu kết luận trước, sau đó chỉ ra quy tắc C++ và điều kiện khiến kết luận đó đúng.
    answer:
      short: "`std::binary_search` yêu cầu range được partition theo cùng ordering dùng để tìm kiếm, điều
        mà range được sort bình thường đáp ứng. Hãy sort trước hoặc duy trì invariant; gọi nó trên
        mẫu chưa sort vi phạm precondition nên không thể tin kết quả."
      detailed: >-
        `std::binary_search` yêu cầu range được partition theo cùng ordering dùng để tìm kiếm, điều
        mà range được sort bình thường đáp ứng. Hãy sort trước hoặc duy trì invariant; gọi nó trên
        mẫu chưa sort vi phạm precondition nên không thể tin kết quả.


