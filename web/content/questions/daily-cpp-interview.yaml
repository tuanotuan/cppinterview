  - id: dailycpp-q153-001
    lessonId: dailycpp-q153
    type: recall
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Giải thích shallow copy, deep copy và copy constructor trong C++.
    hint: Nêu kết luận trước, sau đó chỉ ra quy tắc C++ và điều kiện khiến kết luận đó đúng.
    answer:
      short: "Copy constructor khởi tạo object mới từ một object có sẵn. Copy do compiler sinh thực hiện
        copy từng member: member giá trị trở thành giá trị độc lập, còn raw pointer chỉ sao chép địa
        chỉ nên có thể tạo hiệu ứng shallow copy và làm hỏng ownership. Một owner deep-copy sẽ cấp
        phát resource riêng rồi sao chép nội dung, nhưng thiết kế ưu tiên là Rule of Zero: lưu
        resource trong các member RAII có value semantics để copy và destructor sinh tự động đã có
        hành vi đúng."
      detailed: >-
        Copy constructor khởi tạo object mới từ một object có sẵn. Copy do compiler sinh thực hiện
        copy từng member: member giá trị trở thành giá trị độc lập, còn raw pointer chỉ sao chép địa
        chỉ nên có thể tạo hiệu ứng shallow copy và làm hỏng ownership. Một owner deep-copy sẽ cấp
        phát resource riêng rồi sao chép nội dung, nhưng thiết kế ưu tiên là Rule of Zero: lưu
        resource trong các member RAII có value semantics để copy và destructor sinh tự động đã có
        hành vi đúng.


        Hãy liên hệ trực tiếp kết luận với kiểu, lifetime, ownership, overload resolution hoặc
        library contract xuất hiện trong câu hỏi. Nếu kết quả phụ thuộc implementation hoặc vi phạm
        precondition, cần nói rõ thay vì chỉ đoán output.
