  - id: dailycpp-q167-001
    lessonId: dailycpp-q167
    type: recall
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Inline expansion của function ảnh hưởng hiệu năng như thế nào?
    hint: Nêu kết luận trước, sau đó chỉ ra quy tắc C++ và điều kiện khiến kết luận đó đúng.
    answer:
      short: Inlining có thể loại bỏ overhead của lời gọi và làm lộ constant cùng control flow cho các tối
        ưu tiếp theo, nhưng nhân bản function body có thể tăng kích thước code và tạo áp lực lên
        instruction cache. Optimizer có thể inline function không ghi `inline` hoặc từ chối function
        có keyword này; vai trò ngôn ngữ được bảo đảm của `inline` chủ yếu là cho phép definition
        giống nhau ở nhiều translation unit theo ODR. Vì vậy quyết định hiệu năng phải dựa trên
        optimized build và đo đạc, không dựa riêng vào keyword.
      detailed: >-
        Inlining có thể loại bỏ overhead của lời gọi và làm lộ constant cùng control flow cho các
        tối ưu tiếp theo, nhưng nhân bản function body có thể tăng kích thước code và tạo áp lực lên
        instruction cache. Optimizer có thể inline function không ghi `inline` hoặc từ chối function
        có keyword này; vai trò ngôn ngữ được bảo đảm của `inline` chủ yếu là cho phép definition
        giống nhau ở nhiều translation unit theo ODR. Vì vậy quyết định hiệu năng phải dựa trên
        optimized build và đo đạc, không dựa riêng vào keyword.


        Hãy liên hệ trực tiếp kết luận với kiểu, lifetime, ownership, overload resolution hoặc
        library contract xuất hiện trong câu hỏi. Nếu kết quả phụ thuộc implementation hoặc vi phạm
        precondition, cần nói rõ thay vì chỉ đoán output.
