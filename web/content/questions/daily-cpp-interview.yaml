  - id: dailycpp-q146-001
    lessonId: dailycpp-q146
    type: recall
    responseMode: text
    difficulty: beginner
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: Một hàm nên có bao nhiêu câu lệnh `return`?
    hint: Nêu kết luận trước, sau đó chỉ ra quy tắc C++ và điều kiện khiến kết luận đó đúng.
    answer:
      short: Không có giới hạn phổ quát hữu ích. Nhiều early return và guard clause thường làm hàm ngắn rõ
        hơn nhờ giảm nesting; nếu quá nhiều exit khó suy luận, hãy giảm kích thước và trách nhiệm
        của hàm thay vì ép giáo điều chỉ một `return`.
