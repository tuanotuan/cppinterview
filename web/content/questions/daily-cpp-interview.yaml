  - id: dailycpp-q105-001
    lessonId: dailycpp-q105
    type: pitfall
    responseMode: text
    difficulty: advanced
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 6
    prompt: Có những cách nào để tránh undefined behavior?
    hint: Nêu kết luận trước, sau đó chỉ ra quy tắc C++ và điều kiện khiến kết luận đó đúng.
    answer:
      short: Tránh undefined behavior bằng invariant và ownership tường minh, kiểm tra input cùng
        precondition thư viện, bật warning mạnh và chạy sanitizer/test. Ưu tiên RAII, abstraction có
        bounds và scope nhỏ để invalid state khó được biểu diễn.
      detailed: >-
        Tránh undefined behavior bằng invariant và ownership tường minh, kiểm tra input cùng
        precondition thư viện, bật warning mạnh và chạy sanitizer/test. Ưu tiên RAII, abstraction có
        bounds và scope nhỏ để invalid state khó được biểu diễn.


