schemaVersion: 1
questions:
  - id: dailycpp-q001-001
    lessonId: dailycpp-q001
    type: recall
    responseMode: text
    difficulty: beginner
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: Giải thích cách `auto` suy luận kiểu!
    hint: Nêu kết luận trước, sau đó chỉ ra quy tắc C++ và điều kiện khiến kết luận đó đúng.
    answer:
      short: "`auto` suy luận gần giống template: reference và cv-qualifier ở mức ngoài có thể bị bỏ tùy
        dạng khai báo, còn braced initializer có quy tắc riêng với `std::initializer_list`. Cần viết
        `auto&`, `const auto&` hoặc `auto&&` khi hành vi reference là một phần của contract."
      detailed: >-
        `auto` suy luận gần giống template: reference và cv-qualifier ở mức ngoài có thể bị bỏ tùy
        dạng khai báo, còn braced initializer có quy tắc riêng với `std::initializer_list`. Cần viết
        `auto&`, `const auto&` hoặc `auto&&` khi hành vi reference là một phần của contract.


        Hãy liên hệ trực tiếp kết luận với kiểu, lifetime, ownership, overload resolution hoặc
        library contract xuất hiện trong câu hỏi. Nếu kết quả phụ thuộc implementation hoặc vi phạm
        precondition, cần nói rõ thay vì chỉ đoán output.
    rubric:
      required:
        - Trả lời trực tiếp đúng câu hỏi nguồn.
        - Nêu đúng quy tắc C++ và điều kiện áp dụng.
        - Không suy diễn từ một compiler hoặc một lần chạy duy nhất.
      bonus:
        - Nêu được hệ quả về thiết kế API, lifetime, ownership, portability hoặc hiệu năng.
      misconceptions:
        - Chỉ nhắc lại thuật ngữ mà không giải thích cơ chế hoặc điều kiện.
    sources:
      - sectionId: y-tuong-cot-loi
      - sectionId: cach-no-hoat-dong
      - sectionId: cau-hoi-tu-kiem-tra
    sourceHash: c34d9a3235c63387fdb7a32c9ce46488b412139a1a8bc39e4dd8a167b1e5f166
    status: draft
    version: 1
  - id: dailycpp-q002-001
    lessonId: dailycpp-q002
    type: recall
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Khi nào `auto` có thể suy luận ra kiểu không mong muốn?
    hint: Nêu kết luận trước, sau đó chỉ ra quy tắc C++ và điều kiện khiến kết luận đó đúng.
    answer:
      short: "`auto` giữ kiểu thực của biểu thức khởi tạo, nên có thể nhận một proxy ẩn như
        `std::vector<bool>::reference` thay vì `bool`. Hãy ép về kiểu giá trị mong muốn khi proxy có
        thể sống lâu hơn owner hoặc gây hành vi bất ngờ."
      detailed: >-
        `auto` giữ kiểu thực của biểu thức khởi tạo, nên có thể nhận một proxy ẩn như
        `std::vector<bool>::reference` thay vì `bool`. Hãy ép về kiểu giá trị mong muốn khi proxy có
        thể sống lâu hơn owner hoặc gây hành vi bất ngờ.


        Hãy liên hệ trực tiếp kết luận với kiểu, lifetime, ownership, overload resolution hoặc
        library contract xuất hiện trong câu hỏi. Nếu kết quả phụ thuộc implementation hoặc vi phạm
        precondition, cần nói rõ thay vì chỉ đoán output.
    rubric:
      required:
        - Trả lời trực tiếp đúng câu hỏi nguồn.
        - Nêu đúng quy tắc C++ và điều kiện áp dụng.
        - Không suy diễn từ một compiler hoặc một lần chạy duy nhất.
      bonus:
        - Nêu được hệ quả về thiết kế API, lifetime, ownership, portability hoặc hiệu năng.
      misconceptions:
        - Chỉ nhắc lại thuật ngữ mà không giải thích cơ chế hoặc điều kiện.
