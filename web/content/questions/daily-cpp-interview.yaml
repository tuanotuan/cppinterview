    answer:
      short: "`throw` khởi tạo một exception object rồi chuyển control tới handler phù hợp trong chuỗi
        `try`/`catch` bao quanh. Trong quá trình stack unwinding, các automatic object đã
        construction hoàn chỉnh được hủy theo thứ tự ngược, vì vậy RAII là nền tảng của exception
        safety. Nên catch exception đa hình bằng `const` reference, đặt handler cụ thể trước handler
        tổng quát và không để exception thoát khỏi destructor trong lúc unwinding."
      detailed: >-
        `throw` khởi tạo một exception object rồi chuyển control tới handler phù hợp trong chuỗi
        `try`/`catch` bao quanh. Trong quá trình stack unwinding, các automatic object đã
        construction hoàn chỉnh được hủy theo thứ tự ngược, vì vậy RAII là nền tảng của exception
        safety. Nên catch exception đa hình bằng `const` reference, đặt handler cụ thể trước handler
        tổng quát và không để exception thoát khỏi destructor trong lúc unwinding.


