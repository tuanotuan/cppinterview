    prompt: Giải thích encapsulation bằng một ví dụ.
    hint: Nêu kết luận trước, sau đó chỉ ra quy tắc C++ và điều kiện khiến kết luận đó đúng.
    answer:
      short: Encapsulation đóng gói state cùng các operation duy trì invariant và che giấu chi tiết biểu
        diễn sau một interface ổn định. Nó không chỉ là đặt field thành private rồi thêm
        getter/setter không hạn chế; caller nên diễn đạt operation hợp lệ của domain như `withdraw`,
        còn class từ chối transition không hợp lệ như số dư âm. Cách này giảm coupling và cho phép
        đổi implementation mà không buộc caller đổi theo.
