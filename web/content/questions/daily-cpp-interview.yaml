    answer:
      short: Tránh undefined behavior bằng invariant và ownership tường minh, kiểm tra input cùng
        precondition thư viện, bật warning mạnh và chạy sanitizer/test. Ưu tiên RAII, abstraction có
        bounds và scope nhỏ để invalid state khó được biểu diễn.
      detailed: >-
        Tránh undefined behavior bằng invariant và ownership tường minh, kiểm tra input cùng
        precondition thư viện, bật warning mạnh và chạy sanitizer/test. Ưu tiên RAII, abstraction có
        bounds và scope nhỏ để invalid state khó được biểu diễn.


