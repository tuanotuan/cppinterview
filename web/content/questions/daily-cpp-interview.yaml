        Default constructor cho phép tạo object không cần đối số, điều mà nhiều container, array,
        serializer và generic algorithm có thể yêu cầu. Chỉ cung cấp khi nó thiết lập được invariant
        hợp lệ; một default state không hợp lệ tệ hơn việc bắt buộc truyền dữ liệu.


        Hãy liên hệ trực tiếp kết luận với kiểu, lifetime, ownership, overload resolution hoặc
        library contract xuất hiện trong câu hỏi. Nếu kết quả phụ thuộc implementation hoặc vi phạm
        precondition, cần nói rõ thay vì chỉ đoán output.
