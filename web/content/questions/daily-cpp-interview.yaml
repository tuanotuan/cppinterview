    prompt: Lvalue và rvalue là gì?
    hint: Nêu kết luận trước, sau đó chỉ ra quy tắc C++ và điều kiện khiến kết luận đó đúng.
    answer:
      short: Lvalue là glvalue không phải xvalue và thường chỉ một object có identity tiếp tục tồn tại;
        xvalue là glvalue có resource có thể được tái sử dụng. Prvalue tính ra một giá trị hoặc khởi
        tạo object, còn thuật ngữ rvalue bao gồm prvalue và xvalue. Các value category này chi phối
        overload resolution, reference binding, temporary materialization và move semantics; chúng
        chính xác hơn cách nói lvalue chỉ nằm bên trái còn rvalue chỉ nằm bên phải phép gán.
      detailed: >-
        Lvalue là glvalue không phải xvalue và thường chỉ một object có identity tiếp tục tồn tại;
        xvalue là glvalue có resource có thể được tái sử dụng. Prvalue tính ra một giá trị hoặc khởi
        tạo object, còn thuật ngữ rvalue bao gồm prvalue và xvalue. Các value category này chi phối
        overload resolution, reference binding, temporary materialization và move semantics; chúng
        chính xác hơn cách nói lvalue chỉ nằm bên trái còn rvalue chỉ nằm bên phải phép gán.


        Hãy liên hệ trực tiếp kết luận với kiểu, lifetime, ownership, overload resolution hoặc
        library contract xuất hiện trong câu hỏi. Nếu kết quả phụ thuộc implementation hoặc vi phạm
        precondition, cần nói rõ thay vì chỉ đoán output.
    rubric:
