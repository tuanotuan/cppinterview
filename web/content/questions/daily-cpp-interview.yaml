    prompt: Include guard là gì?
    hint: Nêu kết luận trước, sau đó chỉ ra quy tắc C++ và điều kiện khiến kết luận đó đúng.
    answer:
      short: Include guard bọc header trong một preprocessor macro duy nhất để việc include lặp trong một
        translation unit không lặp lại declaration và definition. `#pragma once` được hỗ trợ rộng
        nhưng không thuộc chuẩn; macro guard vẫn là cơ chế portable.
