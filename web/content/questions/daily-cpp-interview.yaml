    answer:
      short: "RAII gắn lifetime của resource với lifetime của object: việc acquire thiết lập invariant và
        destructor giải phóng resource trên mọi đường thoát. Vì vậy stack unwinding xử lý exception
        mà không cần cleanup tách rời."
