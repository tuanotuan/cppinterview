        không thể bind lại; reference thông thường phải chỉ tới object hoặc function hợp lệ khi được
        dùng. Cả hai không tự biểu thị ownership, vì vậy ownership cần được thể hiện riêng, ưu tiên
        bằng kiểu RAII.
