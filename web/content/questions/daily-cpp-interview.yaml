    answer:
      short: "Parameter không phải reference là một object riêng được khởi tạo từ argument, nên sửa nó
        không sửa object của caller; việc copy hoặc move có thể phát sinh chi phí. Parameter kiểu
        reference bind vào object của caller: reference không const có thể sửa object, còn `const
        T&` cho quyền đọc và thường tránh copy. Cần chọn theo contract trước; kiểu giá trị nhỏ
        thường nên truyền bằng value và reference không tự động nhanh hơn trong mọi trường hợp."
      detailed: >-
        Parameter không phải reference là một object riêng được khởi tạo từ argument, nên sửa nó
        không sửa object của caller; việc copy hoặc move có thể phát sinh chi phí. Parameter kiểu
        reference bind vào object của caller: reference không const có thể sửa object, còn `const
        T&` cho quyền đọc và thường tránh copy. Cần chọn theo contract trước; kiểu giá trị nhỏ
