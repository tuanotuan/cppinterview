        cache behavior phụ thuộc hardware và workload.Build thành công chưa đủ; phải kiểm tra
        lifetime, ordering và error path.
      detailed: >-
        Đổi layout không profiling có thể phá invariant và readability trong khi tối ưu cold path;
        cache behavior phụ thuộc hardware và workload.Build thành công chưa đủ; phải kiểm tra
        lifetime, ordering và error path.


        Nên dùng kỹ thuật này khi profiling xác định memory stall trong hot loop trên nhiều record
        được xử lý giống nhau.Nên chọn cách C++11/14 đơn giản hơn nếu quy tắc C++17 không cải thiện
        safety, độ rõ hoặc hiệu năng đã đo trên các toolchain phải hỗ trợ.


        Data-oriented design bắt đầu từ data movement đã đo và giữ domain invariant qua index
        relationship rõ.Phải chọn rõ chế độ C++17; default của compiler mới hơn có thể che lỗi
        portability.Warning và ví dụ xác định biến quy tắc ghi nhớ thành bằng chứng.
    rubric:
      required:
        - Chỉ ra chính xác quy tắc C++17 hoặc invariant có liên quan.
        - Giải thích hậu quả quan sát được, lỗi compile hoặc undefined behavior nếu có.
        - Đề xuất xử lý nhỏ nhất loại bỏ nguyên nhân thay vì che triệu chứng.
      bonus:
        - Nêu được trade-off của cách xử lý đối với API, lifetime hoặc hiệu năng.
      misconceptions:
        - Cho rằng chương trình an toàn chỉ vì có thể compile hoặc chạy một lần.
