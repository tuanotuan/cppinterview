      \        std::shared_lock lock{mutex_};\r

      \        return value_;\r

      \    }\r

      \r

      private:\r

      \    mutable std::shared_mutex mutex_;\r

      \    int value_ = 0;\r

      };\r

      \r

      struct Account {\r

      \    std::mutex mutex;\r

      \    int balance;\r

      };\r

      \r

      void transfer(Account& from, Account& to, int amount) {\r

      \    std::scoped_lock lock{from.mutex, to.mutex};\r

      \    from.balance -= amount;\r

      \    to.balance += amount;\r

      }\r

      \r

      int main() {\r

      \    Score score;\r

      \    score.set(91);\r

      \    Account left{{}, 100};\r

