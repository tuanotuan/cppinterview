    prompt: Inline variables và One Definition Rule giải quyết vấn đề chính nào?
    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu ràng buộc mà tính năng làm rõ.
    answer:
      short: Global hoặc static data định nghĩa trong header trước đây cần out-of-class definition hoặc dễ
        gặp multiple-definition linker error. Inline variable cho phép một logical variable có
        definition giống nhau ở nhiều translation unit.
      detailed: >-
        Global hoặc static data định nghĩa trong header trước đây cần out-of-class definition hoặc
        dễ gặp multiple-definition linker error. Inline variable cho phép một logical variable có
        definition giống nhau ở nhiều translation unit.


        Inline variable có thể có definition giống nhau trong nhiều translation unit mà vẫn chỉ một
        entity với một address. C++17 cũng làm static data member constexpr mặc nhiên inline.
    rubric:
      required:
        - Nêu đúng vấn đề mà chủ đề giải quyết.
        - Mô tả đúng cơ chế hoặc contract C++17 liên quan.
