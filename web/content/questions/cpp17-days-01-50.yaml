  - id: cpp17-byte-object-representation-001
    lessonId: cpp17-byte-object-representation
    type: recall
    responseMode: text
    difficulty: beginner
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: std::byte và object representation giải quyết vấn đề chính nào?
    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu ràng buộc mà tính năng làm rõ.
    answer:
      short: Raw memory thường được biểu diễn bằng character integer vô tình cho phép arithmetic.
        std::byte biểu diễn byte của object representation và hỗ trợ bit operation mà không giả là
        number.
      detailed: >-
        Raw memory thường được biểu diễn bằng character integer vô tình cho phép arithmetic.
        std::byte biểu diễn byte của object representation và hỗ trợ bit operation mà không giả là
        number.


        std::byte là type dạng enum cho raw bit. Dùng std::to_integer khi chủ động diễn giải thành
        số và std::memcpy để copy representation của trivially copyable object không vi phạm
        aliasing.
    rubric:
      required:
        - Nêu đúng vấn đề mà chủ đề giải quyết.
        - Mô tả đúng cơ chế hoặc contract C++17 liên quan.
        - Không nhầm tính năng C++17 với hành vi phụ thuộc compiler.
      bonus:
        - Liên hệ được tác động ở compile time với hành vi quan sát được lúc chạy.
      misconceptions:
        - Chỉ nhắc tên tính năng mà không giải thích mục đích hoặc ràng buộc.
