    prompt: "`decltype(x)` và `decltype((x))` khác nhau thế nào với named lvalue?"
    hint: Xác định invariant về kiểu, lifetime, ownership, invalidation hoặc ordering trước khi đề xuất
      cách xử lý nhỏ nhất.
    answer:
      short: auto thường tạo bản sao khi có thể đang muốn alias; hãy chủ động chọn auto&, const auto& hoặc
        decltype(auto).Build thành công chưa đủ; phải kiểm tra lifetime, ordering và error path.
      detailed: >-
        auto thường tạo bản sao khi có thể đang muốn alias; hãy chủ động chọn auto&, const auto&
        hoặc decltype(auto).Build thành công chưa đủ; phải kiểm tra lifetime, ordering và error
        path.


        Nên dùng kỹ thuật này khi initializer hoặc lời gọi callable đã làm kiểu cụ thể rõ và ghi tay
        chỉ tạo nhiễu.Nên chọn cách C++11/14 đơn giản hơn nếu quy tắc C++17 không cải thiện safety,
        độ rõ hoặc hiệu năng đã đo trên các toolchain phải hỗ trợ.


        Deduction làm khai báo ngắn hơn, nhưng giữ reference và conversion vẫn là quyết định thiết
        kế.Phải chọn rõ chế độ C++17; default của compiler mới hơn có thể che lỗi
        portability.Warning và ví dụ xác định biến quy tắc ghi nhớ thành bằng chứng.
    rubric:
