      động.
    answer:
      short: >-
        Relative path chứa parent component được normalize hoàn toàn trong memory.Member function
        hiểu component lấy filename, stem, extension và tạo changed copy mà không giả định slash
        character.Chương trình in generic path string đã normalize và replace extension, tạo test
        oracle nhỏ để so sánh với dự đoán trước khi biên dịch.


