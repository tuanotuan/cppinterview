    prompt: Vì sao consumer phải test cả queue state lẫn completion?
    code: "#include <condition_variable>\r

      #include <iostream>\r

      #include <mutex>\r

      #include <queue>\r

      #include <thread>\r

      \r

      int main() {\r

      \    std::mutex mutex;\r

      \    std::condition_variable condition;\r

      \    std::queue<int> jobs;\r

      \    bool done = false;\r

      \    int total = 0;\r

      \r

      \    std::thread consumer([&] {\r

      \        for (;;) {\r

      \            std::unique_lock lock{mutex};\r

      \            condition.wait(lock, [&] { return !jobs.empty() || done; });\r

      \            if (jobs.empty() && done) break;\r

      \            const int job = jobs.front();\r

      \            jobs.pop();\r

      \            lock.unlock();\r

      \            total += job;\r

      \        }\r

      \    });\r

      \r

      \    std::thread producer([&] {\r

      \        for (int job : {10, 20, 30}) {\r

      \            {\r

      \                std::lock_guard lock{mutex};\r

      \                jobs.push(job);\r

      \            }\r

      \            condition.notify_one();\r

      \        }\r

      \        {\r

      \            std::lock_guard lock{mutex};\r

      \            done = true;\r

      \        }\r

      \        condition.notify_one();\r

      \    });\r

      \r

      \    producer.join();\r

      \    consumer.join();\r

      \    std::cout << \"processed sum: \" << total << '\\n';\r

      }\r\n"
    hint: Lần theo dữ liệu cố định trong mã mẫu, rồi gắn từng kết quả với quy tắc ở phần Cách nó hoạt
      động.
