        với pointer, reference hay initializer-list constructor.Build thành công chưa đủ; phải kiểm
        tra lifetime, ordering và error path.


        Nên dùng kỹ thuật này khi constructor argument làm specialization dự kiến không mơ hồ và bỏ
        lặp giúp dễ đọc hơn.Nên chọn cách C++11/14 đơn giản hơn nếu quy tắc C++17 không cải thiện
        safety, độ rõ hoặc hiệu năng đã đo trên các toolchain phải hỗ trợ.


        CTAD suy ra class specialization tại declaration; nó không biến class template thành runtime
        dynamic type.Phải chọn rõ chế độ C++17; default của compiler mới hơn có thể che lỗi
