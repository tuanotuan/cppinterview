    answer:
      short: Read-heavy state có thể serialize mọi reader sau exclusive mutex không cần thiết, còn acquire
        nhiều mutex thủ công dễ sai order và deadlock. C++17 chuẩn hóa shared ownership và variadic
        scoped locking.
      detailed: >-
        Read-heavy state có thể serialize mọi reader sau exclusive mutex không cần thiết, còn
        acquire nhiều mutex thủ công dễ sai order và deadlock. C++17 chuẩn hóa shared ownership và
        variadic scoped locking.


        std::shared_mutex cho phép nhiều shared reader hoặc một exclusive writer. std::shared_lock
        sở hữu shared access, còn std::scoped_lock acquire nhiều mutex bằng deadlock-avoidance
        algorithm và release theo RAII.
