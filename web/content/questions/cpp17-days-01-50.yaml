  - id: cpp17-fold-expressions-002
    lessonId: cpp17-fold-expressions
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: "`sum()` trả gì với binary fold đã cho?"
    code: "#include <iostream>\r

      \r

      template <class... Ts>\r

      constexpr auto sum(Ts... values) {\r

      \    return (0 + ... + values);\r

      }\r

      \r

      template <class... Ts>\r

      void print_values(Ts... values) {\r

      \    std::cout << \"values:\";\r

      \    ((std::cout << ' ' << values), ...);\r

      \    std::cout << '\\n';\r

      }\r

      \r

      int main() {\r

      \    static_assert(sum() == 0);\r

      \    static_assert(sum(1, 2, 3, 4) == 10);\r

      \    std::cout << \"sum: \" << sum(1, 2, 3, 4) << '\\n';\r

      \    print_values(1, 2, 3, 4);\r

      }\r\n"
    hint: Lần theo dữ liệu cố định trong mã mẫu, rồi gắn từng kết quả với quy tắc ở phần Cách nó hoạt
      động.
    answer:
      short: >-
        Binary left fold bắt đầu từ zero rồi cộng từng argument theo source order.Comma fold thứ hai
        gọi output expression cho mọi pack element mà không cần recursive function call.Chương trình
        in sum: 10 rồi values: 1 2 3 4, tạo test oracle nhỏ để so sánh với dự đoán trước khi biên
        dịch.


        File `.cpp` dùng dữ liệu cố định. Hãy dự đoán kết quả, biên dịch rồi đối chiếu từng dòng với
        quy tắc C++17.
      detailed: >-
        Unary hoặc binary fold expand pack quanh một operator. Vị trí ellipsis chọn kết hợp trái hay
        phải; initial value cung cấp identity và cho phép empty pack khi operator phù hợp.


        Binary left fold bắt đầu từ zero rồi cộng từng argument theo source order.Comma fold thứ hai
        gọi output expression cho mọi pack element mà không cần recursive function call.Chương trình
        in sum: 10 rồi values: 1 2 3 4, tạo test oracle nhỏ để so sánh với dự đoán trước khi biên
        dịch.


        Ví dụ dùng arithmetic fold có identity và comma fold để output, thể hiện cả value reduction
        lẫn side effect có thứ tự.


        File `.cpp` dùng dữ liệu cố định. Hãy dự đoán kết quả, biên dịch rồi đối chiếu từng dòng với
        quy tắc C++17.
