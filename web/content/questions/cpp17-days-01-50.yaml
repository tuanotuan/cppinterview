  - id: cpp17-toolchain-compiler-flags-cpp17-003
    lessonId: cpp17-toolchain-compiler-flags-cpp17
    type: pitfall
    responseMode: text
    difficulty: advanced
    interviewCategory: code_review_debug
    interviewFormat: bug_hunt
    estimatedMinutes: 5
    prompt: Vì sao compilation có thể thành công nhưng final link vẫn lỗi khi thiếu tùy chọn thư viện
      cần thiết?
    hint: Xác định invariant về kiểu, lifetime, ownership, invalidation hoặc ordering trước khi đề xuất
      cách xử lý nhỏ nhất.
    answer:
      short: Dựa vào default của IDE hay compiler có thể vô tình nhận extension mới hơn hoặc từ chối cú
        pháp C++17 cần thiết trên máy khác.Build thành công chưa đủ; phải kiểm tra lifetime,
        ordering và error path.
      detailed: >-
        Dựa vào default của IDE hay compiler có thể vô tình nhận extension mới hơn hoặc từ chối cú
        pháp C++17 cần thiết trên máy khác.Build thành công chưa đủ; phải kiểm tra lifetime,
        ordering và error path.


        Nên dùng kỹ thuật này khi một build phải chạy nhất quán trong terminal, editor, CI và môi
        trường của đồng đội.Nên chọn cách C++11/14 đơn giản hơn nếu quy tắc C++17 không cải thiện
        safety, độ rõ hoặc hiệu năng đã đo trên các toolchain phải hỗ trợ.


        Hãy xem tên, phiên bản compiler, standard mode, warning, optimization level và link option
        là một phần của chương trình.Phải chọn rõ chế độ C++17; default của compiler mới hơn có thể
        che lỗi portability.Warning và ví dụ xác định biến quy tắc ghi nhớ thành bằng chứng.
    rubric:
      required:
        - Chỉ ra chính xác quy tắc C++17 hoặc invariant có liên quan.
        - Giải thích hậu quả quan sát được, lỗi compile hoặc undefined behavior nếu có.
        - Đề xuất xử lý nhỏ nhất loại bỏ nguyên nhân thay vì che triệu chứng.
      bonus:
        - Nêu được trade-off của cách xử lý đối với API, lifetime hoặc hiệu năng.
      misconceptions:
        - Cho rằng chương trình an toàn chỉ vì có thể compile hoặc chạy một lần.
    sources:
      - sectionId: loi-thuong-gap
      - sectionId: khi-nao-nen-dung
      - sectionId: dieu-can-nho
    sourceHash: b77499c98b6b9ca18d3343ed1e3134cf628fdd2461d270c0d30850f26893ec6c
    status: draft
    version: 1
  - id: cpp17-object-lifetime-raii-move-rule-of-zero-review-001
    lessonId: cpp17-object-lifetime-raii-move-rule-of-zero-review
    type: recall
    responseMode: text
    difficulty: beginner
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: Ôn object lifetime, RAII, move semantics và Rule of Zero giải quyết vấn đề chính nào?
    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu ràng buộc mà tính năng làm rõ.
    answer:
      short: Đường cleanup thủ công tăng nhanh khi hàm return sớm hoặc throw. RAII gắn việc giải phóng với
        object lifetime, còn kiểu Rule of Zero giao ownership cho member chuẩn đã cài đúng copy,
        move và destruction.
      detailed: >-
        Đường cleanup thủ công tăng nhanh khi hàm return sớm hoặc throw. RAII gắn việc giải phóng
        với object lifetime, còn kiểu Rule of Zero giao ownership cho member chuẩn đã cài đúng copy,
        move và destruction.


        Object bắt đầu lifetime sau khi được khởi tạo hợp lệ và kết thúc khi destructor chạy. Ưu
        tiên member như std::string, std::vector và smart pointer để class bao ngoài không cần tự
        viết destructor, copy hay move constructor.
    rubric:
      required:
        - Nêu đúng vấn đề mà chủ đề giải quyết.
        - Mô tả đúng cơ chế hoặc contract C++17 liên quan.
        - Không nhầm tính năng C++17 với hành vi phụ thuộc compiler.
      bonus:
        - Liên hệ được tác động ở compile time với hành vi quan sát được lúc chạy.
      misconceptions:
        - Chỉ nhắc tên tính năng mà không giải thích mục đích hoặc ràng buộc.
