    prompt: Capture có thể ngăn lời gọi lambda trở thành constant expression thế nào?
    hint: Xác định invariant về kiểu, lifetime, ownership, invalidation hoặc ordering trước khi đề xuất
      cách xử lý nhỏ nhất.
    answer:
      short: Đánh dấu variable constexpr không làm operation với runtime argument thành constant; constant
        evaluation phụ thuộc toàn call expression.Build thành công chưa đủ; phải kiểm tra lifetime,
        ordering và error path.
      detailed: >-
        Đánh dấu variable constexpr không làm operation với runtime argument thành constant;
        constant evaluation phụ thuộc toàn call expression.Build thành công chưa đủ; phải kiểm tra
        lifetime, ordering và error path.


        Nên dùng kỹ thuật này khi policy hoặc transformation ngắn nên giữ cục bộ nhưng cũng phải
        chạy trong compile-time context.Nên chọn cách C++11/14 đơn giản hơn nếu quy tắc C++17 không
        cải thiện safety, độ rõ hoặc hiệu năng đã đo trên các toolchain phải hỗ trợ.


        Constexpr lambda có thể evaluate sớm khi mọi input cho phép, đồng thời vẫn là callable bình
        thường.Phải chọn rõ chế độ C++17; default của compiler mới hơn có thể che lỗi
        portability.Warning và ví dụ xác định biến quy tắc ghi nhớ thành bằng chứng.
