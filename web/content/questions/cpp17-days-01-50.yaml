      \    const fs::path input{\"logs/../data/report.txt\"};\r

      \    const fs::path normalized = input.lexically_normal();\r

      \    fs::path changed = normalized;\r

      \    changed.replace_extension(\".csv\");\r

      \r

      \    std::cout << \"normalized: \" << normalized.generic_string() << '\\n';\r

      \    std::cout << \"filename: \" << normalized.filename().string() << '\\n';\r

      \    std::cout << \"changed: \" << changed.generic_string() << '\\n';\r

      }\r\n"
