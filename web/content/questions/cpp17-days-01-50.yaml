    estimatedMinutes: 5
    prompt: Phép trừ khác nhau thế nào giữa left fold và right fold trên cùng pack?
    hint: Xác định invariant về kiểu, lifetime, ownership, invalidation hoặc ordering trước khi đề xuất
      cách xử lý nhỏ nhất.
    answer:
      short: Fold trái và phải có thể khác với operator không associative; empty unary fold chỉ được định
        nghĩa cho một nhóm operator hạn chế.Build thành công chưa đủ; phải kiểm tra lifetime,
        ordering và error path.
      detailed: >-
        Fold trái và phải có thể khác với operator không associative; empty unary fold chỉ được định
        nghĩa cho một nhóm operator hạn chế.Build thành công chưa đủ; phải kiểm tra lifetime,
        ordering và error path.


        Nên dùng kỹ thuật này khi một operator kết hợp hoặc sắp thứ tự mọi phần tử của variadic
        parameter pack.Nên chọn cách C++11/14 đơn giản hơn nếu quy tắc C++17 không cải thiện safety,
        độ rõ hoặc hiệu năng đã đo trên các toolchain phải hỗ trợ.


        Chọn hướng fold và identity dựa trên semantics của operator, không chỉ dựa vào cách viết
        ngắn.Phải chọn rõ chế độ C++17; default của compiler mới hơn có thể che lỗi
        portability.Warning và ví dụ xác định biến quy tắc ghi nhớ thành bằng chứng.
