    hint: Xác định invariant về kiểu, lifetime, ownership, invalidation hoặc ordering trước khi đề xuất
      cách xử lý nhỏ nhất.
    answer:
      short: "Named return value optimization vẫn khác: return named local có thể cần move hoặc copy truy
        cập được nếu optional NRVO không xảy ra.Build thành công chưa đủ; phải kiểm tra lifetime,
        ordering và error path."
      detailed: >-
        Named return value optimization vẫn khác: return named local có thể cần move hoặc copy truy
        cập được nếu optional NRVO không xảy ra.Build thành công chưa đủ; phải kiểm tra lifetime,
        ordering và error path.


        Nên dùng kỹ thuật này khi factory tự nhiên tạo rồi return fresh value đúng result type đã
        khai báo.Nên chọn cách C++11/14 đơn giản hơn nếu quy tắc C++17 không cải thiện safety, độ rõ
        hoặc hiệu năng đã đo trên các toolchain phải hỗ trợ.


        Hãy return value tự nhiên; không thêm std::move vào fresh prvalue và phải phân biệt
        guaranteed elision với optional NRVO.Phải chọn rõ chế độ C++17; default của compiler mới hơn
        có thể che lỗi portability.Warning và ví dụ xác định biến quy tắc ghi nhớ thành bằng chứng.
