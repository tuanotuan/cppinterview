    estimatedMinutes: 5
    prompt: Production API sẽ báo exact offset và reason của malformed input thế nào?
    hint: Xác định invariant về kiểu, lifetime, ownership, invalidation hoặc ordering trước khi đề xuất
      cách xử lý nhỏ nhất.
    answer:
      short: Nhận partial token, bỏ overflow, shift trước widen hoặc giả định native struct layout có thể
        tạo bug security và portability.Build thành công chưa đủ; phải kiểm tra lifetime, ordering
        và error path.
      detailed: >-
        Nhận partial token, bỏ overflow, shift trước widen hoặc giả định native struct layout có thể
        tạo bug security và portability.Build thành công chưa đủ; phải kiểm tra lifetime, ordering
        và error path.


        Nên dùng kỹ thuật này khi format có tài liệu cung cấp token grammar, byte width, bound và
        byte order chặt.Nên chọn cách C++11/14 đơn giản hơn nếu quy tắc C++17 không cải thiện
        safety, độ rõ hoặc hiệu năng đã đo trên các toolchain phải hỗ trợ.


        Parsing portable validate syntax và range trước, rồi dựng value rõ theo external format.Phải
        chọn rõ chế độ C++17; default của compiler mới hơn có thể che lỗi portability.Warning và ví
        dụ xác định biến quy tắc ghi nhớ thành bằng chứng.
    rubric:
      required:
        - Chỉ ra chính xác quy tắc C++17 hoặc invariant có liên quan.
        - Giải thích hậu quả quan sát được, lỗi compile hoặc undefined behavior nếu có.
        - Đề xuất xử lý nhỏ nhất loại bỏ nguyên nhân thay vì che triệu chứng.
      bonus:
        - Nêu được trade-off của cách xử lý đối với API, lifetime hoặc hiệu năng.
      misconceptions:
        - Cho rằng chương trình an toàn chỉ vì có thể compile hoặc chạy một lần.
