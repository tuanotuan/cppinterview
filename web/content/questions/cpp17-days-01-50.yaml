      #include <cstdint>\r

      #include <iomanip>\r

      #include <iostream>\r

      #include <string_view>\r

      #include <system_error>\r

      \r

      bool parse_bytes(std::string_view text,\r

      \                 std::array<std::byte, 4>& output) {\r

      \    std::size_t position = 0;\r

      \    for (std::byte& byte : output) {\r

      \        while (position < text.size() && text[position] == ' ') ++position;\r

      \        const std::size_t start = position;\r

      \        while (position < text.size() && text[position] != ' ') ++position;\r

