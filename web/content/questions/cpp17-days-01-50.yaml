        quy tắc C++17.
      detailed: >-
        std::filesystem::path lưu path theo native model của platform và cung cấp operation hiểu
        component. Method như lexically_normal đổi syntax mà không chạm filesystem, còn query và
        mutation có thể lỗi bằng exception hoặc std::error_code.


