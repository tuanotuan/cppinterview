  - id: cpp17-pmr-pool-allocation-free-hot-path-002
    lessonId: cpp17-pmr-pool-allocation-free-hot-path
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Vì sao `clear` không giảm vector capacity?
    code: "#include <array>\r

      #include <cstddef>\r

      #include <iostream>\r

      #include <memory_resource>\r

      #include <numeric>\r

      #include <vector>\r

      \r

      int main() {\r

      \    std::array<std::byte, 8192> storage{};\r

      \    std::pmr::monotonic_buffer_resource upstream{\r

      \        storage.data(), storage.size(),\r

      \        std::pmr::null_memory_resource()};\r

      \    std::pmr::unsynchronized_pool_resource pool{&upstream};\r

      \    std::pmr::vector<int> values{&pool};\r

      \r

      \    values.reserve(32); // setup phase\r

      \    const auto initial_capacity = values.capacity();\r

      \    for (int repeat = 0; repeat < 100; ++repeat) {\r

      \        values.clear(); // hot path reuses the reserved block\r

      \        for (int value = 0; value < 32; ++value) {\r

      \            values.push_back(value);\r

      \        }\r

      \    }\r

      \r

      \    std::cout << \"capacity stable: \"\r

      \              << (values.capacity() == initial_capacity) << '\\n';\r

      \    std::cout << \"sum: \"\r

      \              << std::accumulate(values.begin(), values.end(), 0) << '\\n';\r

      }\r\n"
    hint: Lần theo dữ liệu cố định trong mã mẫu, rồi gắn từng kết quả với quy tắc ở phần Cách nó hoạt
      động.
    answer:
      short: >-
        Fixed byte buffer làm backing cho monotonic upstream resource, resource đó cấp cho
        unsynchronized pool và một PMR vector.Sau reserve, clear và push lặp vẫn trong vector
        capacity ban đầu; null upstream ngăn hidden heap fallback.Chương trình in capacity stable: 1
        và sum: 496, tạo test oracle nhỏ để so sánh với dự đoán trước khi biên dịch.


        File `.cpp` dùng dữ liệu cố định. Hãy dự đoán kết quả, biên dịch rồi đối chiếu từng dòng với
        quy tắc C++17.
      detailed: >-
        unsynchronized_pool_resource reuse block theo size class không internal lock và chỉ phù hợp
        khi một thread sở hữu từ bên ngoài. Reserve vector trước timed loop giúp clear-and-refill
        sau đó không allocation storage nếu không vượt capacity.


        Fixed byte buffer làm backing cho monotonic upstream resource, resource đó cấp cho
        unsynchronized pool và một PMR vector.Sau reserve, clear và push lặp vẫn trong vector
        capacity ban đầu; null upstream ngăn hidden heap fallback.Chương trình in capacity stable: 1
        và sum: 496, tạo test oracle nhỏ để so sánh với dự đoán trước khi biên dịch.


        Hierarchy có lifetime rõ và an toàn theo thứ tự ngược. Iteration cuối lưu zero tới
        thirty-one, có sum 496.


