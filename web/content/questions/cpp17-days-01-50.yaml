    prompt: Map/set node handles, extract và merge giải quyết vấn đề chính nào?
    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu ràng buộc mà tính năng làm rõ.
    answer:
      short: Chuyển element giữa associative container hoặc đổi map key trước đây cần allocation và
        reconstruction vì key là const qua iterator. C++17 cung cấp detached node bằng handle có
        ownership.
      detailed: >-
        Chuyển element giữa associative container hoặc đổi map key trước đây cần allocation và
        reconstruction vì key là const qua iterator. C++17 cung cấp detached node bằng handle có
        ownership.


        extract gỡ node mà không hủy key và value. Node handle không rỗng sở hữu node, cho phép đổi
        key và insert vào container tương thích; merge chỉ chuyển node có key được nhận.
    rubric:
