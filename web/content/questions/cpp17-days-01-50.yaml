    interviewFormat: bug_hunt
    estimatedMinutes: 5
    prompt: Vì sao `std::any` không thể lưu trực tiếp move-only value thường trong C++17?
    hint: Xác định invariant về kiểu, lifetime, ownership, invalidation hoặc ordering trước khi đề xuất
      cách xử lý nhỏ nhất.
    answer:
      short: Cast thường xuyên và stored type không được document chuyển error từ compile time sang
        runtime; variant tốt hơn khi alternative set đóng.Build thành công chưa đủ; phải kiểm tra
        lifetime, ordering và error path.
      detailed: >-
        Cast thường xuyên và stored type không được document chuyển error từ compile time sang
        runtime; variant tốt hơn khi alternative set đóng.Build thành công chưa đủ; phải kiểm tra
        lifetime, ordering và error path.


        Nên dùng kỹ thuật này khi boundary mở cần sở hữu heterogeneous copyable value và runtime
        discovery là chủ đích.Nên chọn cách C++11/14 đơn giản hơn nếu quy tắc C++17 không cải thiện
        safety, độ rõ hoặc hiệu năng đã đo trên các toolchain phải hỗ trợ.


        Type erasure đổi compile-time knowledge lấy interface flexibility; giữ storage protocol nhỏ
        và có tài liệu.Phải chọn rõ chế độ C++17; default của compiler mới hơn có thể che lỗi
        portability.Warning và ví dụ xác định biến quy tắc ghi nhớ thành bằng chứng.
