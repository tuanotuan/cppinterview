questions:
  - id: cpp17-toolchain-compiler-flags-cpp17-001
    lessonId: cpp17-toolchain-compiler-flags-cpp17
    type: recall
    responseMode: text
    difficulty: beginner
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: Toolchain, compiler flags và chế độ C++17 giải quyết vấn đề chính nào?
    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu ràng buộc mà tính năng làm rõ.
    answer:
      short: Chỉ source code không tự chọn chuẩn ngôn ngữ, warning policy, optimizer hay input cho linker.
        Lệnh build rõ ràng giúp mọi bài có thể lặp lại và chứng minh cú pháp C++17 thực sự được chấp
        nhận.
      detailed: >-
        Chỉ source code không tự chọn chuẩn ngôn ngữ, warning policy, optimizer hay input cho
        linker. Lệnh build rõ ràng giúp mọi bài có thể lặp lại và chứng minh cú pháp C++17 thực sự
        được chấp nhận.


        Xem toolchain như bốn bước preprocess, compile, assemble và link. Tùy chọn -std=c++17 chọn
        quy tắc ngôn ngữ; -Wall -Wextra -Wpedantic bật chẩn đoán hữu ích, còn -pthread hỗ trợ các
        bài thread.
    rubric:
      required:
        - Nêu đúng vấn đề mà chủ đề giải quyết.
        - Mô tả đúng cơ chế hoặc contract C++17 liên quan.
        - Không nhầm tính năng C++17 với hành vi phụ thuộc compiler.
      bonus:
        - Liên hệ được tác động ở compile time với hành vi quan sát được lúc chạy.
      misconceptions:
        - Chỉ nhắc tên tính năng mà không giải thích mục đích hoặc ràng buộc.
