  - id: cpp17-optional-absent-value-001
    lessonId: cpp17-optional-absent-value
    type: recall
    responseMode: text
    difficulty: beginner
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: std::optional và biểu diễn giá trị có thể vắng mặt giải quyết vấn đề chính nào?
    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu ràng buộc mà tính năng làm rõ.
    answer:
      short: Sentinel như minus one làm quá tải value domain và caller dễ quên kiểm tra. std::optional<T>
        biểu diễn rõ hoặc có live T hoặc không có value.
      detailed: >-
        Sentinel như minus one làm quá tải value domain và caller dễ quên kiểm tra. std::optional<T>
        biểu diễn rõ hoặc có live T hoặc không có value.


        Optional sở hữu in-place storage cho T cùng engagement state. Nó không tự allocate chỉ vì là
        optional; construct, reset hoặc assign thay lifetime của contained object.
