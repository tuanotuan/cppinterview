  - id: cpp17-thread-atomic-memory-model-review-002
    lessonId: cpp17-thread-atomic-memory-model-review
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Write nào trở nên visible sau khi acquire load quan sát release store?
    code: "#include <atomic>\r

      #include <iostream>\r

      #include <thread>\r

      \r

      int main() {\r

      \    int payload = 0;\r

      \    std::atomic<bool> ready{false};\r

      \r

      \    std::thread producer([&] {\r

      \        payload = 42;\r

      \        ready.store(true, std::memory_order_release);\r

      \    });\r

      \    std::thread consumer([&] {\r

      \        while (!ready.load(std::memory_order_acquire)) {\r

      \            std::this_thread::yield();\r

      \        }\r

      \        std::cout << \"payload: \" << payload << '\\n';\r

      \    });\r

      \    producer.join();\r

      \    consumer.join();\r

      }\r\n"
    hint: Lần theo dữ liệu cố định trong mã mẫu, rồi gắn từng kết quả với quy tắc ở phần Cách nó hoạt
      động.
    answer:
      short: >-
        Producer ghi integer không atomic rồi publish ready bằng release store.Consumer spin bằng
        acquire load; sau khi thấy true, nó đọc được payload vì synchronization đã order các truy
        cập.Chương trình in payload: 42 sau khi cả hai thread được join, tạo test oracle nhỏ để so
        sánh với dự đoán trước khi biên dịch.


