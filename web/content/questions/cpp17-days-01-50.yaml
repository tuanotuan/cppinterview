    answer:
      short: Dựng class template thường lặp type information đã rõ từ constructor argument. Class template
        argument deduction, hay CTAD, cho compiler suy ra template argument tại variable
        declaration.
      detailed: >-
        Dựng class template thường lặp type information đã rõ từ constructor argument. Class
        template argument deduction, hay CTAD, cho compiler suy ra template argument tại variable
        declaration.


        Khi template name không có argument list trong declaration phù hợp, constructor và deduction
        guide tạo candidate. Candidate được chọn xác định specialization trước, rồi ordinary
        construction khởi tạo concrete type.
