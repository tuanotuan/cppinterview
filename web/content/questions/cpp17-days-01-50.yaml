    lessonId: cpp17-chrono-rounding-time-point-conversion
    type: recall
    responseMode: text
    difficulty: beginner
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: Chrono rounding, floor, ceil và time-point conversion giải quyết vấn đề chính nào?
    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu ràng buộc mà tính năng làm rõ.
    answer:
      short: Cast duration chỉ truncate về zero, nhưng ứng dụng thường cần floor, ceiling hoặc nearest rõ.
        C++17 thêm chrono rounding operation có tên để ý định nhìn thấy được.
      detailed: >-
        Cast duration chỉ truncate về zero, nhưng ứng dụng thường cần floor, ceiling hoặc nearest
        rõ. C++17 thêm chrono rounding operation có tên để ý định nhìn thấy được.


        std::chrono::floor chọn target duration lớn nhất không vượt input, ceil chọn nhỏ nhất không
        dưới input, còn round chọn gần nhất và tie-to-even. Time point convert qua duration từ
        epoch.
    rubric:
      required:
        - Nêu đúng vấn đề mà chủ đề giải quyết.
        - Mô tả đúng cơ chế hoặc contract C++17 liên quan.
        - Không nhầm tính năng C++17 với hành vi phụ thuộc compiler.
      bonus:
        - Liên hệ được tác động ở compile time với hành vi quan sát được lúc chạy.
      misconceptions:
        - Chỉ nhắc tên tính năng mà không giải thích mục đích hoặc ràng buộc.
