    prompt: Mutex, condition variable và producer–consumer design giải quyết vấn đề chính nào?
    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu ràng buộc mà tính năng làm rõ.
    answer:
      short: Consumer nên sleep khi queue rỗng thay vì spin, nhưng wakeup không được làm mất state change
        hay race với shutdown. Condition variable điều phối wait quanh predicate được mutex bảo vệ.
      detailed: >-
        Consumer nên sleep khi queue rỗng thay vì spin, nhưng wakeup không được làm mất state change
        hay race với shutdown. Condition variable điều phối wait quanh predicate được mutex bảo vệ.


        Mutex bảo vệ cả queue lẫn completion flag. Consumer wait với predicate tương đương
        !queue.empty() || done; wait atomically release mutex khi ngủ rồi reacquire trước khi
        return.
    rubric:
