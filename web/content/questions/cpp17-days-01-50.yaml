    prompt: Vì sao callback trả 10 thay vì 99?
    code: "#include <functional>\r

      #include <iostream>\r

      \r

      class Counter {\r

      public:\r

      \    explicit Counter(int value) : value_(value) {}\r

      \r

      \    auto snapshot() const {\r

      \        return [*this] { return value_; };\r

      \    }\r

      \r

      \    void set(int value) { value_ = value; }\r

      \r

      private:\r

      \    int value_;\r

      };\r

      \r

      std::function<int()> make_callback() {\r

      \    Counter counter{10};\r

      \    auto callback = counter.snapshot();\r

      \    counter.set(99);\r

      \    return callback;\r

      }\r

      \r

      int main() {\r

      \    const auto callback = make_callback();\r

      \    std::cout << \"snapshot: \" << callback() << '\\n';\r

      }\r\n"
