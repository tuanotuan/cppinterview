    estimatedMinutes: 2
    prompt: Inclusive scan, exclusive scan và transform scan giải quyết vấn đề chính nào?
    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu ràng buộc mà tính năng làm rõ.
    answer:
      short: "Nhiều algorithm cần mọi prefix result thay vì một final reduction: running total, offset,
        cumulative product và transformed prefix. C++17 cung cấp scan algorithm cho các pattern
        này."
      detailed: >-
        Nhiều algorithm cần mọi prefix result thay vì một final reduction: running total, offset,
        cumulative product và transformed prefix. C++17 cung cấp scan algorithm cho các pattern này.


        inclusive_scan gồm current input trong mỗi output, còn exclusive_scan ghi prefix trước
        current input nên cần initial value. Transform scan áp unary transform trước khi kết hợp.
    rubric:
