    answer:
      short: >-
        Bốn hexadecimal token trong string view được parse vào fixed byte array với range check đầy
        đủ.Các byte được widen rồi fold trái theo network order đã khai báo để tạo integer 32-bit
        độc lập host representation.Chương trình in parsed: 12 34 56 78 và word: 12345678, tạo test
        oracle nhỏ để so sánh với dự đoán trước khi biên dịch.


