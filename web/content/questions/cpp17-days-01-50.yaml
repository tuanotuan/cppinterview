    answer:
      short: Một producer và một consumer có thể cần channel bounded, low-latency mà không block bằng
        mutex. Ring buffer với index có owner riêng có thể cài concurrency contract hẹp này.
      detailed: >-
        Một producer và một consumer có thể cần channel bounded, low-latency mà không block bằng
        mutex. Ring buffer với index có owner riêng có thể cài concurrency contract hẹp này.


        Chỉ producer ghi head index và chỉ consumer ghi tail. Release store publish slot đã hoàn tất
        hoặc removal đã xong; acquire load tương ứng ngăn một phía reuse slot trước khi work phía
        kia visible.
