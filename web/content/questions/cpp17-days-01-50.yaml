        move-from nếu hiểu sai forwarding.Build thành công chưa đủ; phải kiểm tra lifetime, ordering
        và error path.
      detailed: >-
        Tuple element được truyền theo value category của tuple object; có thể vô tình copy hoặc
        move-from nếu hiểu sai forwarding.Build thành công chưa đủ; phải kiểm tra lifetime, ordering
        và error path.


        Nên dùng kỹ thuật này khi generic infrastructure nhận nhiều callable form hoặc argument tự
        nhiên nằm trong tuple.Nên chọn cách C++11/14 đơn giản hơn nếu quy tắc C++17 không cải thiện
        safety, độ rõ hoặc hiệu năng đã đo trên các toolchain phải hỗ trợ.


