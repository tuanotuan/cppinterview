  - id: cpp17-toolchain-compiler-flags-cpp17-002
    lessonId: cpp17-toolchain-compiler-flags-cpp17
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: "`__cplusplus` phải thuộc khoảng nào khi file được compile đúng chế độ C++17?"
    code: "#include <iostream>\r

      #include <utility>\r

      \r

      // Make the selected language mode observable at compile time.\r

      #if __cplusplus < 201703L\r

      #error This example requires C++17 or newer\r

      #endif\r

      \r

      int main() {\r

      \    // Structured bindings provide a small C++17 feature probe.\r

      \    const std::pair<int, int> values{17, 25};\r

      \    const auto [left, right] = values; // C++17 structured binding\r

      \    std::cout << \"C++ level: \" << __cplusplus << '\\n';\r

      \    std::cout << \"sum: \" << left + right << '\\n';\r

      }\r\n"
    hint: Lần theo dữ liệu cố định trong mã mẫu, rồi gắn từng kết quả với quy tắc ở phần Cách nó hoạt
      động.
    answer:
      short: >-
        Preprocessor kiểm tra __cplusplus trước khi compiler dịch khai báo structured binding.Trong
        chế độ C++17 phù hợp, macro ít nhất là 201703L; chuẩn cũ hơn dừng tại lỗi chủ động.Chương
        trình in số biểu thị language level và sum: 42, tạo test oracle nhỏ để so sánh với dự đoán
        trước khi biên dịch.


        File `.cpp` dùng dữ liệu cố định. Hãy dự đoán kết quả, biên dịch rồi đối chiếu từng dòng với
        quy tắc C++17.
      detailed: >-
        Xem toolchain như bốn bước preprocess, compile, assemble và link. Tùy chọn -std=c++17 chọn
        quy tắc ngôn ngữ; -Wall -Wextra -Wpedantic bật chẩn đoán hữu ích, còn -pthread hỗ trợ các
        bài thread.


        Preprocessor kiểm tra __cplusplus trước khi compiler dịch khai báo structured binding.Trong
        chế độ C++17 phù hợp, macro ít nhất là 201703L; chuẩn cũ hơn dừng tại lỗi chủ động.Chương
        trình in số biểu thị language level và sum: 42, tạo test oracle nhỏ để so sánh với dự đoán
        trước khi biên dịch.


        Một pair được tách bằng structured binding, tính năng chưa có trước C++17. Version guard và
        tổng được in giúp nhìn thấy cả chuẩn đã chọn lẫn hành vi chương trình.


        File `.cpp` dùng dữ liệu cố định. Hãy dự đoán kết quả, biên dịch rồi đối chiếu từng dòng với
        quy tắc C++17.
    rubric:
      required:
        - Nêu đúng giá trị, kiểu hoặc trạng thái mà ví dụ tạo ra.
        - Gắn từng kết quả với câu lệnh và quy tắc C++17 tương ứng.
        - Không suy đoán thêm input hoặc trạng thái ngoài mã mẫu.
      bonus:
        - Nêu được hệ quả liên quan đến kiểu, lifetime, ownership hoặc ordering.
      misconceptions:
        - Đoán kết quả mà không lần theo dữ liệu và quy tắc trong mã.
