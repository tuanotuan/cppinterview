    prompt: std::variant và std::visit giải quyết vấn đề chính nào?
    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu ràng buộc mà tính năng làm rõ.
    answer:
      short: Value có thể hợp lệ ở một trong nhiều type đã biết, nhưng union cần theo dõi lifetime thủ
        công còn base-class polymorphism thêm allocation hoặc hierarchy. std::variant là tagged
        union type-safe.
      detailed: >-
        Value có thể hợp lệ ở một trong nhiều type đã biết, nhưng union cần theo dõi lifetime thủ
        công còn base-class polymorphism thêm allocation hoặc hierarchy. std::variant là tagged
        union type-safe.


        Variant sở hữu đúng một active alternative và lưu index. std::visit gọi callable phải hợp lệ
        cho mọi active alternative có thể có trong tập variant được visit.
    rubric:
