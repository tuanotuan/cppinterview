  - id: cpp17-auto-braced-initialization-rules-001
    lessonId: cpp17-auto-braced-initialization-rules
    type: recall
    responseMode: text
    difficulty: beginner
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: Quy tắc mới của auto với braced initialization giải quyết vấn đề chính nào?
    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu ràng buộc mà tính năng làm rõ.
    answer:
      short: Dấu brace có thể là direct-list initialization hoặc std::initializer_list, còn quy tắc cũ
        khiến khác biệt dễ bất ngờ. C++17 phân biệt direct-list và copy-list nhất quán hơn.
      detailed: >-
        Dấu brace có thể là direct-list initialization hoặc std::initializer_list, còn quy tắc cũ
        khiến khác biệt dễ bất ngờ. C++17 phân biệt direct-list và copy-list nhất quán hơn.


        Trong C++17, auto direct{42} suy ra int từ một phần tử. auto copy = {1, 2, 3} vẫn suy ra
        std::initializer_list<int>; direct form nhiều phần tử là ill-formed.
    rubric:
      required:
        - Nêu đúng vấn đề mà chủ đề giải quyết.
        - Mô tả đúng cơ chế hoặc contract C++17 liên quan.
        - Không nhầm tính năng C++17 với hành vi phụ thuộc compiler.
      bonus:
        - Liên hệ được tác động ở compile time với hành vi quan sát được lúc chạy.
      misconceptions:
        - Chỉ nhắc tên tính năng mà không giải thích mục đích hoặc ràng buộc.
