  - id: cpp17-pmr-pool-allocation-free-hot-path-001
    lessonId: cpp17-pmr-pool-allocation-free-hot-path
    type: recall
    responseMode: text
    difficulty: beginner
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: PMR memory pool và allocation-free hot path giải quyết vấn đề chính nào?
    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu ràng buộc mà tính năng làm rõ.
    answer:
      short: Allocation lặp lại trong latency-sensitive loop có thể thêm contention và delay khó đoán. PMR
        pool có thể allocation lúc setup, còn container đã reserve tái dùng capacity trong hot path.
      detailed: >-
        Allocation lặp lại trong latency-sensitive loop có thể thêm contention và delay khó đoán.
        PMR pool có thể allocation lúc setup, còn container đã reserve tái dùng capacity trong hot
        path.


        unsynchronized_pool_resource reuse block theo size class không internal lock và chỉ phù hợp
        khi một thread sở hữu từ bên ngoài. Reserve vector trước timed loop giúp clear-and-refill
        sau đó không allocation storage nếu không vượt capacity.
    rubric:
      required:
        - Nêu đúng vấn đề mà chủ đề giải quyết.
        - Mô tả đúng cơ chế hoặc contract C++17 liên quan.
        - Không nhầm tính năng C++17 với hành vi phụ thuộc compiler.
      bonus:
        - Liên hệ được tác động ở compile time với hành vi quan sát được lúc chạy.
      misconceptions:
        - Chỉ nhắc tên tính năng mà không giải thích mục đích hoặc ràng buộc.
