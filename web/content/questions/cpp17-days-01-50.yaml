    answer:
      short: Non-type template parameter trước đây yêu cầu ghi type cụ thể dù value đã làm type rõ. C++17
        cho phép auto để một template nhận nhiều constant-value type được hỗ trợ.
      detailed: >-
        Non-type template parameter trước đây yêu cầu ghi type cụ thể dù value đã làm type rõ. C++17
        cho phép auto để một template nhận nhiều constant-value type được hỗ trợ.


        Trong template<auto Value>, deduction xác định cả value lẫn type khi instantiate. Value vẫn
        là compile-time template argument; value hoặc type khác tạo specialization khác.
    rubric:
