  - id: cpp17-auto-decltype-generic-lambda-type-deduction-review-002
    lessonId: cpp17-auto-decltype-generic-lambda-type-deduction-review
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Vì sao `copy` vẫn gán được dù initializer được khai báo `const`?
    code: "#include <iostream>\r

      #include <type_traits>\r

      \r

      int main() {\r

      \    const int value = 7;\r

      \    auto copy = value;\r

      \    const auto& alias = value;\r

      \    decltype(value) exact = value;\r

      \r

      \    static_assert(std::is_same_v<decltype(copy), int>);\r

      \    static_assert(std::is_same_v<decltype(alias), const int&>);\r

      \    static_assert(std::is_same_v<decltype(exact), const int>);\r

      \r

      \    const auto twice = [](auto x) { return x + x; };\r

      \    std::cout << \"twice int: \" << twice(5) << '\\n';\r

      \    std::cout << \"twice double: \" << twice(2.5) << '\\n';\r

      }\r\n"
    hint: Lần theo dữ liệu cố định trong mã mẫu, rồi gắn từng kết quả với quy tắc ở phần Cách nó hoạt
      động.
    answer:
      short: >-
