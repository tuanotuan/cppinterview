  - id: cpp17-inline-variables-odr-003
    lessonId: cpp17-inline-variables-odr
    type: pitfall
    responseMode: text
    difficulty: advanced
    interviewCategory: code_review_debug
    interviewFormat: bug_hunt
    estimatedMinutes: 5
    prompt: Khác biệt nào giữa các inline definition được cho là giống nhau vi phạm ODR, và vì sao có
      thể không có diagnostic?
    hint: Xác định invariant về kiểu, lifetime, ownership, invalidation hoặc ordering trước khi đề xuất
      cách xử lý nhỏ nhất.
    answer:
      short: Inline không cho phép initializer hay definition khác nhau giữa translation unit; vi phạm ODR
        vẫn có thể làm program ill-formed mà không buộc diagnostic.Build thành công chưa đủ; phải
        kiểm tra lifetime, ordering và error path.
      detailed: >-
        Inline không cho phép initializer hay definition khác nhau giữa translation unit; vi phạm
        ODR vẫn có thể làm program ill-formed mà không buộc diagnostic.Build thành công chưa đủ;
        phải kiểm tra lifetime, ordering và error path.


        Nên dùng kỹ thuật này khi constant trong header hoặc shared static data cần một identity
        trên toàn program.Nên chọn cách C++11/14 đơn giản hơn nếu quy tắc C++17 không cải thiện
        safety, độ rõ hoặc hiệu năng đã đo trên các toolchain phải hỗ trợ.


        Inline variable giải quyết vị trí definition chứ không hợp thức hóa global state tùy tiện;
        ưu tiên immutable và interface hẹp.Phải chọn rõ chế độ C++17; default của compiler mới hơn
        có thể che lỗi portability.Warning và ví dụ xác định biến quy tắc ghi nhớ thành bằng chứng.
    rubric:
      required:
        - Chỉ ra chính xác quy tắc C++17 hoặc invariant có liên quan.
        - Giải thích hậu quả quan sát được, lỗi compile hoặc undefined behavior nếu có.
        - Đề xuất xử lý nhỏ nhất loại bỏ nguyên nhân thay vì che triệu chứng.
      bonus:
        - Nêu được trade-off của cách xử lý đối với API, lifetime hoặc hiệu năng.
      misconceptions:
        - Cho rằng chương trình an toàn chỉ vì có thể compile hoặc chạy một lần.
