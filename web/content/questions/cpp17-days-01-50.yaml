    lessonId: cpp17-object-lifetime-raii-move-rule-of-zero-review
    type: code_reasoning
    responseMode: text
    difficulty: intermediate
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 4
    prompt: Object nào sở hữu phần tử vector sau move, và thao tác nào vẫn an toàn với source?
    code: "#include <iostream>\r

      #include <string>\r

      #include <utility>\r

      #include <vector>\r

      \r

      struct Batch {\r

      \    std::string name;\r

      \    std::vector<int> values;\r

      }; // Rule of Zero\r

      \r

      int main() {\r

      \    Batch source{\"scores\", {10, 20, 30}};\r

      \    Batch destination = std::move(source);\r

      \    std::cout << \"name: \" << destination.name << '\\n';\r

      \    std::cout << \"count: \" << destination.values.size() << '\\n';\r

      \    source.values.clear(); // moved-from object is still valid\r

      \    std::cout << \"source valid: \" << source.values.empty() << '\\n';\r

      }\r\n"
    hint: Lần theo dữ liệu cố định trong mã mẫu, rồi gắn từng kết quả với quy tắc ở phần Cách nó hoạt
      động.
    answer:
      short: >-
        Một aggregate theo Rule of Zero sở hữu chuỗi và dãy động qua value member của thư viện
        chuẩn.Move operation do compiler sinh yêu cầu từng member move; source và destination vẫn là
        object hợp lệ tới khi scope kết thúc.Chương trình in tên và số phần tử của destination, cùng
        Boolean cho thấy source sau move vẫn hợp lệ, tạo test oracle nhỏ để so sánh với dự đoán
        trước khi biên dịch.


        File `.cpp` dùng dữ liệu cố định. Hãy dự đoán kết quả, biên dịch rồi đối chiếu từng dòng với
        quy tắc C++17.
      detailed: >-
        Object bắt đầu lifetime sau khi được khởi tạo hợp lệ và kết thúc khi destructor chạy. Ưu
        tiên member như std::string, std::vector và smart pointer để class bao ngoài không cần tự
        viết destructor, copy hay move constructor.


        Một aggregate theo Rule of Zero sở hữu chuỗi và dãy động qua value member của thư viện
        chuẩn.Move operation do compiler sinh yêu cầu từng member move; source và destination vẫn là
        object hợp lệ tới khi scope kết thúc.Chương trình in tên và số phần tử của destination, cùng
        Boolean cho thấy source sau move vẫn hợp lệ, tạo test oracle nhỏ để so sánh với dự đoán
        trước khi biên dịch.


        Batch không khai báo special member function nào. Move chuyển trạng thái hiệu quả, còn
        automatic destruction sau đó giải phóng mọi member mà không cần nhánh cleanup.


