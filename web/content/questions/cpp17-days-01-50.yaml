      \r

      int main() {\r

      \    const std::uint32_t original = 0x12345678u;\r

      \    std::array<std::byte, sizeof(original)> representation{};\r

      \    std::memcpy(representation.data(), &original, sizeof original);\r

      \r

      \    std::uint32_t restored = 0;\r

      \    std::memcpy(&restored, representation.data(), sizeof restored);\r

      \r

      \    const std::byte data{0xAB};\r

      \    const std::byte low = data & std::byte{0x0F};\r

      \    std::cout << \"round trip: \" << std::hex << restored << '\\n';\r

