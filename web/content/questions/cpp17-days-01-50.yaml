    estimatedMinutes: 2
    prompt: Lambda capture *this và object lifetime giải quyết vấn đề chính nào?
    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu ràng buộc mà tính năng làm rõ.
    answer:
      short: Capture this chỉ copy pointer, nên callback sống lâu hơn object có thể dereference dangling
        pointer. C++17 thêm [*this] để capture snapshot của object theo value.
      detailed: >-
        Capture this chỉ copy pointer, nên callback sống lâu hơn object có thể dereference dangling
        pointer. C++17 thêm [*this] để capture snapshot của object theo value.


        [*this] lưu bản copy object hiện tại trong closure. Member access trong lambda chỉ bản copy
        đó, nên thay đổi hay destruction của original không làm snapshot invalid nếu copy từng
        member an toàn.
    rubric:
