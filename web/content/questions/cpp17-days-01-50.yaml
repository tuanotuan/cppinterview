  - id: cpp17-cpp14-to-cpp17-migration-compatibility-003
    lessonId: cpp17-cpp14-to-cpp17-migration-compatibility
    type: pitfall
    responseMode: text
    difficulty: advanced
    interviewCategory: code_review_debug
    interviewFormat: bug_hunt
    estimatedMinutes: 5
    prompt: Vì sao hai compiler cùng báo C++17 mode nhưng khác nhau về standard-library facility dùng được?
    hint: Xác định invariant về kiểu, lifetime, ownership, invalidation hoặc ordering trước khi đề xuất
      cách xử lý nhỏ nhất.
    answer:
      short: Chỉ kiểm tra __cplusplus có thể bỏ sót library implementation chưa đủ hoặc dependency ABI
        issue; phải compile và chạy matrix thật.Build thành công chưa đủ; phải kiểm tra lifetime,
        ordering và error path.
      detailed: >-
        Chỉ kiểm tra __cplusplus có thể bỏ sót library implementation chưa đủ hoặc dependency ABI
        issue; phải compile và chạy matrix thật.Build thành công chưa đủ; phải kiểm tra lifetime,
        ordering và error path.


        Nên dùng kỹ thuật này khi codebase cần tăng minimum standard trong khi release vẫn
        reproducible và có thể rollback.Nên chọn cách C++11/14 đơn giản hơn nếu quy tắc C++17 không
        cải thiện safety, độ rõ hoặc hiệu năng đã đo trên các toolchain phải hỗ trợ.


        Migration là chương trình compatibility bao phủ compiler, standard library, dependency,
        warning, test, performance và deployment.Phải chọn rõ chế độ C++17; default của compiler mới
        hơn có thể che lỗi portability.Warning và ví dụ xác định biến quy tắc ghi nhớ thành bằng
        chứng.
    rubric:
      required:
        - Chỉ ra chính xác quy tắc C++17 hoặc invariant có liên quan.
        - Giải thích hậu quả quan sát được, lỗi compile hoặc undefined behavior nếu có.
        - Đề xuất xử lý nhỏ nhất loại bỏ nguyên nhân thay vì che triệu chứng.
      bonus:
        - Nêu được trade-off của cách xử lý đối với API, lifetime hoặc hiệu năng.
      misconceptions:
        - Cho rằng chương trình an toàn chỉ vì có thể compile hoặc chạy một lần.
