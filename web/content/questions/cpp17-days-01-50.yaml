    code: "#include <array>\r

      #include <atomic>\r

      #include <cstddef>\r

      #include <iostream>\r

      #include <thread>\r

      \r

      template <class T, std::size_t Capacity>\r

      class SpscQueue {\r

      \    static_assert(Capacity > 1);\r

      \r

      public:\r

      \    bool push(T value) {\r

      \        const auto head = head_.load(std::memory_order_relaxed);\r

      \        const auto next = (head + 1) % Capacity;\r

      \        if (next == tail_.load(std::memory_order_acquire)) return false;\r

      \        buffer_[head] = value;\r

      \        head_.store(next, std::memory_order_release);\r

      \        return true;\r

      \    }\r

      \r

      \    bool pop(T& value) {\r

      \        const auto tail = tail_.load(std::memory_order_relaxed);\r

      \        if (tail == head_.load(std::memory_order_acquire)) return false;\r

      \        value = buffer_[tail];\r

      \        tail_.store((tail + 1) % Capacity, std::memory_order_release);\r

      \        return true;\r

      \    }\r

      \r

      private:\r

      \    std::array<T, Capacity> buffer_{};\r

      \    std::atomic<std::size_t> head_{0};\r

