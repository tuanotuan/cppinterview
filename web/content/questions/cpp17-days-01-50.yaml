      \    static_assert(__cpp_structured_bindings >= 201606L);\r

      \    const auto [left, right] = values;\r

      \    std::cout << \"mode: C++17\\n\";\r

      #else\r

      \    const int left = values.first;\r

      \    const int right = values.second;\r

