        quy tắc C++17.
      detailed: >-
        Parse từng token phân cách trong view range rõ, yêu cầu consume hết, reject value lớn hơn
        một byte, rồi assemble big-endian representation đã khai báo bằng cách widen trước shift.
        Không reinterpret external byte thành native struct.


