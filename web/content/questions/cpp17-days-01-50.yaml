  - id: cpp17-evaluation-order-noexcept-function-type-001
    lessonId: cpp17-evaluation-order-noexcept-function-type
    type: recall
    responseMode: text
    difficulty: beginner
    interviewCategory: language_knowledge
    interviewFormat: concept_explanation
    estimatedMinutes: 2
    prompt: Evaluation order và noexcept trong function type giải quyết vấn đề chính nào?
    hint: Đối chiếu vấn đề ban đầu với ý tưởng cốt lõi và nêu ràng buộc mà tính năng làm rõ.
    answer:
      short: Evaluation operand không rõ có thể làm side effect bất ngờ, còn exception specification trước
        đây tham gia hạn chế vào type relationship. C++17 tăng một số sequencing rule và đưa
        noexcept vào function type.
      detailed: >-
        Evaluation operand không rõ có thể làm side effect bất ngờ, còn exception specification
        trước đây tham gia hạn chế vào type relationship. C++17 tăng một số sequencing rule và đưa
        noexcept vào function type.


        Với assignment trong C++17, right operand được sequenced trước left operand. Riêng function
        pointer type có thể yêu cầu function không throw, cho phép phân biệt compile time giữa
        target có thể throw và noexcept.
    rubric:
      required:
        - Nêu đúng vấn đề mà chủ đề giải quyết.
        - Mô tả đúng cơ chế hoặc contract C++17 liên quan.
        - Không nhầm tính năng C++17 với hành vi phụ thuộc compiler.
      bonus:
        - Liên hệ được tác động ở compile time với hành vi quan sát được lúc chạy.
      misconceptions:
        - Chỉ nhắc tên tính năng mà không giải thích mục đích hoặc ràng buộc.
